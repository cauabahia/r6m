<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>R6 Esports Manager Simulator</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#161920;
    --card-alt:#1c202a;
    --line:#262b36;
    --gold:#ffcc00;
    --gold-dim:#8a7300;
    --text:#eef0f4;
    --muted:#8891a3;
    --red:#e6483b;
    --green:#38c172;
    --blue:#4c9be8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    padding:24px 16px 70px;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:820px;margin:0 auto;}
  h1,h2,h3{margin:0;}
  .eyebrow{
    font-family:'Consolas','Courier New',monospace;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);margin-bottom:8px;
  }
  .top-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .top-brand .dot{width:9px;height:9px;background:var(--red);transform:rotate(45deg);}
  .top-brand span{font-family:'Consolas','Courier New',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  .title{font-size:36px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;margin:0 0 4px;line-height:1.05;}
  .title .accent{color:var(--gold);}
  .subtitle{color:var(--muted);font-size:14px;max-width:600px;margin:6px 0 18px;line-height:1.5;}
  .steps{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:26px;}
  .step{flex:1;padding:9px 0;text-align:center;font-family:'Consolas','Courier New',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#3d4250;border-right:1px solid var(--line);}
  .step:last-child{border-right:none;}
  .step.active{color:var(--gold);background:var(--card);}
  .step.done{color:var(--muted);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 3px 0 rgba(0,0,0,.35);}
  .card + .card{margin-top:14px;}

  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:8px;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:disabled{cursor:default;opacity:.4;}
  button:active:not(:disabled){transform:translateY(2px);box-shadow:none !important;}
  .btn-primary{
    background:var(--gold);color:#171400;font-weight:700;font-size:15px;
    padding:13px 26px;text-transform:uppercase;letter-spacing:.03em;
    box-shadow:0 4px 0 var(--gold-dim);
  }
  .btn-ghost{
    background:var(--card-alt);color:var(--text);border:1px solid var(--line) !important;
    font-weight:600;font-size:13px;padding:10px 16px;text-transform:uppercase;letter-spacing:.03em;
    box-shadow:0 2px 0 rgba(0,0,0,.3);
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
  .op-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}

  .player-card{
    background:var(--card-alt);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;text-align:left;width:100%;transition:transform .12s,box-shadow .12s,border-color .12s;
    box-shadow:0 2px 0 rgba(0,0,0,.3);
  }
  .player-card:hover:not(:disabled){border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 0 rgba(0,0,0,.35);}
  .p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .p-name{font-size:17px;font-weight:700;color:var(--text);}
  .p-team{font-family:'Consolas','Courier New',monospace;font-size:11px;color:var(--muted);margin-top:2px;}
  .role-badge{
    display:inline-block;font-family:'Consolas','Courier New',monospace;font-size:10px;
    letter-spacing:.05em;text-transform:uppercase;color:var(--blue);
    border:1px solid var(--blue);border-radius:5px;padding:2px 6px;margin-top:6px;
  }
  .ovr-chip{
    width:38px;height:38px;border-radius:50%;background:var(--card);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-family:'Consolas','Courier New',monospace;font-weight:700;font-size:14px;
    border:2.5px solid var(--gold);color:var(--gold);
    box-shadow:0 2px 0 rgba(255,204,0,.25);
  }
  .stat-row{display:flex;justify-content:space-between;font-family:'Consolas','Courier New',monospace;
    font-size:11px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .stat-row b{color:var(--text);font-weight:600;}

  .power-bar-wrap{background:var(--card-alt);border:1px solid var(--line);border-radius:8px;height:14px;overflow:hidden;margin-top:6px;}
  .power-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),#ffe45a);}

  table{width:100%;border-collapse:collapse;font-family:'Consolas','Courier New',monospace;font-size:12.5px;}
  th{text-align:left;padding:8px 10px;color:var(--muted);font-weight:400;border-bottom:1px solid var(--line);}
  td{padding:7px 10px;border-bottom:1px solid var(--line);}
  tr.me{background:rgba(255,204,0,.06);}
  .dot-status{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;}

  .log-feed{
    background:#0a0c10;border:1px solid var(--line);border-radius:8px;
    max-height:220px;overflow-y:auto;padding:4px 12px;margin:14px 0;
    font-family:'Consolas','Courier New',monospace;font-size:12.5px;
  }
  .log-feed .live{color:var(--red);font-weight:700;letter-spacing:.1em;font-size:10px;
    text-transform:uppercase;padding:8px 0 4px;border-bottom:1px dashed var(--line);}
  .log-line{padding:7px 0;border-bottom:1px solid #171a20;line-height:1.4;}
  .log-line.win{color:var(--green);}
  .log-line.loss{color:var(--red);}
  .log-line .meta{color:var(--muted);}

  .op-btn{background:var(--card-alt);border:1px solid var(--line);padding:10px;text-align:left;}
  .op-btn.selected{border-color:var(--gold);background:rgba(255,204,0,.08);}
  .op-btn.banned{opacity:.35;text-decoration:line-through;cursor:default;}
  .op-name{font-weight:700;font-size:13px;}
  .op-trait{font-family:'Consolas','Courier New',monospace;font-size:10px;color:var(--muted);margin-top:2px;}

  .score-hud{
    display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;box-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  .score-num{font-family:'Consolas','Courier New',monospace;font-size:44px;font-weight:800;letter-spacing:-.02em;}
  .score-num .gold{color:var(--gold);}

  .roster-chip{border:1px solid var(--line);background:var(--card-alt);padding:6px 12px;border-radius:8px;
    font-family:'Consolas','Courier New',monospace;font-size:12px;display:flex;align-items:center;gap:8px;}

  .bracket-row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .bracket-row.me{border-left:4px solid var(--gold);}

  .trophy{font-size:56px;}
  .center{text-align:center;}
  .stat-strip{display:flex;gap:22px;flex-wrap:wrap;font-family:'Consolas','Courier New',monospace;font-size:12px;color:var(--muted);margin:16px 0 22px;}
  .stat-strip b{color:var(--gold);}
</style>
</head>
<body>
<div id="app"></div>

  ["Team Falcons","FLCN",[["BriD",0.94],["Shaiiko",1.08],["Yuzus",1.01],["LikEfac",1.02],["Solotov",1.05]]],

  ["Team Liquid","TL",[["Bosco",1.03],["Slashusz",0.95],["SkipS",0.92],["Beast",1.00],["Sensei",0.88]]],
  ["Team Vitality","VIT",[["Risze",1.02],["Sysrigby",0.94],["Kailer",0.90],["Byv",0.98],["Achieved",1.06]]],
  ["TSM","TSM",[["Nyx",0.86],["Retro",0.91],["Lycan",0.89],["Rampy",0.93],["Ecl1pse",0.87]]],
];

const OVR_OVERRIDES = {
  Flexy:86, Mowwwgli:90, Loira:88, Surf:84, Ambi:86, SpeakEasy:88, Kyno:84,
  HerdsZ:93, FelipoX:89, Kheyze:98, Jv92:93, nade:92, Dash:88, bbySharKK:86,
  Dotz:85, Woogiman:90, Cyber:96, KDS:93, soulz:96, VITAKING:95, kondz:85,
  Fntzy:88, Wizard:76, Hatez:84, Psycho:79, Stemp:76, BriD:86, Shaiiko:96,
  LikEfac:92, Solotov:89,
};

function computeOvr(rating){
  const ovr = 60 + ((rating-0.6)/0.65)*39;
  return Math.max(58, Math.min(99, Math.round(ovr)));
}
function computeKd(rating){
  return +(0.80 + (rating-0.6)*0.55).toFixed(2);
}

const TEAMS = TEAMS_RAW.map(([name,tag,players],ti)=>({
  id:ti, name, tag,
  players: players.map(([pname,rating],pi)=>{
    const ovr = OVR_OVERRIDES[pname] ?? computeOvr(rating);
    return {
      id:`${ti}-${pi}`, name:pname, rating, ovr,
      kd:computeKd(rating), role:ROLES[pi], team:name, tag,
    };
  }),
}));
const ALL_PLAYERS = TEAMS.flatMap(t=>t.players);

/* Operadores para a fase de banimento (usados na narrativa dos rounds) */
const OPERATORS = [
  {id:"ace",name:"Ace",side:"ATK",trait:"Brecha rígida (S.E.L.M.A.)"},
  {id:"ash",name:"Ash",side:"ATK",trait:"Entrada rápida (Breaching Rounds)"},
  {id:"iana",name:"Iana",side:"ATK",trait:"Recon com clone holográfico"},
  {id:"zero",name:"Zero",side:"ATK",trait:"Câmera Argus, inteligência"},
  {id:"thermite",name:"Thermite",side:"ATK",trait:"Brecha em reforço (Exothermic)"},
  {id:"nomad",name:"Nomad",side:"ATK",trait:"Controle de flanco (Airjab)"},
  {id:"mira",name:"Mira",side:"DEF",trait:"Info através de parede (Black Mirror)"},
  {id:"jager",name:"Jäger",side:"DEF",trait:"Anula projéteis (ADS)"},
  {id:"bandit",name:"Bandit",side:"DEF",trait:"Anti-brecha eletrônico (Shock Wire)"},
  {id:"valkyrie",name:"Valkyrie",side:"DEF",trait:"Câmeras extras (Black Eye)"},
  {id:"kaid",name:"Kaid",side:"DEF",trait:"Eletrifica reforços (Rtila Electroclaw)"},
  {id:"azami",name:"Azami",side:"DEF",trait:"Barreiras móveis (Kiba Barrier)"},
];

const JARGON_ATK = [
  "{p} plantou o dispositivo e segurou o retake sozinho",
  "{p} usou a informação do drone e entrou limpo no bombsite",
  "{p} flanqueou pelo exterior e pegou o eco kill",
  "{p} forçou a jogada com {op} e abriu o site",
  "{p} conectou um pico de refresh certeiro (peek)",
  "{p} isolou o 1x1 no meio do mapa e venceu o duelo",
];
const JARGON_DEF = [
  "{p} segurou o ângulo com {op} e pegou o entry adversário",
  "{p} rotacionou a tempo e fechou o flanco",
  "{p} usando a informação de uma câmera oculta, eliminou o flanqueador pela parede (wallbang)",
  "{p} negou o dispositivo no último segundo (defuse)",
  "{p} pegou o pick antecipado através do reforço (wallbang de leitura)",
  "{p} manteve o cross-fire e limpou o site sozinho",
];

/* =========================================================
   ESTADO / PERSISTÊNCIA
========================================================= */
const SAVE_KEY = "r6_esports_manager_save_v1";
let state = null;

function freshState(){
  return {
    phase:"intro",
    draftPool: shuffle(ALL_PLAYERS.map(p=>p.id)),
    draftRound:0,
    roster:[],
    swiss:null,
    playoffs:null,
    finalResult:null,
    matchFlow:null, // {opponentId, bo, stageType, stageIndex, banStep, banned, matchIndex}
  };
}
function saveState(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearState(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

function playerById(id){ return ALL_PLAYERS.find(p=>p.id===id); }
function teamRealById(id){ return TEAMS.find(t=>t.id===id); }

/* =========================================================
   UTIL
========================================================= */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmtJargon(tpl, playerName, opName){
  return tpl.replace("{p}", `<b>${playerName}</b>`).replace("{op}", opName||"utilitário");
}

/* --- Time dos sonhos (você) a partir do roster --- */
function buildYouTeamObj(rosterIds, formMap){
  const players = rosterIds.map(id=>playerById(id));
  return makeTeamObj(-1, "SEU TIME", "YOU", players, true, formMap);
}
function makeTeamObj(id,name,tag,players,isPlayer=false, formMap=null){
  return {
    id,name,tag,players,isPlayer,
    wins:0, losses:0, mapDiff:0, status:"ativo",
  };
}

/* --- Entrosamento (chemistry) --- */
function chemistryBonus(players){
  const counts = {};
  players.forEach(p=>{ counts[p.team] = (counts[p.team]||0)+1; });
  const maxGroup = Math.max(...Object.values(counts));
  if(maxGroup < 2) return 0;
  return Math.min(5, 2 + (maxGroup-2));
}

/* --- Forma do dia (variação -3 a +3 aplicada ao OVR) --- */
function applyForm(players){
  const map = {};
  players.forEach(p=>{ map[p.id] = Math.round((Math.random()*6-3)); });
  return map;
}
function effectiveOvr(p, formMap){
  const f = formMap && formMap[p.id] != null ? formMap[p.id] : 0;
  return p.ovr + f;
}
function teamPower(players, formMap, chemBonus){
  const sum = players.reduce((s,p)=>s+effectiveOvr(p,formMap),0);
  return sum + (chemBonus||0);
}

/* --- Simulação --- */
function roundWinProb(powerA, powerB){
  const diff = (powerA - powerB) / 5; // normaliza escala de poder
  const p = 1/(1+Math.pow(10,-diff/9));
  return Math.min(0.94, Math.max(0.06, p));
}
function simulateSeriesQuiet(teamAPlayers, teamBPlayers, bo){
  const formA = applyForm(teamAPlayers), formB = applyForm(teamBPlayers);
  const chemA = chemistryBonus(teamAPlayers), chemB = chemistryBonus(teamBPlayers);
  const powerA = teamPower(teamAPlayers, formA, chemA);
  const powerB = teamPower(teamBPlayers, formB, chemB);
  const need = bo===5?3:bo===3?2:1;
  let wa=0, wb=0;
  while(wa<need && wb<need){
    if(Math.random() < roundWinProb(powerA,powerB)) wa++; else wb++;
  }
  return {wa, wb, aWon: wa>wb};
}

/* =========================================================
   FLUXO DE JOGO — DRAFT
========================================================= */
const OFFER_SIZE = 9;

function startNewCampaign(){
  state = freshState();
  state.phase = "draft";
  saveState();
  render();
}

function currentOffer(){
  const remaining = state.draftPool.filter(id=>!state.roster.includes(id));
  return remaining.slice(0, OFFER_SIZE).map(playerById);
}

function pickPlayer(id){
  state.roster.push(id);
  state.draftRound++;
  if(state.draftRound >= 5){
    beginSwiss();
  }
  saveState();
  render();
}

/* =========================================================
   FASE SUÍÇA
========================================================= */
function beginSwiss(){
  const realTeams = TEAMS.map(t=>makeTeamObj(t.id, t.name, t.tag, t.players));
  const you = buildYouTeamObj(state.roster);
  const teams = shuffle([you, ...realTeams]);
  state.swiss = { teams, round:1, done:false, lastResult:null };
  state.phase = "swiss";
}

function pairSwissRound(teams){
  const active = teams.filter(t=>t.status==="ativo");
  const groups = {};
  active.forEach(t=>{ const k=`${t.wins}-${t.losses}`; (groups[k]=groups[k]||[]).push(t); });
  const pairs=[]; let bye=null; const leftover=[];
  Object.values(groups).forEach(g=>{
    const s = shuffle(g);
    for(let i=0;i<s.length;i+=2){ if(s[i+1]) pairs.push([s[i],s[i+1]]); else leftover.push(s[i]); }
  });
  for(let i=0;i<leftover.length;i+=2){ if(leftover[i+1]) pairs.push([leftover[i],leftover[i+1]]); else bye=leftover[i]; }
  return {pairs, bye};
}

function simulateSwissRound(){
  const {pairs, bye} = pairSwissRound(state.swiss.teams);
  const idx = pairs.findIndex(([a,b])=>a.isPlayer||b.isPlayer);
  if(idx>=0){
    const [a,b] = pairs[idx];
    const opp = a.isPlayer? b : a;
    startMatchFlow(opp, 1, "swiss", pairs, idx, bye);
    return;
  }
  const results = pairs.map(([a,b])=>{
    const r = simulateSeriesQuiet(a.players,b.players,1);
    return {a,b,wa:r.wa,wb:r.wb,winner: r.aWon? a : b};
  });
  finishSwissRound(results, bye);
}

function finishSwissRound(results, bye){
  const updated = state.swiss.teams.map(t=>({...t}));
  results.forEach(({a,b,winner,wa,wb})=>{
    const A = updated.find(t=>t.name===a.name && t.id===a.id);
    const B = updated.find(t=>t.name===b.name && t.id===b.id);
    const aWon = winner.name===a.name && winner.id===a.id;
    if(aWon){ A.wins++; B.losses++; A.mapDiff++; B.mapDiff--; }
    else { B.wins++; A.losses++; B.mapDiff++; A.mapDiff--; }
  });
  if(bye){ const T = updated.find(t=>t.name===bye.name && t.id===bye.id); T.wins++; }
  updated.forEach(t=>{
    if(t.wins>=3) t.status="classificado";
    else if(t.losses>=3) t.status="eliminado";
  });
  const stillActive = updated.some(t=>t.status==="ativo");
  const nextRound = state.swiss.round+1;
  const done = !stillActive || nextRound>6;
  const meResult = results.find(r=>r.a.isPlayer||r.b.isPlayer) || null;
  state.swiss = {teams:updated, round:nextRound, done, lastResult: meResult};
  if(done){ beginPlayoffs(updated); }
  saveState();
  render();
}

/* =========================================================
   PLAYOFFS
========================================================= */
function beginPlayoffs(swissTeams){
  const sorted = [...swissTeams].sort((a,b)=> b.wins!==a.wins? b.wins-a.wins : a.losses!==b.losses? a.losses-b.losses : b.mapDiff-a.mapDiff);
  const seeded = sorted.slice(0,8).map(t=>({...t, wins:0, losses:0, status:"ativo"}));
  const pairs = [[seeded[0],seeded[7]],[seeded[3],seeded[4]],[seeded[1],seeded[6]],[seeded[2],seeded[5]]];
  state.playoffs = {
    roundName:"Quartas de final", stage:0,
    matches: pairs.map(([a,b])=>({a,b,bo:3,done:false})),
    lastResults:null,
  };
  state.phase = "playoffs";
}

function simulatePlayoffRound(){
  const bo = state.playoffs.stage===2?5:3;
  const idx = state.playoffs.matches.findIndex(m=>m.a.isPlayer||m.b.isPlayer);
  if(idx>=0){
    const m = state.playoffs.matches[idx];
    const opp = m.a.isPlayer? m.b : m.a;
    startMatchFlow(opp, bo, "playoffs", null, idx, null);
    return;
  }
  const results = state.playoffs.matches.map(m=>{
    const r = simulateSeriesQuiet(m.a.players,m.b.players,bo);
    return {...m, wa:r.wa, wb:r.wb, winner: r.aWon? m.a : m.b, done:true};
  });
  advancePlayoffs(results);
}

function advancePlayoffs(results){
  const winners = results.map(r=>r.winner);
  if(state.playoffs.stage===2){
    state.finalResult = {champion:winners[0], playerWon:winners[0].isPlayer, finalMatch:results[0]};
    state.playoffs = {...state.playoffs, matches:results, lastResults:results};
    state.phase = "end";
    saveState(); render();
    return;
  }
  const names = ["Semifinal","Grande Final"];
  const nextPairs=[];
  for(let i=0;i<winners.length;i+=2) nextPairs.push([winners[i],winners[i+1]]);
  state.playoffs = {
    roundName:names[state.playoffs.stage],
    stage: state.playoffs.stage+1,
    matches: nextPairs.map(([a,b])=>({a,b,bo:state.playoffs.stage===1?5:3,done:false})),
    lastResults: results,
  };
  saveState();
  render();
}

/* =========================================================
   FLUXO DE PARTIDA DO USUÁRIO (ban de operadores + série ao vivo)
========================================================= */
function startMatchFlow(opponent, bo, stageType, swissPairs, matchIndex, bye){
  const you = buildYouTeamObj(state.roster);
  const chem = chemistryBonus(you.players);
  state.matchFlow = {
    opponent, bo, stageType, matchIndex, swissPairs, bye,
    you, chem,
    step:"ban", // ban -> live -> result
    bannedYou:[], bannedAi:[],
    log:[], roundsA:0, roundsB:0,
    formA:null, formB:null, powerA:0, powerB:0,
  };
  saveState();
  render();
}

function banOperator(op){
  const mf = state.matchFlow;
  if(mf.bannedYou.includes(op.id) || mf.bannedAi.includes(op.id)) return;
  mf.bannedYou.push(op.id);
  if(mf.bannedYou.length < 2){
    // resposta automática da IA
    const available = OPERATORS.filter(o=>!mf.bannedYou.includes(o.id) && !mf.bannedAi.includes(o.id));
    const aiBan = pick(available);
    mf.bannedAi.push(aiBan.id);
  }
  if(mf.bannedYou.length >= 2){
    // finaliza fase de ban, calcula poder e vai para o modo ao vivo
    mf.formA = applyForm(mf.you.players);
    mf.formB = applyForm(mf.opponent.players);
    mf.powerA = teamPower(mf.you.players, mf.formA, mf.chem);
    mf.powerB = teamPower(mf.opponent.players, mf.formB, 0);
    mf.step = "live";
  }
  saveState();
  render();
}

function availableOperators(){
  const mf = state.matchFlow;
  return OPERATORS.filter(o=>!mf.bannedYou.includes(o.id) && !mf.bannedAi.includes(o.id));
}

function simulateRound(){
  const mf = state.matchFlow;
  const roundN = mf.roundsA + mf.roundsB + 1;
  const side = roundN<=6 ? "ATK" : roundN<=12 ? "DEF" : ((roundN-13)%2===0?"ATK":"DEF");
  const pA = roundWinProb(mf.powerA, mf.powerB);
  const won = Math.random() < pA;
  const opsAvail = availableOperators();
  const sidedOps = opsAvail.filter(o=>o.side===side);
  const op = pick(sidedOps.length? sidedOps : opsAvail);
  const roster = mf.you.players;
  const scorer = pick(roster);
  const tplPool = side==="ATK" ? JARGON_ATK : JARGON_DEF;
  const line = fmtJargon(pick(tplPool), won? scorer.name : pick(mf.opponent.players).name, op?op.name:null);

  if(won) mf.roundsA++; else mf.roundsB++;
  mf.log.push({
    n:roundN, side, won,
    text: `Round ${roundN} (${side}): ${line}. ${won? "Vitória do seu time!" : "Vitória de " + mf.opponent.name + "!"}`,
  });

  if(mf.roundsA>=7 || mf.roundsB>=7){
    finishMatch();
    return;
  }
  saveState();
  render();
}

function autoPlayMatch(){
  const mf = state.matchFlow;
  while(mf.roundsA<7 && mf.roundsB<7){
    simulateRoundQuiet();
  }
  finishMatch();
}
function simulateRoundQuiet(){
  const mf = state.matchFlow;
  const roundN = mf.roundsA + mf.roundsB + 1;
  const side = roundN<=6 ? "ATK" : roundN<=12 ? "DEF" : ((roundN-13)%2===0?"ATK":"DEF");
  const pA = roundWinProb(mf.powerA, mf.powerB);
  const won = Math.random() < pA;
  const opsAvail = availableOperators();
  const sidedOps = opsAvail.filter(o=>o.side===side);
  const op = pick(sidedOps.length? sidedOps : opsAvail);
  const scorer = pick(mf.you.players);
  const tplPool = side==="ATK" ? JARGON_ATK : JARGON_DEF;
  const line = fmtJargon(pick(tplPool), won? scorer.name : pick(mf.opponent.players).name, op?op.name:null);
  if(won) mf.roundsA++; else mf.roundsB++;
  mf.log.push({ n:roundN, side, won, text:`Round ${roundN} (${side}): ${line}. ${won? "Vitória do seu time!" : "Vitória de "+mf.opponent.name+"!"}` });
}

function finishMatch(){
  const mf = state.matchFlow;
  const you = mf.you, opp = mf.opponent;
  const winner = mf.roundsA > mf.roundsB ? you : opp;

  if(mf.stageType === "swiss"){
    const pairs = mf.swissPairs;
    const results = pairs.map(([a,b],i)=>{
      if(i===mf.matchIndex){
        const aIsYou = a.isPlayer;
        return { a, b, winner: winner.isPlayer? (aIsYou?a:b) : (aIsYou?b:a),
                 wa: aIsYou? mf.roundsA : mf.roundsB, wb: aIsYou? mf.roundsB : mf.roundsA };
      }
      const r = simulateSeriesQuiet(a.players,b.players,1);
      return {a,b,wa:r.wa,wb:r.wb,winner:r.aWon?a:b};
    });
    state.matchFlow = null;
    finishSwissRound(results, mf.bye);
    return;
  }

  // playoffs
  const results = state.playoffs.matches.map((m,i)=>{
    if(i===mf.matchIndex){
      const aIsYou = m.a.isPlayer;
      return {...m, winner: winner.isPlayer? (aIsYou?m.a:m.b) : (aIsYou?m.b:m.a),
               wa: aIsYou? mf.roundsA : mf.roundsB, wb: aIsYou? mf.roundsB : mf.roundsA, done:true};
    }
    const r = simulateSeriesQuiet(m.a.players,m.b.players,mf.bo);
    return {...m, wa:r.wa, wb:r.wb, winner:r.aWon?m.a:m.b, done:true};
  });
  state.matchFlow = null;
  advancePlayoffs(results);
}

function restartAll(){
  clearState();
  state = freshState();
  render();
}

/* =========================================================
   RENDER
========================================================= */
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

function header(){
  const steps = [["draft","Draft"],["swiss","Fase Suíça"],["playoffs","Playoffs"],["end","Final"]];
  const activeIdx = steps.findIndex(s=>s[0]===state.phase);
  let stepsHtml = "";
  if(state.phase!=="intro"){
    stepsHtml = `<div class="steps">${steps.map(([id,label],i)=>{
      const cls = i===activeIdx?"step active": i<activeIdx?"step done":"step";
      return `<div class="${cls}">${String(i+1).padStart(2,"0")} — ${label}</div>`;
    }).join("")}</div>`;
  }
  return `
    <div class="top-brand"><div class="dot"></div><span>R6 Esports Manager Simulator · Tier 1 Global</span></div>
    <h1 class="title">Rumo ao <span class="accent">Hammer</span></h1>
    <p class="subtitle">Monte seu elenco dos sonhos, gerencie entrosamento e forma do dia, bana operadores contra a IA
    e comande a campanha inteira até erguer o troféu do Major.</p>
    ${stepsHtml}
  `;
}

function renderIntro(){
  const saved = loadState();
  const hasSave = saved && saved.phase !== "intro";
  return `
    <div class="card">
      <div class="eyebrow">Briefing</div>
      <p style="line-height:1.6;margin-bottom:18px;">
        Escolha 5 jogadores reais, um por função (Entry, Flex, Suporte, IGL, Âncora). Jogadores da mesma organização
        original geram <b style="color:var(--gold)">bônus de entrosamento</b> (+2 a +5 de poder). Antes de cada
        partida sua, o elenco recebe uma <b style="color:var(--gold)">variação de forma do dia</b> (-3 a +3) e vocês
        fazem o <b style="color:var(--gold)">ban de operadores</b> contra a IA.
      </p>
      <div class="stat-strip">
        <div><b>23</b> equipes reais</div>
        <div><b>115</b> jogadores reais</div>
        <div><b>12</b> operadores baníveis</div>
      </div>
      <button class="btn-primary" onclick="startNewCampaign()">Iniciar novo draft →</button>
      ${hasSave? `<button class="btn-ghost" style="margin-left:10px;" onclick="continueSaved()">Continuar campanha salva</button>` : ""}
    </div>
  `;
}
function continueSaved(){
  const saved = loadState();
  if(saved){ state = saved; render(); }
}

function playerCardHtml(p, onclick){
  return `
    <button class="player-card" onclick="${onclick}">
      <div class="p-head">
        <div>
          <div class="p-name">${p.name}</div>
          <div class="p-team">${p.tag} · ${p.team}</div>
          <span class="role-badge">${p.role}</span>
        </div>
        <div class="ovr-chip">${p.ovr}</div>
      </div>
      <div class="stat-row"><span>K/D Ratio</span><b>${p.kd.toFixed(2)}</b></div>
    </button>
  `;
}

function renderDraft(){
  const offer = currentOffer();
  const rosterPlayers = state.roster.map(playerById);
  const chem = chemistryBonus(rosterPlayers);
  const power = rosterPlayers.reduce((s,p)=>s+p.ovr,0) + chem;
  const powerPct = Math.min(100, Math.round((power/500)*100));
  return `
    <div class="card">
      <div class="eyebrow">Rodada de draft ${state.draftRound+1} / 5 — vaga: ${ROLES[state.draftRound]}</div>
      <div class="grid">${offer.map(p=>playerCardHtml(p, `pickPlayer('${p.id}')`)).join("")}</div>
    </div>
    ${rosterPlayers.length? `
    <div class="card">
      <div class="eyebrow">Elenco atual — Entrosamento: +${chem} · Poder total: ${power}</div>
      <div class="power-bar-wrap"><div class="power-bar-fill" style="width:${powerPct}%"></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">
        ${rosterPlayers.map((p,i)=>`<div class="roster-chip"><span style="color:var(--gold)">${ROLES[i]}</span> ${p.name} <span style="color:var(--muted)">OVR ${p.ovr}</span></div>`).join("")}
      </div>
    </div>` : ""}
  `;
}

function statusDot(status){
  const c = status==="classificado"?"var(--green)": status==="eliminado"?"var(--red)":"var(--muted)";
  return `<span class="dot-status" style="background:${c}"></span>${status}`;
}

function renderSwiss(){
  const s = state.swiss;
  const sorted = [...s.teams].sort((a,b)=> b.wins!==a.wins? b.wins-a.wins : a.losses-b.losses);
  const lr = s.lastResult;
  let lastHtml = "";
  if(lr){
    const opp = lr.a.isPlayer? lr.b : lr.a;
    const my = lr.a.isPlayer? lr.wa : lr.wb;
    const their = lr.a.isPlayer? lr.wb : lr.wa;
    const won = lr.winner.isPlayer;
    lastHtml = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
      <span>Seu time <span style="color:var(--muted)">vs</span> ${opp.name}</span>
      <b style="color:${won?"var(--green)":"var(--red)"};font-family:'Consolas',monospace;font-size:16px;">${my}–${their} ${won?"VITÓRIA":"DERROTA"}</b>
    </div></div>`;
  }
  const rows = sorted.map(t=>`
    <tr class="${t.isPlayer?"me":""}">
      <td style="color:${t.isPlayer?"var(--gold)":"var(--text)"}">${t.isPlayer?"★ ":""}${t.name}</td>
      <td>${t.wins}-${t.losses}</td>
      <td>${statusDot(t.status)}</td>
    </tr>`).join("");
  return `
    <div class="eyebrow">Fase suíça — rodada ${Math.min(s.round,6)}</div>
    ${lastHtml}
    <div class="card" style="max-height:420px;overflow-y:auto;">
      <table><thead><tr><th>Equipe</th><th>V-D</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    ${!s.done ? `<button class="btn-primary" style="margin-top:14px;" onclick="simulateSwissRound()">Simular rodada ${s.round} →</button>`
               : `<p style="color:var(--muted);margin-top:14px;">Fase suíça encerrada. Avançando para os playoffs…</p>`}
  `;
}

function renderPlayoffs(){
  const po = state.playoffs;
  const rows = po.matches.map(m=>`
    <div class="bracket-row ${m.a.isPlayer||m.b.isPlayer?"me":""}">
      <div>${m.a.isPlayer?`<b style="color:var(--gold)">★ SEU TIME</b>`:m.a.name} <span style="color:var(--muted)">vs</span> ${m.b.isPlayer?`<b style="color:var(--gold)">★ SEU TIME</b>`:m.b.name}</div>
      <div style="font-family:'Consolas',monospace;color:var(--muted);">
        ${m.done? `<b style="color:${m.winner.isPlayer?"var(--green)":"var(--text)"}">${m.wa}–${m.wb} · ${m.winner.isPlayer?"SEU TIME":m.winner.name} avança</b>` : `Bo${m.bo}`}
      </div>
    </div>`).join("");
  return `
    <div class="eyebrow">Playoffs — ${po.roundName}</div>
    ${rows}
    <button class="btn-primary" style="margin-top:8px;" onclick="simulatePlayoffRound()">
      ${po.stage===2? "Disputar a Grande Final →" : `Simular ${po.roundName.toLowerCase()} →`}
    </button>
  `;
}

function renderEnd(){
  const r = state.finalResult;
  return `
    <div class="card center">
      <div class="eyebrow">Grande final — ${r.finalMatch.wa}–${r.finalMatch.wb}</div>
      <div class="trophy">🔨</div>
      <h2 style="font-size:30px;text-transform:uppercase;margin:10px 0;">
        ${r.playerWon? `<span class="accent" style="color:var(--gold)">Vocês ergueram o Hammer</span>` : `${r.champion.name} é o campeão`}
      </h2>
      <p style="color:var(--muted);margin-bottom:20px;">
        ${r.playerWon? "Seu draft, entrosamento e táticas terminaram em título mundial." : "Sua campanha terminou na Grande Final. Ajuste o elenco e tente de novo."}
      </p>
      <button class="btn-primary" onclick="restartAll()">Fazer novo draft ↺</button>
    </div>
  `;
}

/* --- Fluxo de partida do usuário --- */
function renderMatchFlow(){
  const mf = state.matchFlow;
  if(mf.step === "ban") return renderBanStep(mf);
  return renderLiveMatch(mf);
}

function renderBanStep(mf){
  const opts = OPERATORS.map(o=>{
    const bannedByYou = mf.bannedYou.includes(o.id);
    const bannedByAi = mf.bannedAi.includes(o.id);
    const banned = bannedByYou || bannedByAi;
    return `
      <button class="op-btn ${banned?"banned":""}" ${banned?"disabled":""} onclick="banOperator({id:'${o.id}'})">
        <div class="op-name">${o.name} <span style="color:var(--muted);font-size:10px;">(${o.side})</span></div>
        <div class="op-trait">${o.trait}</div>
      </button>`;
  }).join("");
  const log = [...mf.bannedYou.map(id=>`Você baniu ${OPERATORS.find(o=>o.id===id).name}`),
               ...mf.bannedAi.map(id=>`IA baniu ${OPERATORS.find(o=>o.id===id).name}`)];
  return `
    <div class="eyebrow">Ban de operadores — Bo${mf.bo} vs ${mf.opponent.name}</div>
    <div class="card">
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px;">Bana 2 operadores. A IA responde automaticamente com o próprio banimento.</p>
      <div class="op-grid">${opts}</div>
      ${log.length? `<div style="margin-top:16px;font-family:'Consolas',monospace;font-size:11.5px;color:var(--muted);">${log.map(l=>`<div>${l}</div>`).join("")}</div>` : ""}
    </div>
  `;
}

function renderLiveMatch(mf){
  const powerPctA = Math.min(100, Math.round((mf.powerA/500)*100));
  const powerPctB = Math.min(100, Math.round((mf.powerB/500)*100));
  const decided = mf.roundsA>=7 || mf.roundsB>=7;
  const logHtml = mf.log.slice().reverse().map(l=>`<div class="log-line ${l.won?"win":"loss"}">${l.text}</div>`).join("");
  return `
    <div class="eyebrow">Bo${mf.bo} — SEU TIME vs ${mf.opponent.name}</div>
    <div class="score-hud">
      <div class="score-num"><span class="gold">${mf.roundsA}</span> <span style="color:var(--muted);font-size:26px;">–</span> ${mf.roundsB}</div>
      <div style="font-family:'Consolas',monospace;font-size:12px;color:var(--muted);">SEU TIME<br>vs ${mf.opponent.name}</div>
    </div>
    <div class="card">
      <div class="eyebrow" style="margin-bottom:4px;">Poder total (com entrosamento e forma do dia)</div>
      <div style="display:flex;justify-content:space-between;font-family:'Consolas',monospace;font-size:12px;margin-bottom:2px;"><span>Seu time</span><b style="color:var(--gold)">${mf.powerA}</b></div>
      <div class="power-bar-wrap"><div class="power-bar-fill" style="width:${powerPctA}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-family:'Consolas',monospace;font-size:12px;margin:10px 0 2px;"><span>${mf.opponent.name}</span><b>${mf.powerB}</b></div>
      <div class="power-bar-wrap"><div class="power-bar-fill" style="width:${powerPctB}%;background:linear-gradient(90deg,#5b6270,#8891a3);"></div></div>
    </div>
    <div class="log-feed">
      <div class="live">● Ao vivo — feed da partida</div>
      ${logHtml || `<div class="log-line" style="color:var(--muted);">A partida ainda não começou.</div>`}
    </div>
    ${!decided ? `
      <button class="btn-primary" onclick="simulateRound()">Simular próximo round →</button>
      <button class="btn-ghost" style="margin-left:10px;" onclick="autoPlayMatch()">Assistir até o fim ⏭</button>
    ` : `<p style="color:var(--muted);">Partida decidida.</p>`}
  `;
}

/* --- Root render --- */
function render(){
  const app = document.getElementById("app");
  let body = "";
  if(state.matchFlow){
    body = renderMatchFlow();
  } else if(state.phase==="intro"){
    body = renderIntro();
  } else if(state.phase==="draft"){
    body = renderDraft();
  } else if(state.phase==="swiss"){
    body = renderSwiss();
  } else if(state.phase==="playoffs"){
    body = renderPlayoffs();
  } else if(state.phase==="end"){
    body = renderEnd();
  }
  app.innerHTML = header() + body;
}

/* =========================================================
   BOOT
========================================================= */
(function boot(){
  const saved = loadState();
  state = saved || freshState();
  render();
})();
</script>
