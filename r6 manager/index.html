<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R6 Esports Manager</title>
<style>
:root{
  --bg:#0a0c10; --bg2:#0e1218; --card:#161b22; --card2:#1b222c; --line:#262e3a;
  --txt:#e8eef5; --mut:#8b96a5; --gold:#ffcc00; --cyan:#00d2ff;
  --red:#ff4d5e; --green:#35e08a; --orange:#ff9f1c;
  --font:"Bahnschrift","Rajdhani","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.35}
body{min-height:100vh;
  background:radial-gradient(1100px 480px at 85% -8%,rgba(0,210,255,.09),transparent 60%),
             radial-gradient(900px 480px at -8% 0,rgba(255,204,0,.07),transparent 60%),var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
b{font-weight:700}
.mut{color:var(--mut)} .gold{color:var(--gold)} .cyan{color:var(--cyan)} .red{color:var(--red)} .green{color:var(--green)} .orange{color:var(--orange)}
.right{text-align:right} .center{text-align:center}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:linear-gradient(180deg,#0d1117,rgba(10,12,16,.96));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.brand{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:17px;white-space:nowrap}
.brand b{color:var(--gold)} .brand span{color:var(--cyan)}
.brand small{display:block;font-size:9px;letter-spacing:.34em;color:var(--mut);font-weight:600}
.nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav button{padding:8px 14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--mut);border-bottom:2px solid transparent}
.nav button:hover{color:var(--txt)}
.nav button.on{color:var(--gold);border-bottom-color:var(--gold)}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.chip-g{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);background:var(--card);
  font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px}
.chip-g.ok{border-color:rgba(53,224,138,.5)} .chip-g.warn{border-color:var(--orange);color:var(--orange)}
.chip-g.crit{border-color:var(--red);color:var(--red);animation:pulse 1.2s infinite}
.chip-g:hover{background:var(--card2)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:16px;max-width:1560px;margin:0 auto}
.layout.solo{grid-template-columns:minmax(0,1fr)}
@media(max-width:1050px){.layout{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.top{flex-wrap:wrap;padding:8px 12px}.nav{order:3;flex-basis:100%}.nav button{padding:6px 8px;font-size:11px}.layout{padding:10px}.sb{grid-template-columns:1fr;text-align:center}.sb .side,.sb .side.r{justify-content:center;flex-direction:row}.sb .score{font-size:40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;position:relative}
.card>h3,.h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card>h3::before,.h3::before{content:"";width:3px;height:13px;background:var(--gold);display:inline-block}
.card.cy>h3::before{background:var(--cyan)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media(max-width:820px){.g2,.g3,.g21{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:13px;white-space:nowrap;
  background:var(--card2);border:1px solid var(--line);border-radius:4px;transition:.15s;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}
.btn.gold:hover:not(:disabled){background:#ffd93a;color:#000;box-shadow:0 0 22px rgba(255,204,0,.35)}
.btn.cyan{background:rgba(0,210,255,.12);color:var(--cyan);border-color:var(--cyan)}
.btn.cyan:hover:not(:disabled){background:rgba(0,210,255,.22)}
.btn.sm{padding:6px 12px;font-size:11px}
.btn.danger:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:6px 12px;border:1px solid var(--line);background:var(--bg2);font-size:12px;font-weight:700;letter-spacing:.08em;border-radius:3px;color:var(--mut)}
.tabs button:hover{color:var(--txt)}
.tabs button.on{border-color:var(--gold);color:var(--gold);background:rgba(255,204,0,.07)}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:3px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;border:1px solid currentColor}
.tag.fill{background:var(--gold);color:#111;border-color:var(--gold)}
kbd{border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;border-radius:3px;font-size:11px;color:var(--mut)}

/* ---------- logos / bars ---------- */
.logo{--c:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;
  border:2px solid var(--c);color:var(--c);font-weight:800;font-size:11px;letter-spacing:.02em;background:rgba(0,0,0,.35);box-shadow:0 0 12px -4px var(--c)}
.logo.lg{width:64px;height:64px;font-size:19px;border-width:3px}
.logo.md{width:46px;height:46px;font-size:14px}
.logo.xs{width:22px;height:22px;font-size:8px;border-width:1px}
.bar{height:6px;background:#0c1016;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#5ee7ff)}
.bar.g>i{background:linear-gradient(90deg,#c99a00,var(--gold))}
.bar.r>i{background:linear-gradient(90deg,#c22,var(--red))}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;background:#2a3340}
.dots i.W{background:var(--green)} .dots i.L{background:var(--red)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(38,46,58,.6);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.me td{background:rgba(0,210,255,.08)}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}
.tbl tr.q td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.tbl tr.me.q td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}
.tbl tr.bub td{background:rgba(255,159,28,.05)}
.tbl tr.cut td{padding:0;border:0}
.cutline{display:flex;align-items:center;gap:10px;padding:5px 8px;color:var(--gold);font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  background:repeating-linear-gradient(135deg,rgba(255,204,0,.14) 0 8px,rgba(255,204,0,.04) 8px 16px);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.tn{display:flex;align-items:center;gap:8px;font-weight:700}
.up{color:var(--green)} .dn{color:var(--red)}
.scroll{overflow:auto}

/* ---------- alerts ---------- */
.alert{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:6px;border:1px solid var(--line);background:var(--card);border-left-width:4px}
.alert .ic{font-size:26px;line-height:1}
.alert h4{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.alert p{color:var(--mut);font-size:13px}
.alert.crit{border-color:var(--red);background:linear-gradient(90deg,rgba(255,77,94,.16),var(--card));animation:pulse 1.3s infinite}
.alert.crit h4{color:var(--red)}
.alert.warn{border-color:var(--orange);background:linear-gradient(90deg,rgba(255,159,28,.13),var(--card))}
.alert.warn h4{color:var(--orange)}
.alert.ok{border-color:var(--green);background:linear-gradient(90deg,rgba(53,224,138,.1),var(--card))}
.alert.ok h4{color:var(--green)}
.alert.info{border-color:var(--cyan)}
.alert.info h4{color:var(--cyan)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,.0)}50%{box-shadow:0 0 22px 0 rgba(255,77,94,.35)}}
@keyframes slide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* ---------- selection screen ---------- */
.hero{padding:26px 22px;border:1px solid var(--line);border-radius:6px;
  background:linear-gradient(120deg,rgba(255,204,0,.08),transparent 40%),linear-gradient(300deg,rgba(0,210,255,.1),transparent 50%),var(--card);margin-bottom:16px}
.hero h1{font-size:34px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;line-height:1.05}
.hero h1 b{color:var(--gold)} .hero h1 span{color:var(--cyan)}
.hero p{color:var(--mut);max-width:760px;margin-top:8px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tc{text-align:left;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:8px;transition:.15s;position:relative}
.tc:hover{border-color:var(--cyan);transform:translateY(-1px)}
.tc.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,204,0,.09),var(--card));box-shadow:0 0 0 1px var(--gold)}
.tc .pw{margin-left:auto;text-align:right;font-weight:800;font-size:26px;color:var(--gold);line-height:1}
.tc .pw small{display:block;font-size:9px;color:var(--mut);letter-spacing:.2em}
.tc .nm{font-weight:800;font-size:15px}
.tc .ros{font-size:12px;color:var(--mut)}
.detail{position:sticky;top:72px}
.plr{display:grid;grid-template-columns:1fr 60px 34px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(38,46,58,.6);font-size:13px}

/* ---------- match ---------- */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:16px 18px;
  background:linear-gradient(180deg,#10161e,var(--card));border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:6px}
.sb .side{display:flex;align-items:center;gap:12px}
.sb .side.r{flex-direction:row-reverse;text-align:right}
.sb .nm{font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.sb .role{font-size:11px;letter-spacing:.2em;font-weight:800;padding:2px 8px;border-radius:3px;display:inline-block;margin-top:3px}
.role.atk{background:rgba(255,77,94,.15);color:var(--red);border:1px solid var(--red)}
.role.def{background:rgba(0,210,255,.13);color:var(--cyan);border:1px solid var(--cyan)}
.sb .mid{text-align:center}
.sb .score{font-size:50px;font-weight:800;line-height:1;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.sb .score i{color:var(--mut);font-style:normal;margin:0 6px;font-weight:400}
.sb .inf{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.strip{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:8px 0}
.strip .pip{width:30px;height:24px;border-radius:3px;background:#0f141b;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--mut)}
.strip .pip.w{background:rgba(0,210,255,.18);border-color:var(--cyan);color:var(--cyan)}
.strip .pip.l{background:rgba(255,77,94,.15);border-color:var(--red);color:var(--red)}
.strip .pip.next{border-color:var(--gold);color:var(--gold);animation:pulse 1.2s infinite}
.strip .sep{width:2px;height:24px;background:var(--gold);margin:0 4px}
.strip .ot{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.14em;margin:0 6px}
.mapbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
.mapbar .mp{color:var(--gold);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.st{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--bg2);width:100%;transition:.15s}
.st:hover{border-color:var(--cyan)}
.st.on{border-color:var(--gold);background:rgba(255,204,0,.08);box-shadow:0 0 0 1px var(--gold)}
.st .ic{font-size:22px;grid-row:span 2}
.st .n{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.st .d{font-size:11.5px;color:var(--mut)}
.st .cnt{font-size:10.5px;letter-spacing:.04em;margin-top:2px}
.feed{height:430px;overflow-y:auto;background:#0d1117;border:1px solid var(--line);border-radius:5px;padding:6px 0;scroll-behavior:smooth}
.ln{padding:4px 12px;border-left:2px solid transparent;font-size:13px;animation:slide .22s both}
.ln .loc{color:var(--mut);font-size:11.5px}
.ln .op{color:var(--mut);font-style:normal;font-size:11.5px}
.ln.hdr{margin-top:10px;background:#101720;border-left-color:var(--gold);color:var(--gold);font-weight:800;letter-spacing:.07em;text-transform:uppercase;font-size:11.5px;padding:6px 12px}
.ln.hdr .adv{margin-left:8px;font-weight:700}
.ln.kill.fk{border-left-color:var(--cyan);background:rgba(0,210,255,.05)}
.ln.plant{border-left-color:var(--orange);color:var(--orange)}
.ln.clutch{border-left-color:var(--gold);background:rgba(255,204,0,.07);font-weight:700}
.ln.res{font-weight:800;border-left-color:var(--gold);background:#141b24}
.ln.res.win{border-left-color:var(--cyan);color:var(--cyan)} .ln.res.loss{border-left-color:var(--red);color:var(--red)}
.ln.sys{color:var(--mut);font-size:12px;font-style:italic}
.ln.big{text-align:center;color:var(--gold);font-weight:800;letter-spacing:.16em;background:repeating-linear-gradient(135deg,rgba(255,204,0,.12) 0 8px,transparent 8px 16px);margin:8px 0;padding:7px}
.pl{font-weight:800}
.mini th,.mini td{padding:4px 6px !important;font-size:12px}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;background:rgba(4,6,9,.78);backdrop-filter:blur(4px);padding:4vh 14px;overflow:auto}
#modal.open{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;width:min(980px,100%);animation:pop .18s both;padding:18px 20px}
.mbox.sm{width:min(620px,100%)}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mhead h2{font-size:18px;letter-spacing:.14em;text-transform:uppercase}
.mhead h2 b{color:var(--gold)}
#toasts{position:fixed;right:14px;bottom:14px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:440px}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cyan);padding:12px 14px;border-radius:5px;animation:slide .25s both;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.crit{border-left-color:var(--red);animation:slide .25s both,pulse 1.2s 3} .toast.warn{border-left-color:var(--orange)} .toast.ok{border-left-color:var(--green)}

/* ---------- global sidebar ---------- */
.side .card{padding:12px 14px}
.gr{display:flex;flex-direction:column;max-height:calc(100vh - 150px);overflow:auto;margin:0 -4px;padding:0 4px}
.gi{padding:8px 0;border-bottom:1px solid rgba(38,46,58,.7);font-size:13px;animation:slide .3s both;animation-delay:calc(var(--i,0)*35ms)}
.gi .lg{font-size:10px;font-weight:800;letter-spacing:.1em;padding:1px 5px;border-radius:2px;margin-right:6px;border:1px solid currentColor}
.gi .w{font-weight:800;color:var(--txt)} .gi .l{color:var(--mut)}
.gi.me{background:rgba(0,210,255,.07);margin:0 -6px;padding:8px 6px;border-radius:3px}
.gh{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;padding:10px 0 4px}
.live{font-size:9px;letter-spacing:.16em;color:var(--red);font-weight:800;margin-left:auto;display:flex;gap:5px;align-items:center}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(38,46,58,.5);font-size:13px}
.kv span:first-child{color:var(--mut)}
.big{font-size:32px;font-weight:800;line-height:1}
.phase{display:flex;gap:6px;flex-wrap:wrap}
.ph{padding:6px 9px;border:1px solid var(--line);border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);background:var(--bg2)}
.ph.done.W{border-color:rgba(53,224,138,.5);color:var(--green)} .ph.done.L{border-color:rgba(255,77,94,.5);color:var(--red)} .ph.done{color:var(--txt)}
.ph.cur{border-color:var(--gold);color:var(--gold);background:rgba(255,204,0,.08)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.vs .t{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.vs .t .nm{font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.vs .x{font-size:22px;color:var(--mut);font-weight:800}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#2a3340;border-radius:4px} ::-webkit-scrollbar-track{background:transparent}

/* ---------- v2: tempo real, rotina, atletas ---------- */
.ts{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums;margin-right:6px}
.clk{font-size:32px;font-weight:800;letter-spacing:.08em;color:var(--gold);line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.clk.low{color:var(--red);animation:pulse 1s infinite} .clk.bomb{color:var(--orange)}
.cads{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cad{padding:10px 0;border:1px solid var(--line);background:var(--bg2);border-radius:5px;font-size:16px;transition:.15s}
.cad:hover:not(:disabled){border-color:var(--cyan)}
.cad.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,210,255,.1);box-shadow:0 0 0 1px var(--cyan)}
.rt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg2);text-align:left;font-size:13px;font-weight:700;width:100%;transition:.15s}
.rt small{font-weight:600;font-size:10.5px}
.rt:hover:not(:disabled){border-color:var(--cyan)}
.rt.on{border-color:var(--gold);background:rgba(255,204,0,.08);box-shadow:0 0 0 1px var(--gold)}
.cad:disabled,.rt:disabled{opacity:.6;cursor:default}
#iv{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(4,6,9,.72);backdrop-filter:blur(3px)}
#iv.open{display:flex}
.ivbox{width:min(520px,92vw);background:var(--card);border:1px solid var(--red);border-top:4px solid var(--red);border-radius:8px;padding:18px 20px;animation:pop .15s both;box-shadow:0 0 50px rgba(255,77,94,.3)}
.ivt{font-size:19px;font-weight:800;letter-spacing:.1em;color:var(--red);margin-bottom:4px}
.ivb{height:5px;background:#0c1016;border-radius:3px;overflow:hidden;margin-top:10px}
.ivb i{display:block;height:100%;width:100%;background:var(--red)}
.ivbox .st{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.pcard{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.mrow{display:grid;grid-template-columns:78px 1fr 30px;gap:8px;align-items:center;font-size:12px;margin-top:6px}
.mrow>span{color:var(--mut)} .mrow>b{text-align:right}
.bar.o>i{background:linear-gradient(90deg,#c97a00,var(--orange))}
.bar.gr>i{background:linear-gradient(90deg,#1fa365,var(--green))}
.st:disabled{opacity:.45;cursor:not-allowed}
.sb .clk{margin-top:6px}

  const r = mulb(hstr('t' + d.id)), r2 = mulb(hstr('m' + d.id));   // r2: idade, potencial e reservas (não altera a sequência original de r)
  const roles = shuffle(ROLES, r), off = shuffle([3,1,0,-1,-3], r);
  const star = d.star ? d.roster.indexOf(d.star) : -1;
  if(star >= 0){ const mx = off.indexOf(3); [off[star], off[mx]] = [off[mx], off[star]]; }
  const players = d.roster.map((n, i) => {
    const ovr = clamp(Math.round(d.power + off[i]), 50, 99), sp = Math.round((r() - .5) * 8);
    return {id:mkId(), name:n, role:roles[i], igl:d.igl === n, aim:clamp(ovr + sp, 45, 99), gs:clamp(ovr - sp, 45, 99), ovr, form:0,
            stress:Math.round(18 + r() * 14), sat:Math.round(62 + r() * 18), k:0, d:0, r:0, fk:0, cl:0, ...seedMeta(r2, ovr)};
  });
  players.forEach(recalc);
  if(!players.some(p => p.igl)) players.reduce((b, p) => p.gs > b.gs ? p : b).igl = true;
  const base = Math.round(Math.max(0, (d.power - 72) * 4.5) + r() * 22) + (d.ewc ? EWC_BONUS : 0);
  return {
    id:d.id, name:d.name, short:d.short, tag:d.tag || d.short.slice(0, 3).toUpperCase(), league:d.league, power:d.power, color:d.color,
    style:['agg','meth','bal'][hstr('s' + d.id) % 3], ewc:!!d.ewc, star:d.star || null, coach:d.coach || null, note:d.note || d.ex || '', src:!!d.src, bench:mkBench(d.bench, d.power, r2), bud:budFor(d.power),
    sigA:OPS.atk[hstr('a' + d.id) % OPS.atk.length], sigD:OPS.def[hstr('d' + d.id) % OPS.def.length],
    players, chem:60, conf:60, w:0, l:0, rw:0, rl:0, si:base, siBase:base, siPrev:base, rkPrev:0, form:[]
  };
}
function recalc(p){ p.ovr = Math.round(p.aim * .55 + p.gs * .45); }
function buildAll(){ const o = {}; TEAM_DB.forEach(d => o[d.id] = buildTeam(d)); return o; }

/* =====================================================================
   2. MOTOR DE PARTIDA — MD12, rounds de 3:00 em linha do tempo, troca de lados após o 6º
   ===================================================================== */
const aff  = (t, mapId) => ((hstr(t.id + mapId) % 9) - 4) * .5;              // afinidade com o mapa (−2 … +2)
const raff = (t, mapId, r) => ((hstr(t.id + mapId + 'r' + r) % 5) - 2) * .5;  // afinidade com a rota
/* Rating efetivo em jogo: Burnout (estresse > 80) = −15; estresse alto e moral baixa também pesam */
const effP = p => p.ovr + p.form - (p.stress > 80 ? 15 : Math.max(0, p.stress - 60) / 10) + (p.sat - 60) / 30 - (p.sat < 30 ? 2 : 0);
const isBurnout = p => p.stress > 80;
const fmtT = t => { const r = Math.max(0, Math.round(ROUND_SEC - t)); return Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0'); };
const blank = () => ({k:0, d:0, fk:0, cl:0, r:0, mk:0});

function newMatch(A, B, userKey = null, quiet = true, an = 0){
  return {
    t:{a:A, b:B}, userKey, quiet, an, first:rnd() < .5 ? 'a' : 'b',
    score:{a:0,b:0}, ot:{a:0,b:0}, played:0, otPlayed:0, inOT:false, wasOT:false, done:false, winner:null,
    streak:{a:0,b:0}, tos:{a:1,b:1}, conf:{a:A.conf, b:B.conf}, chem:{a:A.chem, b:B.chem}, tac:{a:{v:0,n:0}, b:{v:0,n:0}},
    last:{a:null,b:null}, pen:{a:{atk:0,def:0}, b:{atk:0,def:0}}, bans:{a:{atk:null,def:null}, b:{atk:null,def:null}},
    map:null, veto:[], hist:[], ps:{a:A.players.map(blank), b:B.players.map(blank)}
  };
}
/* Veto de mapas (6 bans alternados) e bans de operadores — resolvido instantaneamente. O Analista de Dados reduz o ruído das decisões. */
function doVeto(m){
  let pool = MAPS.slice(), turn = rnd() < .5 ? 'a' : 'b';
  const lv = k => k === m.userKey ? m.an : 0;
  while(pool.length > 1){
    const t = m.t[turn], o = m.t[other(turn)];
    let best = null, bv = -1e9;
    for(const mp of pool){ const v = (aff(o, mp.id) - aff(t, mp.id)) * (1 + .25 * lv(turn)) + rnd() * 1.2 * (1 - .3 * lv(turn)); if(v > bv){ bv = v; best = mp; } }
    pool = pool.filter(x => x !== best);
    m.veto.push({team:turn, type:'map', what:best.name}); turn = other(turn);
  }
  m.map = pool[0]; m.veto.push({team:'-', type:'pick', what:m.map.name});
  for(const k of ['a','b']){
    const o = other(k), opp = m.t[o], smart = k === m.userKey || rnd() < .85;
    const ba = smart ? opp.sigA : pick(OPS.atk), bd = smart ? opp.sigD : pick(OPS.def);
    m.bans[k].atk = ba; m.bans[k].def = bd;
    if(ba === opp.sigA) m.pen[o].atk = 2;
    if(bd === opp.sigD) m.pen[o].def = 2;
    m.veto.push({team:k, type:'atkop', what:ba, hit:ba === opp.sigA, vs:o}, {team:k, type:'defop', what:bd, hit:bd === opp.sigD, vs:o});
  }
}
function atkKey(m){
  if(m.inOT) return m.otPlayed % 2 === 0 ? m.first : other(m.first);
  return m.played < 6 ? m.first : other(m.first);           // inversão obrigatória após o 6º round
}
const sideOfUser = m => atkKey(m) === m.userKey ? 'atk' : 'def';

/* Plano da IA: cadência (1-5) + rota (0-2). Lê padrões repetidos do usuário. */
function aiPlan(m, k, side){
  const w = STYLE[m.t[k].style].c, pl = m.last[other(k)];
  let cad = wpick([1,2,3,4,5], c => w[c - 1]), route = rint(0, 2);
  if(pl && pl.side !== side){
    if(rnd() < .28) cad = side === 'atk' ? (pl.cad > 3 ? 5 : pl.cad < 3 ? 1 : 3) : (pl.cad > 3 ? 1 : pl.cad < 3 ? 5 : 3);
    if(rnd() < .35) route = side === 'def' ? pl.route : (rnd() < .75 ? (pl.route + rint(1, 2)) % 3 : route);
  }
  return {cad, route};
}
function autoPlan(m, side){ const l = m.last[m.userKey]; return l && l.side === side ? {cad:l.cad, route:l.route} : {cad:3, route:0}; }
function doTimeout(m, k, posture){
  m.tos[k]--; m.streak[other(k)] = 0;
  const pre = m.conf[k];
  if(posture === 'ear') m.conf[k] = pre < 50 ? 68 : 55;
  else if(posture === 'motiv') m.conf[k] = 65;
  else { m.conf[k] = 55; m.tac[k] = {v:3, n:3}; }
  if(k === m.userKey){                                      // efeitos persistentes no vestiário do usuário
    const T = m.t[k];
    if(posture === 'ear'){ T.players.forEach(p => { p.sat = clamp(p.sat - 5, 0, 100); p.stress = clamp(p.stress + 4, 0, 100); }); }
    if(posture === 'motiv'){ T.players.forEach(p => { p.sat = clamp(p.sat + 3, 0, 100); }); T.chem = clamp(T.chem + 1, 0, 100); }
  }
  return {pre, post:m.conf[k]};
}

/* ---------- um round ---------- */
function roundInit(m, userPlan, interactive){
  const ak = atkKey(m), dk = other(ak), AT = m.t[ak], DT = m.t[dk], V = !m.quiet, pre = [];
  const fix = p => ({cad:clamp(Math.round(p.cad), 1, 5), route:clamp(Math.round(p.route), 0, 2)});
  const pA = fix(ak === m.userKey && userPlan ? userPlan : aiPlan(m, ak, 'atk'));
  const pD = fix(dk === m.userKey && userPlan ? userPlan : aiPlan(m, dk, 'def'));
  for(const k of ['a','b']) if(k !== m.userKey && m.tos[k] > 0 && (m.streak[other(k)] >= 3 || m.conf[k] < 35) && rnd() < .6){
    const po = pick(['ear','motiv','adjust']); doTimeout(m, k, po);
    if(V) pre.push({c:'sys', h:`⏱ <b>TIMEOUT TÉCNICO</b> — <b style="color:${m.t[k].color}">${esc(m.t[k].name)}</b> para o jogo e reorganiza o time.`});
  }
  const tacv = k => m.tac[k].n > 0 ? m.tac[k].v : 0;
  const base = 2 * (pA.cad - 3) * (pD.cad - 3) + (pA.route === pD.route ? -5 : 2)
    + raff(AT, m.map.id, pA.route) - raff(DT, m.map.id, pD.route)
    + (m.conf[ak] - m.conf[dk]) / 10 + (m.chem[ak] - m.chem[dk]) / 12 + tacv(ak) - tacv(dk)
    + aff(AT, m.map.id) - aff(DT, m.map.id) - m.pen[ak].atk + m.pen[dk].def + m.map.atk + ATK_BIAS;
  const mk = (T, k) => T.players.map((p, i) => ({p, i, k, alive:true, kills:0, op:null, hb:false, eff:effP(p)}));
  const A = mk(AT, ak), D = mk(DT, dk);
  const assign = (units, side, banned, sig) => {
    const pool = shuffle(OPS[side].filter(o => o !== banned && o !== sig)); units.forEach((u, i) => u.op = pool[i]);
    if(sig && sig !== banned && rnd() < .6) pick(units).op = sig;
  };
  assign(A, 'atk', m.bans[dk].atk, AT.sigA); assign(D, 'def', m.bans[ak].def, DT.sigD);
  if(!A.some(u => HB.has(u.op)) && rnd() < .85){ const c = [...HB].filter(o => o !== m.bans[dk].atk); if(c.length) pick(A).op = pick(c); }
  A.forEach(u => u.hb = HB.has(u.op));
  m.tac.a.n = Math.max(0, m.tac.a.n - 1); m.tac.b.n = Math.max(0, m.tac.b.n - 1);
  return {m, ak, dk, AT, DT, pA, pD, base, A, D, t:0, planted:false, plantT:0, duels:0, kills:0, over:false, winner:null, type:null, started:false,
    firstT:clamp(Math.round(105 - pA.cad * 17 + rint(-8, 8)), 12, 150), firstB:(3 - pA.cad) * .6, queue:[], pre,
    mods:{a:0,b:0}, plantAdj:0, defuseAdj:0, flags:{A:false,B:false}, cand:{a:null,b:null}, interactive:!!interactive, rec:null};
}
const alive = arr => arr.filter(u => u.alive);
const pnU = (m, u) => `<b class="pl" style="color:${m.t[u.k].color}">${esc(u.p.name)}</b>`;
const opU = u => `<i class="op">(${esc(u.op)})</i>`;
const VERBS = ['elimina','derruba','abate','finaliza','pega','troca'];

function roundNext(rs){
  const m = rs.m, V = !m.quiet;
  if(rs.queue.length) return rs.queue.shift();
  if(rs.over) return null;
  if(!rs.started){
    rs.started = true;
    const rl = m.inOT ? `OT ${m.otPlayed + 1}` : `Round ${m.played + 1}`, mine = rs.ak === m.userKey ? rs.pA : rs.pD, sd = rs.ak === m.userKey ? 'atk' : 'def';
    const L = rs.pre.slice();
    if(V){
      L.push({c:'hdr', h:`${rl} · <span style="color:${rs.AT.color}">${esc(rs.AT.short)}</span> ATACA × <span style="color:${rs.DT.color}">${esc(rs.DT.short)}</span> DEFENDE${m.userKey ? ` · seu plano: cadência ${mine.cad} · ${esc(m.map.routes[mine.route])}` : ''}`});
      L.push({c:'sys', h: rs.pA.cad <= 2 ? `🔍 Fase de drones: o ataque testa ${esc(m.map.routes[rs.pA.route])} sem gastar utilidade.` : rs.pA.cad >= 4 ? `⚡ O ataque sai rápido e pressiona ${esc(m.map.routes[rs.pA.route])}.` : `Ataque monta o controle de mapa de forma padrão.`});
    }
    return {t:0, type:'start', L};
  }
  const aa = alive(rs.A), dd = alive(rs.D);
  if(!dd.length) return endRound(rs, 'elim', rs.ak);
  if(!aa.length) return endRound(rs, rs.planted ? 'defuse' : 'elim', rs.dk);
  if(!rs.planted){
    const dt = rs.duels === 0 ? rs.firstT : rint(6, 20);
    if(rs.t + dt >= ROUND_SEC){ rs.t = ROUND_SEC; return endRound(rs, 'clock', rs.dk); }
    rs.t += dt;
  } else {
    const dt = rint(6, 14), endT = rs.plantT + PLANT_SEC;
    if(rs.t + dt >= endT){
      rs.t = endT;
      const pd = clamp(.5 + .14 * (dd.length - aa.length) - (rs.base + rs.mods[rs.ak] - rs.mods[rs.dk]) * .01 + (rs.dk === m.userKey ? rs.defuseAdj : 0), .1, .9);
      return rnd() < pd ? endRound(rs, 'defuse', rs.dk) : endRound(rs, 'boom', rs.ak);
    }
    rs.t += dt;
  }
  return duelEvent(rs, aa, dd);
}

function duelEvent(rs, aa, dd){
  const m = rs.m, V = !m.quiet, first = rs.duels === 0, ak = rs.ak, dk = rs.dk;
  const rw = (u, side) => !first ? 1 : side === 'atk' ? (u.p.role === 'Entry' ? 1.7 : u.p.role === 'Flex' ? 1.2 : 1)
    : (rs.pD.cad >= 4 ? (u.p.role === 'Roamer' ? 1.8 : .8) : (u.p.role === 'Anchor' ? 1.5 : 1));
  const au = wpick(aa, u => (u.eff - 40) * rw(u, 'atk')), du = wpick(dd, u => (u.eff - 40) * rw(u, 'def'));
  const bonus = rs.base + rs.mods[ak] - rs.mods[dk] + (first ? rs.firstB : 0);
  const aWins = rnd() < sig(((au.eff - du.eff) + bonus) / DS);
  const kr = aWins ? au : du, vc = aWins ? du : au;
  kr.kills++; vc.alive = false; rs.duels++; rs.kills++;
  if(first) m.ps[kr.k][kr.i].fk++;
  const L = [];
  if(V) L.push({c:'kill' + (first ? ' fk' : ''), h:`${first ? '<span class="tag cyan">Abre o round</span> ' : ''}${pnU(m, kr)} ${opU(kr)} ${pick(VERBS)} ${pnU(m, vc)} ${opU(vc)} <span class="loc">— ${pick(m.map.calls)}</span>`});
  const na = alive(rs.A), nd = alive(rs.D);
  if(na.length === 1 && nd.length >= 2 && (!rs.cand[ak] || rs.cand[ak].vs < nd.length)) rs.cand[ak] = {u:na[0], vs:nd.length};
  if(nd.length === 1 && na.length >= 2 && (!rs.cand[dk] || rs.cand[dk].vs < na.length)) rs.cand[dk] = {u:nd[0], vs:na.length};
  const ev = {t:rs.t, type:'kill', L, killer:kr, victim:vc};
  // gatilhos de decisão de emergência (apenas com o usuário em quadra)
  const uk = m.userKey, fire = (kind, reason, u) => {
    rs.flags[kind] = true;
    if(rs.interactive) rs.queue.push({t:rs.t, type:'interv', kind, reason, unit:u});
    else if(uk){ const opt = autoInterv(rs, kind), txt = applyInterv(rs, kind, opt); if(V) rs.queue.push({t:rs.t, type:'log', L:[{c:'sys', h:txt}]}); }
  };
  if(uk && !rs.flags.A && vc.k === uk){
    const hbLoss = ak === uk && vc.hb && rs.kills <= 2 && !rs.planted && rnd() < .6;
    if(hbLoss) fire('A', 'hb', vc);                                   // perdeu o Hard Breacher cedo
    else if(rs.kills === 1 && rnd() < .35) fire('A', 'fb', vc);       // sofreu o First Blood (nem todo FB congela o round)
  }
  if(!rs.planted && na.length && nd.length){
    const pp = .30 + (rs.pA.cad - 1) * .07 + .07 * (rs.duels - 1) + rs.plantAdj;
    if(rnd() < pp){
      const planter = wpick(na, u => u.eff - 40); rs.planted = true; rs.plantT = Math.min(rs.t + rint(3, 9), 170); rs.t = rs.plantT;
      rs.queue.push({t:rs.plantT, type:'plant', L:V ? [{c:'plant', h:`💣 ${pnU(m, planter)} planta o defuser em <b>${pick(m.map.calls)}</b> — ${na.length}v${nd.length} · ${PLANT_SEC}s no relógio`}] : []});
      if(uk && dk === uk && !rs.flags.B && rnd() < .4) fire('B', 'plant', planter);
    }
  }
  return ev;
}

/* Decisões de emergência */
function autoInterv(rs, kind){ const gs = avgGS(rs); return kind === 'A' ? (gs >= 84 ? 'vertical' : 'retreat') : (gs >= 86 ? 'axes' : 'utility'); }
function avgGS(rs){ const T = rs.m.t[rs.m.userKey]; return T.players.reduce((s, p) => s + p.gs - (p.stress > 80 ? 8 : 0), 0) / T.players.length; }
function applyInterv(rs, kind, opt){
  const m = rs.m, uk = m.userKey, gs = avgGS(rs);
  if(kind === 'A'){
    if(opt === 'retreat'){
      rs.mods[uk] += 3; rs.plantAdj += uk === rs.ak ? -.15 : .2;
      return `↩ <b>Recuar para o retake tardio</b> — o time abre mão de espaço e reorganiza o trade (+3 nos duelos${uk === rs.ak ? ', plant mais lento' : ', mas o plant fica mais fácil para o rival'}).`;
    }
    if(opt === 'vertical'){
      const ok = rnd() < clamp(.45 + (gs - 80) / 70 + .03 * m.an, .25, .8);
      rs.mods[uk] += ok ? 7 : -4;
      return ok ? `🕳 <b>Verticalidade funciona!</b> A mudança de rota pega o rival desprevenido (+7).` : `🕳 <b>Verticalidade falha</b> — o rival cobre o buraco e pune a troca de rota (−4).`;
    }
    rs.mods[uk] -= 2; return `⏳ Sem decisão a tempo — o time hesita no momento crítico (−2).`;
  }
  if(opt === 'axes'){
    const ok = rnd() < clamp(.55 + (gs - 80) / 80, .3, .85);
    if(ok){ rs.mods[uk] += 6; rs.defuseAdj += .12; } else rs.mods[uk] -= 3;
    return ok ? `🔀 <b>Avanço simultâneo de eixos</b> sincronizado — o rival é pressionado por três lados (+6, defuse mais fácil).` : `🔀 <b>Avanço simultâneo</b> desalinhado — os eixos chegam em tempos diferentes (−3).`;
  }
  if(opt === 'utility'){ rs.mods[uk] += 3; rs.defuseAdj += .08; return `💨 <b>Utilitários gastos</b> — fumaça e flash abrem o caminho até o defuser (+3, defuse mais fácil).`; }
  rs.mods[uk] -= 2; return `⏳ Sem decisão a tempo — o retake sai sem coordenação (−2).`;
}

function endRound(rs, type, winner){
  const m = rs.m, V = !m.quiet, ak = rs.ak, dk = rs.dk, L = [];
  rs.over = true; rs.winner = winner; rs.type = type;
  if(V){
    if(type === 'defuse'){ const dfs = alive(rs.D), u = dfs.length ? pick(dfs) : null; L.push({c:'plant', h:u ? `🛡 ${pnU(m, u)} ${opU(u)} desarma o defuser com <b>${rint(1, 6)}s</b> restantes!` : `🛡 A defesa desarma o defuser no último instante!`}); }
    else if(type === 'boom') L.push({c:'plant', h:`💥 O defuser detona — o ataque garante o round.`});
    else if(type === 'clock') L.push({c:'sys', h:`⏱ Tempo esgotado sem plant — a defesa segura o round.`});
    const cw = rs.cand[winner]; if(cw && cw.u.alive) L.push({c:'clutch', h:`🎯 <b>CLUTCH 1v${cw.vs}</b> de ${pnU(m, cw.u)} ${opU(cw.u)}!`});
  }
  for(const u of rs.A.concat(rs.D)){
    const s = m.ps[u.k][u.i]; s.k += u.kills; if(!u.alive) s.d++; s.r++; if(u.kills >= 3) s.mk++;
    const cw = rs.cand[u.k]; if(cw && cw.u === u && u.alive && u.k === winner) s.cl++;
    if(V && u.kills >= 3) L.push({c:'clutch', h:`🔥 ${pnU(m, u)} faz <b>${u.kills === 5 ? 'ACE' : u.kills + 'K'}</b> no round!`});
  }
  m.hist.push({w:winner, ak, type, ot:m.inOT, cad:rs.pA.cad, route:rs.pA.route, dcad:rs.pD.cad, stack:rs.pD.route});
  m.last[ak] = {cad:rs.pA.cad, route:rs.pA.route, side:'atk'}; m.last[dk] = {cad:rs.pD.cad, route:rs.pD.route, side:'def'};
  m.streak[winner]++; m.streak[other(winner)] = 0;
  m.conf[winner] = clamp(m.conf[winner] + 6, 15, 95); m.conf[other(winner)] = clamp(m.conf[other(winner)] - 6, 15, 95);
  if(m.inOT){ m.ot[winner]++; m.otPlayed++; m.score[winner]++; if(m.ot[winner] >= 2){ m.done = true; m.winner = winner; } }   // OT soma no placar: 8–6 ou 8–7
  else { m.score[winner]++; m.played++; if(m.score[winner] >= 7){ m.done = true; m.winner = winner; } else if(m.played >= 12){ m.inOT = true; m.wasOT = true; } }
  if(V){
    const rl = 'round';
    const why = {elim:winner === ak ? 'eliminando a defesa' : 'eliminando o ataque', defuse:'com o defuse', boom:'com a detonação', clock:'pelo relógio'}[type];
    const opp = rs.ak === m.userKey ? `o rival defendia forte em <b>${esc(m.map.routes[rs.pD.route])}</b> (agressividade ${rs.pD.cad})` : `o rival atacou por <b>${esc(m.map.routes[rs.pA.route])}</b> (cadência ${rs.pA.cad})`;
    L.push({c:'res ' + (m.userKey ? (winner === m.userKey ? 'win' : 'loss') : ''), h:`✔ <b>${esc(m.t[winner].short)}</b> vence o ${rl} ${why} · placar <b>${m.score.a}–${m.score.b}</b>${m.ot.a + m.ot.b ? ` <span class="mut">(OT ${m.ot.a}–${m.ot.b})</span>` : ''}`});
    if(m.userKey) L.push({c:'sys', h:`Leitura pós-round: ${opp}.`});
    if(!m.done && !m.inOT && m.played === 6) L.push({c:'big', h:`🔄 TROCA DE LADOS — ${esc(m.t[m.first].short)} vai para a defesa`});
    if(!m.done && m.inOT && m.otPlayed === 0) L.push({c:'big', h:`⚔ 6–6 · PRORROGAÇÃO — vence quem ganhar 2 rounds (o placar vai até 8), lados alternados`});
    if(m.done) L.push({c:'big', h:`🏁 FIM DE PARTIDA — ${esc(m.t[m.winner].name)} vence por ${Math.max(m.score.a, m.score.b)}–${Math.min(m.score.a, m.score.b)}${m.wasOT ? ' (OT)' : ''}`});
  }
  rs.rec = {winner, type, ak};
  return {t:rs.t, type:'end', L, winner, rec:rs.rec};
}

/* Partidas rápidas (IA × IA e simulação instantânea) */
function runRoundAuto(m, userPlan){ const rs = roundInit(m, userPlan, false), out = []; let ev; while((ev = roundNext(rs))){ if(ev.L) out.push(...ev.L.map(l => ({...l, t:ev.t}))); } return {rs, lines:out}; }
function quickMatch(A, B){ const m = newMatch(A, B, null, true); doVeto(m); while(!m.done) runRoundAuto(m); return m; }
function winProb(A, B, n = 240){ let w = 0; for(let i = 0; i < n; i++) if(quickMatch(A, B).winner === 'a') w++; return w / n; }

function upgrade(j){

const stageOf = (lid, idx) => { const n = nG(lid); return idx < n ? {ph:'g', r:idx} : idx === n ? {ph:'sf'} : idx === n + 1 ? {ph:'f'} : null; };
const mdLabel = idx => { const n = nG(userLid()); return idx < n ? 'Rodada ' + (idx + 1) : idx === n ? 'Semifinais' : 'Grande Final'; };
const phLabel = (ph, idx) => ph === 'sf' ? 'Semifinal' : ph === 'f' ? 'Final' : 'Rodada ' + (idx + 1);

function roundRobin(ids){
  let arr = ids.slice(); const n = arr.length, rounds = [];
  for(let r = 0; r < n - 1; r++){
    const pairs = [];
    for(let i = 0; i < n / 2; i++){ const a = arr[i], b = arr[n - 1 - i]; pairs.push(r % 2 ? [b, a] : [a, b]); }
    rounds.push(pairs); arr = [arr[0], arr[n - 1], ...arr.slice(1, n - 1)];
  }
  return rounds;
}
function newCareer(userId){
  const teams = buildAll(), sched = {};
  LEAGUES.forEach(l => sched[l.id] = roundRobin(shuffle(Object.values(teams).filter(t => t.league === l.id).map(t => t.id))));

  S = {v:3, userId, year:START_YEAR, md:0, cur:null, teams, sched, po:{}, final:{}, results:[], uh:[], report:null, done:false, snap:null,
       fa:genFA(namesOf(teams)), hist:[], news:[], offers:[],

/* ---------- classificação, projeção e G16 ---------- */
const cmpT = (x, y) => y.w - x.w || (y.rw - y.rl) - (x.rw - x.rl) || y.rw - x.rw || y.power - x.power;
const leagueTable = lid => Object.values(S.teams).filter(t => t.league === lid).sort(cmpT);
function projRanking(lid){
  if(S.final[lid]) return S.final[lid];
  const g = leagueTable(lid).map(t => t.id), po = S.po[lid];
  if(po && po.sfW.filter(Boolean).length === 2){
    const bySeed = ids => ids.slice().sort((x, y) => po.seeds.indexOf(x) - po.seeds.indexOf(y));
    return [...bySeed(po.sfW), ...bySeed(po.sfL), ...g.slice(4)];
  }
  return g;
}
function globalTable(mode){
  const rk = {}; LEAGUES.forEach(l => rk[l.id] = S.final[l.id] ? null : projRanking(l.id));
  const arr = Object.values(S.teams).map(t => ({t, pts:mode === 'proj' && rk[t.league] ? t.si + PLACE_PTS[rk[t.league].indexOf(t.id)] : t.si}));
  arr.sort((x, y) => y.pts - x.pts || y.t.power - x.t.power || x.t.name.localeCompare(y.t.name));
  arr.forEach((r, i) => r.rank = i + 1);
  return arr;
}
function g16Status(){
  const tb = globalTable('proj'), me = tb.find(r => r.t.id === S.userId), cut = tb[G16 - 1], nxt = tb[G16], inn = me.rank <= G16;
  return {tb, me, rank:me.rank, pts:me.pts, in:inn, cutPts:cut.pts, cutTeam:cut.t, nextTeam:nxt.t, nextPts:nxt.pts, margin:inn ? me.pts - nxt.pts : cut.pts - me.pts};
}
function userInPlayoffs(){
  if(S.md < nG(userLid())) return null;
  const po = S.po[userLid()]; if(!po) return leagueTable(userLid()).slice(0, 4).some(t => t.id === S.userId);

}

/* ---------- calendário e dias de jogo ---------- */
function setupPO(lid){ const g = leagueTable(lid); S.po[lid] = {seeds:g.slice(0, 4).map(t => t.id), sf:[[g[0].id, g[3].id], [g[1].id, g[2].id]], sfW:[], sfL:[], final:null}; }
function fixtures(lid, idx){
  const st = stageOf(lid, idx); if(!st) return [];
  if(st.ph === 'g') return S.sched[lid][st.r];
  const po = S.po[lid];
  if(st.ph === 'sf'){ if(po) return po.sf; const g = leagueTable(lid); return [[g[0].id, g[3].id], [g[1].id, g[2].id]]; }
  return po && po.final ? [po.final] : [];
}
function userFixture(idx = S.md){
  const lid = userLid(), st = stageOf(lid, idx); if(!st) return null;
  if(st.ph === 'f' && !(S.po[lid] && S.po[lid].sfW.filter(Boolean).length === 2)) return null;
  const list = fixtures(lid, idx);
  for(let i = 0; i < list.length; i++) if(list[i].includes(S.userId)) return {slot:i, opp:list[i][0] === S.userId ? list[i][1] : list[i][0], lg:lid, ph:st.ph};
  return null;
}
function commit(m, meta){
  const w = m.winner, l = other(w), W = m.t[w], Lz = m.t[l], group = meta.ph === 'g';
  if(group){ W.w++; Lz.l++; W.rw += m.score[w]; W.rl += m.score[l]; Lz.rw += m.score[l]; Lz.rl += m.score[w]; }
  W.si += group ? WIN_PTS : PO_WIN_PTS;
  W.form.push('W'); Lz.form.push('L'); if(W.form.length > 5) W.form.shift(); if(Lz.form.length > 5) Lz.form.shift();
  for(const k of ['a','b']){
    const t = m.t[k];
    t.players.forEach((p, i) => {
      const s = m.ps[k][i]; p.k += s.k; p.d += s.d; p.r += s.r; p.fk += s.fk; p.cl += s.cl;
      p.form = clamp(Math.round((p.form * .6 + (s.k - s.d) / Math.max(1, s.r) * 4) * 10) / 10, -4, 4);
    });
    if(t.id !== S.userId) t.conf = clamp(Math.round(60 + (t.conf - 60) * .5 + (k === w ? 3 : -3)), 30, 85);
  }
  const po = S.po[meta.lg];
  if(meta.ph === 'sf'){ po.sfW[meta.slot] = W.id; po.sfL[meta.slot] = Lz.id; }
  if(meta.ph === 'f'){ po.champ = W.id; po.runner = Lz.id; }
  S.results.push({i:meta.idx, ph:meta.ph, lg:meta.lg, a:m.t.a.id, b:m.t.b.id, sa:m.score.a, sb:m.score.b, w:W.id, ot:m.wasOT, map:m.map.loc, up:W.power <= Lz.power - 5, user:!!meta.user});
  if(S.results.length > 400) S.results.splice(0, S.results.length - 400);
}
/* Simula, instantaneamente, todas as partidas não-usuário de um dia de jogo em TODAS as ligas */
function simStage(idx){
  let user = null, n = 0;
  for(const l of LEAGUES){
    const st = stageOf(l.id, idx); if(!st) continue;
    if(st.ph === 'sf' && !S.po[l.id]) setupPO(l.id);
    if(st.ph === 'f'){ const po = S.po[l.id]; po.final = po.sfW.slice().sort((x, y) => po.seeds.indexOf(x) - po.seeds.indexOf(y)); }
    fixtures(l.id, idx).forEach((pair, slot) => {
      if(pair.includes(S.userId)){ user = {a:S.userId, b:pair[0] === S.userId ? pair[1] : pair[0], lg:l.id, slot, ph:st.ph}; return; }
      commit(quickMatch(T(pair[0]), T(pair[1])), {idx, lg:l.id, slot, ph:st.ph}); n++;
    });
  }
  return {user, n};
}
function closeLeague(lid){
  const po = S.po[lid], g = leagueTable(lid).map(t => t.id);
  const losers = po.sfL.slice().sort((x, y) => po.seeds.indexOf(x) - po.seeds.indexOf(y));
  const fin = [po.champ, po.runner, ...losers, ...g.slice(4)];
  S.final[lid] = fin; fin.forEach((id, i) => T(id).si += PLACE_PTS[i]);
}
const closeStage = idx => LEAGUES.forEach(l => { const st = stageOf(l.id, idx); if(st && st.ph === 'f' && !S.final[l.id]) closeLeague(l.id); });
function startMatchday(){
  const idx = S.md, t0 = performance.now(), pre = g16Status();
  S.offers = [];                                             // ao iniciar a rodada a janela fecha
  S.snap = {rank:pre.rank, si:T(S.userId).si, inn:pre.in, pts:pre.pts, cash:S.club.cash};
  pre.tb.forEach(r => { r.t.siPrev = r.t.si; r.t.rkPrev = r.rank; });
  const r = simStage(idx);
  S.cur = {idx, user:r.user, sim:r.n, ms:Math.max(.1, +(performance.now() - t0).toFixed(1))};
  save(); return S.cur;
}
function finishMatchday(userRes){
  const idx = S.cur.idx, u = T(S.userId);
  closeStage(idx);
  if(idx === totalMD() - 1){                              // liga do usuário encerrada: o resto do circuito é simulado até o fim
    for(let i = idx + 1; i < 40 && LEAGUES.some(l => !S.final[l.id]); i++){ simStage(i); closeStage(i); }
    S.done = true;
  }
  S.md = idx + 1;
  if(!S.done && S.md === midMD()){ const n = cpuMarket('mid'); S.offers = genOffers(); addNews(`Janela de meio de temporada: ${n} transferências entre times da CPU`); }
  const after = g16Status(), sn = S.snap, place = S.final[u.league] ? S.final[u.league].indexOf(S.userId) + 1 : null;
  S.report = {idx, label:mdLabel(idx), res:userRes || null, dSI:u.si - sn.si, rankBefore:sn.rank, rankAfter:after.rank, inn:after.in,
    dropped:sn.inn && !after.in, gained:!sn.inn && after.in, place, sim:S.cur.sim, ms:S.cur.ms, dCash:0};
  S.cur = null;
  if(!S.done){ S.club.week++; startWeek(); S.report.dCash = S.club.cash - sn.cash; }
  save(); return S.report;
}
const mvpScore = s => s.k - s.d + s.fk * .5 + s.cl * 1.5;
function mvpOf(m){
  let best = null;
  for(const k of ['a','b']) m.t[k].players.forEach((p, i) => { const s = m.ps[k][i], sc = mvpScore(s) + (k === m.winner ? 1.5 : 0); if(!best || sc > best.sc) best = {name:p.name, team:m.t[k].id, k:s.k, d:s.d, sc}; });
  return best;
}
const rating = p => p.r ? clamp(1 + (p.k - p.d) / p.r * .8 + p.fk / p.r * .6, .3, 2.5) : 1;
function finishUserMatch(m, meta){
  commit(m, meta);
  const won = m.winner === 'a', t = T(S.userId), c = S.club;
  t.players.forEach(p => { p.stress = clamp(p.stress + Math.round((5 + (won ? 0 : 4)) * psy()), 0, 100); p.sat = clamp(p.sat + (won ? 3 : -3), 0, 100); });
  t.conf = clamp(t.conf + (won ? 2 : -3), 15, 80); t.chem = clamp(t.chem + (won ? 1 : -1), 0, 90);
  if(won) c.cash += Math.round(12 * (1 + .3 * c.staff.md));
  S.uh.push({idx:meta.idx, opp:m.t.b.id, won, sa:m.score.a, sb:m.score.b, ot:m.wasOT, map:m.map.name});
  return finishMatchday({won, sa:m.score.a, sb:m.score.b, opp:m.t.b.id, ot:m.wasOT, map:m.map.name, mvp:mvpOf(m)});
}

function talkCtx(){
  const t = T(S.userId), c = S.club, ps = t.players, rp = () => pick(ps);
  const last = S.uh[S.uh.length - 1], lastLoss = !!last && !last.won;
  let streak = 0; for(let i = S.uh.length - 1; i >= 0 && S.uh[i].won; i--) streak++;
  return {t, ps, lastLoss, streak, an:c.staff.an, maxStress:Math.max(...ps.map(p => p.stress)), rp};
}
function pickTalk(){
  const ctx = talkCtx(), pool = TALKS.map(x => ({x, w:x.w(ctx)})).filter(o => o.w > 0), ch = wpick(pool, o => o.w).x;
  let p1;
  if(ch.who === 'stress') p1 = ctx.ps.reduce((b, p) => p.stress > b.stress ? p : b);
  else if(ch.who === 'igl') p1 = ctx.ps.find(p => p.igl) || ctx.rp();
  else p1 = ctx.rp();
  const p2 = pick(ctx.ps.filter(p => p !== p1));
  return {id:ch.id, p1:p1.name, p2:p2.name, done:null};
}
const talkDef = id => TALKS.find(x => x.id === id);
function talkView(){
  const tk = S.club.talk; if(!tk) return null;
  const d = talkDef(tk.id), c = {p1:tk.p1, p2:tk.p2};
  return {def:d, title:d.title, text:d.text(c), opts:d.opts.map(o => ({t:o.t.replace('${p1}', tk.p1), req:o.req, locked:o.req && !S.club.staff[o.req]}))};
}
function applyFx(fx){
  const t = T(S.userId), tk = S.club.talk, P1 = t.players.find(p => p.name === tk.p1), P2 = t.players.find(p => p.name === tk.p2), c = S.club;
  const K = 1 + .3 * c.staff.md;
  for(const [k, v] of Object.entries(fx)){
    if(k === 'chem') t.chem = clamp(t.chem + v, 0, 100);
    else if(k === 'conf') t.conf = clamp(t.conf + v, 15, 95);
    else if(k === 'cash') c.cash += v > 0 ? Math.round(v * K) : v;
    else if(k === 'sat') t.players.forEach(p => p.sat = clamp(p.sat + v, 0, 100));
    else if(k === 'stress') t.players.forEach(p => p.stress = clamp(p.stress + Math.round(v > 0 ? v * psy() : v), 0, 100));
    else if(k === 'aim'){ t.players.forEach(p => { p.aim = Math.min(99, p.aim + v); recalc(p); }); }
    else if(k === 'gs'){ t.players.forEach(p => { p.gs = Math.min(99, p.gs + v); recalc(p); }); }
    else if(k === 'p1sat' && P1) P1.sat = clamp(P1.sat + v, 0, 100);
    else if(k === 'p2sat' && P2) P2.sat = clamp(P2.sat + v, 0, 100);
    else if(k === 'p1stress' && P1) P1.stress = clamp(P1.stress + v, 0, 100);
  }
}
function resolveTalk(i){
  const tk = S.club.talk; if(!tk || tk.done) return null;
  const d = talkDef(tk.id), o = d.opts[i]; if(!o || (o.req && !S.club.staff[o.req])) return null;

/* =====================================================================
   3b. MERCADO DE TRANSFERÊNCIAS · TEMPORADAS INFINITAS
   Janelas: pré-temporada (antes da 1ª rodada) e meio da temporada. Usuário e CPU negociam
   jogadores com taxa em K$; a CPU tem orçamento próprio (t.bud). Ao fim de cada temporada
   os atletas envelhecem/evoluem, veteranos se aposentam, nascem promessas e o calendário reinicia.
   ===================================================================== */
const squad = t => t.players.concat(t.bench);
const midMD = () => Math.floor(nG(userLid()) / 2);
const windowOpen = () => !!S && !S.cur && !S.done && (S.md === 0 || S.md === midMD());
const winLabel = () => S.md === 0 ? 'pré-temporada' : 'meio da temporada';
const rnd5 = v => Math.round(v / 5) * 5;
/* valor de mercado: cresce com o rating, cai com a idade e ganha prêmio de potencial nos jovens */
const pval = p => rnd5(Math.max(10, (20 + Math.pow(Math.max(0, p.ovr - 70), 1.5) * 2) * (p.age <= 20 ? 1.35 : p.age <= 23 ? 1.15 : p.age <= 27 ? 1 : p.age <= 30 ? .8 : .55) + (p.age <= 23 ? Math.max(0, p.pot - p.ovr) * 4 : 0)));
const faCost = p => Math.max(5, rnd5(pval(p) * .6));
const buyCost = (t, p) => rnd5(pval(p) * (t.players.includes(p) ? 1.3 : 1.1) * (t.star === p.name ? 1.4 : 1));
const winId = () => S.year + ':' + S.md;                 // identifica a janela atual; quem chega nela não pode ser revendido nela
const flipMsg = 'Contratado nesta janela — só pode ser revendido na próxima.';
const scoreP = p => p.ovr + (p.age <= 21 ? (p.pot - p.ovr) * .25 : 0);      // como a CPU enxerga um jogador
const weakest = t => t.players.reduce((b, p) => scoreP(p) < scoreP(b) ? p : b);
const takenNow = () => { const s = namesOf(S.teams); S.fa.forEach(p => s.add(p.name.toLowerCase())); return s; };
const nameClash = (t, p) => squad(t).some(x => x.name.toLowerCase() === p.name.toLowerCase());
function refreshPower(t){ t.power = Math.round(t.players.reduce((s, p) => s + p.ovr, 0) / t.players.length); }
function ensureIgl(t){ if(!t.players.some(p => p.igl)) t.players.reduce((b, p) => p.gs > b.gs ? p : b).igl = true; }
function addNews(txt, ovr = 0){ S.news.unshift({y:S.year, t:txt, o:ovr}); if(S.news.length > 80) S.news.length = 80; }

/* reposição imediata de um titular que saiu: melhor free agent que o time paga → senão promessa da base */
function backfill(t, ref){
  let p = null;
  if(t.id !== S.userId){
    p = S.fa.filter(x => faCost(x) <= t.bud && x.ovr >= ref.ovr - 12).sort((a, b) => b.ovr - a.ovr)[0];
    if(p){ S.fa.splice(S.fa.indexOf(p), 1); t.bud -= faCost(p); }
  }
  return p || mkPlayer({name:genName(takenNow()), ovr:clamp(ref.ovr - rint(6, 12), 55, 85), age:rint(17, 20), pot:clamp(ref.ovr + rint(0, 8), 60, 95)});
}
/* remove p do elenco; se era titular, o melhor reserva (ou a reposição) assume a mesma função */
function takeOut(t, p){
  if(t.star === p.name) t.star = null;
  const bi = t.bench.indexOf(p); if(bi >= 0){ t.bench.splice(bi, 1); return null; }
  const si = t.players.indexOf(p); if(si < 0) return null;
  let r;
  if(t.bench.length){ r = t.bench.reduce((b, x) => x.ovr > b.ovr ? x : b); t.bench.splice(t.bench.indexOf(r), 1); } else r = backfill(t, p);
  r.role = p.role; r.igl = false; p.igl = false; t.players[si] = r;
  ensureIgl(t); refreshPower(t); return r;
}
function keepBench(t, p){
  if(t.bench.length < CPU_BENCH) t.bench.push(p);
  else { const w = t.bench.reduce((b, x) => x.ovr < b.ovr ? x : b); if(p.ovr > w.ovr){ t.bench[t.bench.indexOf(w)] = p; S.fa.push(w); } else S.fa.push(p); }
}
/* p chega a um time da CPU: entra no lugar do titular mais fraco se for upgrade; senão vai ao banco */
function cpuAdd(t, p){
  p.igl = false; const W = weakest(t);
  if(scoreP(p) > scoreP(W)){ p.role = W.role; W.igl = false; t.players[t.players.indexOf(W)] = p; keepBench(t, W); ensureIgl(t); refreshPower(t); }
  else keepBench(t, p);
}
const trimFA = () => { if(S.fa.length > FA_CAP) S.fa = S.fa.sort((a, b) => pval(b) - pval(a)).slice(0, FA_CAP); };

/* ---------- mercado da CPU: cada time tenta melhorar seu titular mais fraco dentro do orçamento ---------- */
function cpuMarket(kind){
  const teams = shuffle(Object.values(S.teams).filter(t => t.id !== S.userId)), sold = {};
  let deals = 0;
  teams.forEach(t => {
    for(let n = 0; n < (kind === 'pre' ? 2 : 1); n++){
      if(rnd() > (kind === 'pre' ? .7 : .4)) continue;
      const W = weakest(t); let best = null, bs = 0;
      const consider = (p, src, price) => { if(price > t.bud) return; const up = scoreP(p) - scoreP(W); if(up < 2) return; const s = up - price / 60 + rnd(); if(s > bs){ bs = s; best = {p, src, price}; } };
      S.fa.forEach(p => consider(p, null, faCost(p)));
      teams.forEach(o => {
        if(o === t) return;
        o.bench.forEach(p => consider(p, o, pval(p)));
        if(!sold[o.id]) o.players.forEach(p => consider(p, o, buyCost(o, p)));
      });
      if(!best) continue;
      const {p, src, price} = best;
      t.bud -= price;
      if(src){ src.bud += price; takeOut(src, p); sold[src.id] = 1; } else S.fa.splice(S.fa.indexOf(p), 1);
      cpuAdd(t, p); deals++;
      addNews(`${t.short} contrata ${p.name} (${p.ovr}) ${src ? 'de ' + src.short : 'como agente livre'} por ${price} K$`, p.ovr);
    }
  });
  trimFA(); return deals;
}
/* propostas de times da CPU por um jogador: só quem ganharia rating e tem orçamento */
function bidsFor(p, n = 4, prem = 0){
  const val = pval(p), out = [];
  Object.values(S.teams).forEach(t => {
    if(t.id === S.userId || scoreP(p) - scoreP(weakest(t)) < 2) return;
    const fee = rnd5(val * (.8 + prem + rnd() * .3)); if(fee <= t.bud) out.push({tid:t.id, fee});
  });
  return out.sort((a, b) => b.fee - a.fee).slice(0, n);
}
function genOffers(){
  const out = [];
  shuffle(squad(T(S.userId)).filter(p => p.ovr >= 70)).forEach(p => {
    if(out.length >= 3 || rnd() > .45) return;
    const b = bidsFor(p, 1, .15)[0]; if(b) out.push({pid:p.id, tid:b.tid, fee:b.fee});     // propostas espontâneas pagam prêmio
  });
  return out;
}
function syncTalk(){
  const tk = S.club.talk, ps = T(S.userId).players;

}

const mine = id => { const u = T(S.userId), p = squad(u).find(x => x.id === id); return p ? {u, p} : null; };

function buyPlayer(tid, id){

function sellTo(id, tid, fee){

/* ---------- virada de temporada ---------- */
function progress(p){

  p.aim = clamp(p.aim + d + n, 45, 99); p.gs = clamp(p.gs + d - n, 45, 99); recalc(p);
  p.pot = a >= 26 ? p.ovr : Math.max(p.pot, p.ovr);
}
const retires = p => p.age >= 33 && rnd() < Math.min(1, (p.age - 32) * .3);
const seasonBase = t => Math.round(Math.max(0, (t.power - 72) * 4.5) + rnd() * 22);

    refreshPower(t);

    gone.forEach(p => { takeOut(t, p); if(t.id === S.userId) info.myRetired.push(p); if(p.ovr >= 85) info.legends.push({p, t}); });
  });

  });

  Object.assign(S, {md:0, cur:null, po:{}, final:{}, results:[], uh:[], report:null, done:false, snap:null});

/* ---------- mercado de transferências ---------- */
const ovrB = v => `<span class="ovr ${v >= 90 ? 'e' : v >= 85 ? 'g' : v >= 80 ? 'c' : ''}">${v}</span>`;
function mkRows(){
  const f = UI.mk, cash = S.club.cash, q = f.q.trim().toLowerCase();
  let rows = f.tab === 'fa' ? S.fa.map(p => ({p, t:null, price:faCost(p)}))
    : Object.values(S.teams).filter(t => t.id !== S.userId && (f.lg === 'ALL' || t.league === f.lg)).flatMap(t => squad(t).map(p => ({p, t, price:buyCost(t, p)})));
  rows = rows.filter(r => (f.role === 'ALL' || r.p.role === f.role) && (!q || r.p.name.toLowerCase().includes(q) || (r.t && r.t.name.toLowerCase().includes(q))) && (!f.afford || r.price <= cash));
  const key = {ovr:r => -r.p.ovr, pot:r => -r.p.pot, price:r => r.price, age:r => r.p.age}[f.sort] || (r => -r.p.ovr);
  rows.sort((a, b) => key(a) - key(b) || b.p.ovr - a.p.ovr);
  return {n:rows.length, rows:rows.slice(0, 50)};
}
function mkListHTML(){
  const u = T(S.userId), open = windowOpen(), cash = S.club.cash, full = u.bench.length >= MAX_BENCH, {n, rows} = mkRows();
  const body = rows.map(({p, t, price}) => {
    const why = !open ? 'Janela fechada' : full ? 'Banco cheio' : price > cash ? 'Caixa insuficiente' : nameClash(u, p) ? 'Nome repetido no elenco' : '';
    return `<tr><td><b>${esc(p.name)}</b>${t && t.star === p.name ? ' <span class="gold">★</span>' : ''}</td><td>${p.role}</td><td class="num">${p.age}</td><td class="num">${ovrB(p.ovr)}</td><td class="num ${p.pot > p.ovr ? 'green' : 'mut'}">${p.pot}</td>
      <td>${t ? `${tn(t)}<span class="mut" style="font-size:11px">${t.players.includes(p) ? 'titular' : 'reserva'}</span>` : '<span class="mut">Agente livre</span>'}</td>
      <td class="num gold"><b>${price}</b></td><td><button class="btn sm ${why ? '' : 'gold'}" data-act="${t ? 'buy' : 'sign'}" data-id="${p.id}"${t ? ` data-t="${t.id}"` : ''} ${why ? 'disabled' : ''} title="${why}">Contratar</button></td></tr>`;
  }).join('');
  return `<div class="mut" style="font-size:12px;margin-bottom:6px">${n} jogador(es)${n > 50 ? ' — mostrando os 50 primeiros; refine os filtros' : ''}</div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Jogador</th><th>Função</th><th class="num">Idade</th><th class="num">OVR</th><th class="num">POT</th><th>Time</th><th class="num">Preço K$</th><th></th></tr></thead><tbody>${body || '<tr><td colspan="8" class="mut">Nenhum jogador com esses filtros.</td></tr>'}</tbody></table></div>`;
}

  const body = f.tab === 'offers' ? offersHTML() : f.tab === 'mine' ? mineHTML()

    : `${filt}<div id="mk-list">${mkListHTML()}</div>`;

      <div class="mut" style="font-size:12px;max-width:520px;text-align:right">Agentes livres custam 60% do valor de mercado; jogadores de outros times custam o valor (reservas) ou +30% (titulares; +40% se for a estrela). Cada contratação tira 3 de química.</div></div></div>
    <div class="alert ${st[0]}"><div class="ic">${st[1]}</div><div><h4>${st[2]}</h4><p>${st[3]}</p></div></div>
    <div class="tabs">${tabs}</div><div class="card">${body}</div></div>`;
}

  openModal(`<div class="mhead"><h2><b>Vender</b> · ${esc(p.name)}</h2><div class="sp"></div><button class="btn sm" data-act="close">✕ Fechar</button></div>

    ${blocked ? '<div class="alert warn" style="margin:10px 0"><div class="ic">⚠️</div><div><h4>Sem reserva</h4><p>Contrate um reserva antes de vender um titular.</p></div></div>' : ''}

      : locked ? '' : '<p class="mut">Nenhum time se interessou agora (é preciso ser upgrade para o time e caber no orçamento). Reservas sem procura podem ser dispensados.</p>'}`, true);
}

/* ---------- loop de tempo real ---------- */
function startRound(){
  const m = CM; if(!m || !m.ready || UI.phase !== 'prep' || m.done) return;
  const side = sideOfUser(m);
  UI.rs = roundInit(m, UI.plan[side], true); UI.clock = 0; UI.plantAt = null; UI.frozen = false; UI.skip = false; UI.phase = 'live';
  UI.ev = roundNext(UI.rs); drain(); updateMatch();
  clearInterval(UI.timer); UI.timer = setInterval(tick, 50);
}
function tick(){
  if(UI.frozen || UI.phase !== 'live') return;
  UI.clock += 12 * (UI.skip ? 200 : UI.speed) * .05;
  drain(); updateClock();
}
function showEvent(ev){
  if(ev.type === 'plant') UI.plantAt = ev.t;
  (ev.L || []).forEach(l => feedAdd(l, untimed(l.c) ? null : ev.t));
}
function drain(){
  const rs = UI.rs;
  while(UI.ev && UI.ev.t <= UI.clock && !UI.frozen){
    const ev = UI.ev; UI.ev = null;
    if(ev.type === 'interv'){ openInterv(ev); return; }
    showEvent(ev);
    if(ev.type === 'end'){ endOfRound(); return; }
    UI.ev = roundNext(rs);
  }
}
function endOfRound(){
  clearInterval(UI.timer); const m = CM;
  UI.clock = ROUND_SEC; UI.skip = false; UI.plantAt = null;
  UI.phase = m.done ? 'done' : 'prep'; updateMatch();
  if(m.done) onMatchEnd();
  else if(UI.auto) setTimeout(() => { if(CM === m && UI.phase === 'prep' && UI.auto) startRound(); }, 900);
}
function openInterv(ev){
  UI.frozen = true; UI.phase = 'interv'; UI.ivKind = ev.kind; const u = ev.unit, iv = $('#iv');
  const A = ev.kind === 'A';
  const title = A ? (ev.reason === 'fb' ? '⚠ SOFREMOS O FIRST BLOOD' : '⚠ PERDEMOS O HARD BREACHER') : '💣 O INIMIGO PLANTOU O DESATIVADOR';
  const sub = A ? (ev.reason === 'fb' ? `${esc(u.p.name)} ${opU(u)} caiu na abertura do round.` : `${esc(u.p.name)} ${opU(u)} foi eliminado antes de abrir a parede.`) : `Restam ${PLANT_SEC}s. O relógio está correndo!`;
  const opts = A ? [['retreat','↩ Recuar para o Retake tardio','+3 nos duelos · ' + (UI.rs.ak === CM.userKey ? 'plant mais lento' : 'o plant do rival fica mais fácil')], ['vertical','🕳 Mudar Rota e forçar verticalidade','Aposta: até +7 se der certo, −4 se falhar (Gamesense ajuda)']]
    : [['axes','🔀 Avanço Simultâneo de eixos','Aposta: +6 e defuse mais fácil, ou −3 se desalinhar (Gamesense ajuda)'], ['utility','💨 Gastar Utilitários (Fumaça/Flash)','+3 garantido e defuse um pouco mais fácil']];
  iv.innerHTML = `<div class="ivbox"><div class="ivt">${title}</div><p>${sub}</p><div class="ivb"><i id="ivbar"></i></div>
    <div class="stack" style="gap:8px;margin-top:12px">${opts.map(([k, n, d]) => `<button class="st" data-act="iv" data-o="${k}"><span class="n">${n}</span><span class="d">${d}</span></button>`).join('')}</div><div class="mut" style="font-size:11px;margin-top:8px">O round está congelado. Sem decisão em 10s o time hesita (−2).</div></div>`;
  iv.classList.add('open'); let left = 10;
  clearInterval(UI.ivTimer);
  UI.ivTimer = setInterval(() => { left -= .1; const b = $('#ivbar'); if(b) b.style.width = (left * 10) + '%'; if(left <= 0) resolveInterv('timeout'); }, 100);
}
function resolveInterv(opt){
  if(!UI.frozen) return;
  clearInterval(UI.ivTimer); $('#iv').classList.remove('open');
  const txt = applyInterv(UI.rs, UI.ivKind, opt);
  feedAdd({c:'clutch', h:txt}, Math.min(UI.clock, ROUND_SEC));
  UI.frozen = false; UI.phase = 'live'; UI.ev = roundNext(UI.rs); drain(); updateMatch();
}
function openTimeout(){
  const m = CM; if(!m || UI.phase !== 'prep' || m.tos.a < 1) return;
  openModal(`<div class="mhead"><h2><b>Timeout</b> técnico</h2><div class="sp"></div><button class="btn sm" data-act="close">✕</button></div>
    <p class="mut" style="margin-bottom:12px">1 pausa por mapa. Escolha o discurso: a confiança do time (${Math.round(m.conf.a)}) será redefinida e o momentum do rival, zerado.</p>
    <div class="stack" style="gap:8px">
      <button class="st" data-act="tpost" data-p="ear"><span class="ic">😤</span><span class="n">Puxão de orelha</span><span class="d">Confiança volta a ${m.conf.a < 50 ? 68 : 55}. Custa moral (−5 Satisfação) e sobe o estresse. Funciona melhor com o time em baixa.</span></button>
      <button class="st" data-act="tpost" data-p="motiv"><span class="ic">🔥</span><span class="n">Motivacional</span><span class="d">Confiança volta a 65, sobe a satisfação e a química do grupo.</span></button>
      <button class="st" data-act="tpost" data-p="adjust"><span class="ic">📋</span><span class="n">Ajuste estratégico</span><span class="d">Confiança volta a 55, mas o plano corrigido dá +3 nos duelos nos próximos 3 rounds.</span></button></div>`, true);
}
function simAll(){
  const m = CM; if(!m || m.done || !m.ready || UI.phase === 'live' || UI.phase === 'interv') return;
  UI.auto = false;
  while(!m.done){ const {lines} = runRoundAuto(m, UI.plan[sideOfUser(m)]); lines.forEach(l => feedAdd(l, untimed(l.c) ? null : l.t)); }
  UI.phase = 'done'; updateMatch(); onMatchEnd();
}
function onMatchEnd(){
  const m = CM; if(m.finished) return;
  m.finished = true; UI.auto = false; clearInterval(UI.timer);
  const rep = finishUserMatch(m, m.meta); m.report = rep;
  updateMatch(); renderTop(); renderSide();
  setTimeout(() => { if(CM === m) showReport(rep); }, 700);
}

/* ---------- relatório pós-rodada ---------- */
function showReport(rep){
  const u = T(S.userId), al = computeAlerts(), r = rep.res, opp = r ? T(r.opp) : null;
  let head;
  if(r) head = `<div class="row" style="justify-content:center;gap:22px;margin:6px 0 14px"><div class="center">${logo(u, 'lg')}<div style="margin-top:6px;font-weight:800">${esc(u.short)}</div></div>
      <div class="center"><div class="big" style="font-size:52px;color:${r.won ? 'var(--cyan)' : 'var(--red)'}">${r.sa} : ${r.sb}</div><div class="tag ${r.won ? 'cyan' : 'red'}">${r.won ? 'VITÓRIA' : 'DERROTA'}${r.ot ? ' · OT' : ''}</div></div>
      <div class="center">${logo(opp, 'lg')}<div style="margin-top:6px;font-weight:800">${esc(opp.short)}</div></div></div>
      <div class="kv"><span>Mapa</span><b>${esc(r.map)}</b></div><div class="kv"><span>MVP da partida</span><b class="gold">${esc(r.mvp.name)} <span class="mut">(${r.mvp.k}K/${r.mvp.d}D)</span></b></div>`;
  else head = `<p class="mut" style="margin-bottom:10px">${rep.label} foi simulada sem a sua participação.</p>`;
  const alerts = al.map(a => `<div class="alert ${a.lv}" style="margin-top:8px"><div class="ic">${a.ic}</div><div><h4>${esc(a.t)}</h4><p>${esc(a.x)}</p></div></div>`).join('');
  const drama = rep.dropped ? `<div class="alert crit" style="margin-top:8px"><div class="ic">📉</div><div><h4>VOCÊ CAIU DA LINHA DE CORTE DO G16!</h4><p>O ranking mundial mudou: você despencou para #${rep.rankAfter}. A pressão é máxima.</p></div></div>`
    : rep.gained ? `<div class="alert ok" style="margin-top:8px"><div class="ic">📈</div><div><h4>Você entrou no G16!</h4><p>Subiu para #${rep.rankAfter} no ranking mundial projetado.</p></div></div>` : '';
  const dr = rep.rankBefore - rep.rankAfter;
  const fin = S.done ? `<div class="alert info" style="margin-top:8px"><div class="ic">🏁</div><div><h4>Stage 2 encerrado — ${rep.place}º na ${LG[u.league].tag}</h4><p>Colocação final creditada: +${PLACE_PTS[rep.place - 1]} pts SI.</p></div></div>` : '';
  const burn = u.players.filter(isBurnout);
  openModal(`<div class="mhead"><h2><b>${esc(rep.label)}</b> · relatório</h2></div>${head}
    <div class="kv"><span>SI Points ganhos</span><b class="gold">+${rep.dSI}</b></div>
    <div class="kv"><span>Ranking mundial (projeção)</span><b>#${rep.rankBefore} → #${rep.rankAfter} <span class="${dr > 0 ? 'up' : dr < 0 ? 'dn' : 'mut'}">${dr > 0 ? '▲' + dr : dr < 0 ? '▼' + -dr : ''}</span></b></div>
    ${S.done ? '' : `<div class="kv"><span>Caixa (semana nova)</span><b>${rep.dCash >= 0 ? '+' : ''}${rep.dCash} K$ · ${S.club.cash} K$</b></div>`}
    <div class="kv"><span>Rodada global</span><b>${rep.sim} partidas simuladas em ${rep.ms} ms</b></div>${fin}${drama}${alerts}
    ${!S.done ? `<div class="alert info" style="margin-top:8px"><div class="ic">📋</div><div><h4>Nova semana de preparação</h4><p>Defina a rotina de 3 dias e responda ao Talk do vestiário antes da próxima rodada.${burn.length ? ' Atenção ao burnout: ' + burn.map(p => p.name).join(', ') + '.' : ''}</p></div></div>` : ''}
    <div class="row" style="margin-top:16px"><button class="btn gold" data-act="report-ok">Continuar</button><button class="btn" data-act="global">Global Standings</button></div>`, true);
  if(rep.dropped) toast(`<b class="red">💥 QUEDA DO G16</b><br>Você agora está em #${rep.rankAfter}.`, 'crit');
  else if(al[0] && al[0].lv === 'crit' && !S.done) toast(`<b>${al[0].ic} ${esc(al[0].t)}</b><br><span class="mut">${esc(al[0].x)}</span>`, 'crit');
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset;
  switch(a){
    case 'pick-league': UI.pickLeague = d.l; UI.selTeam = null; render(); break;
    case 'pick-team': UI.selTeam = d.id; render(); break;
    case 'start': if(UI.selTeam){ newCareer(UI.selTeam); UI.lgTab = null; UI.view = 'week'; render(); toast(`Carreira iniciada com <b>${esc(T(S.userId).name)}</b>. Comece pela rotina da semana!`, 'ok'); } break;
    case 'continue': S = loadSave(); if(S){ UI.lgTab = null; UI.view = 'dash'; render(); } break;
    case 'wipe': if(confirm('Apagar o save atual?')){ wipeSave(); render(); } break;
    case 'nav': UI.view = d.v; UI.lgTab = null; render(); break;
    case 'global': openGlobal(); break;
    case 'close': closeModal(); break;
    case 'gtab': UI.gTab = d.l; openGlobal(); break;
    case 'gmode': UI.gMode = d.m; openGlobal(); break;
    case 'sfilter': UI.sFilter = d.l; renderSide(); break;
    case 'lgtab': UI.lgTab = d.l; render(); break;
    case 'day': { const r = doDay(d.a); if(r){ if(r.burn.length) toast(`<b class="red">🔥 BURNOUT</b><br>${r.burn.map(esc).join(', ')} passou de 80 de estresse: −15 de rating em jogo.`, 'crit'); render(); } break; }
    case 'skip-routine': skipRoutine(); render(); break;
    case 'talk': { const r = resolveTalk(+d.i); if(r != null) render(); break; }
    case 'hire': if(hireStaff(d.k)){ toast(`${STAFF[d.k].ico} <b>${STAFF[d.k].name}</b> agora é nível ${S.club.staff[d.k]}.`, 'ok'); render(); } break;
    case 'md-start': startUserMatch(); break;
    case 'cad': UI.plan[sideOfUser(CM)].cad = +d.v; updateMatch(); break;
    case 'route': UI.plan[sideOfUser(CM)].route = +d.v; updateMatch(); break;
    case 'start-round': startRound(); break;
    case 'speed': UI.speed = +d.v; updateMatch(); break;
    case 'skip-round': UI.skip = true; break;
    case 'tout': openTimeout(); break;
    case 'tpost': { const r = doTimeout(CM, 'a', d.p); closeModal(); feedAdd({c:'sys', h:`⏱ <b>TIMEOUT TÉCNICO</b> — ${{ear:'Puxão de orelha', motiv:'Discurso motivacional', adjust:'Ajuste estratégico'}[d.p]}: confiança ${Math.round(r.pre)} → ${Math.round(r.post)}.`}); updateMatch(); break; }
    case 'iv': resolveInterv(d.o); break;
    case 'auto': UI.auto = !UI.auto; updateMatch(); if(UI.auto && UI.phase === 'prep') startRound(); break;
    case 'simall': simAll(); break;
    case 'result': if(CM && CM.report) showReport(CM.report); break;
    case 'report-ok': closeModal(); CM = null; UI.phase = 'idle'; UI.view = S.done ? 'dash' : 'week'; render(); break;
    case 'next-season': if(S.done){ const info = nextSeason(); CM = null; UI.lgTab = null; UI.gTab = 'ALL'; UI.mk.tab = S.offers.length ? 'offers' : 'fa'; UI.view = 'dash'; render(); showSeason(info); } break;
    case 'season-ok': closeModal(); UI.view = d.v; render(); break;
    case 'mk-tab': UI.mk.tab = d.tab; rerender(); break;
    case 'mk-afford': UI.mk.afford = !UI.mk.afford; rerender(); break;
    case 'sign': case 'buy': {
      const p = a === 'sign' ? S.fa.find(x => x.id === +d.id) : (T(d.t) ? squad(T(d.t)).find(x => x.id === +d.id) : null), r = a === 'sign' ? signFA(+d.id) : buyPlayer(d.t, +d.id);
      if(r) toast(esc(r), 'warn'); else toast(`<b>${esc(p.name)}</b> (${p.ovr}) chegou ao banco de reservas. Promova-o no <b>Elenco</b> se quiser escalá-lo.`, 'ok');
      rerender(); break; }
    case 'sell': openSell(+d.id); break;
    case 'sell-ok': {
      const b = UI.sell && UI.sell.bids[+d.i]; if(!b) break;
      const p = mine(UI.sell.id).p, r = sellTo(UI.sell.id, b.tid, b.fee); closeModal();
      if(typeof r === 'string') toast(esc(r), 'warn');
      else toast(`<b>${esc(p.name)}</b> foi para ${esc(T(b.tid).short)}: <b class="gold">+${b.fee} K$</b>.${r ? ` <b>${esc(r.rep.name)}</b> assume a vaga de titular.` : ''}`, 'ok');
      UI.sell = null; rerender(); break; }
    case 'release': { const m = mine(+d.id), r = releasePlayer(+d.id); toast(r ? esc(r) : `<b>${esc(m.p.name)}</b> foi dispensado e voltou ao mercado.`, r ? 'warn' : 'ok'); rerender(); break; }
    case 'swap': { const r = swapLineup(+d.b, +d.s); if(r) toast(esc(r), 'warn'); rerender(); break; }
    case 'offer': { const o = S.offers[+d.i], r = answerOffer(+d.i, d.y === '1'); if(typeof r === 'string') toast(esc(r), 'warn'); else if(d.y === '1') toast(`Proposta aceita: <b class="gold">+${o.fee} K$</b>.${r ? ` <b>${esc(r.rep.name)}</b> assume a vaga de titular.` : ''}`, 'ok'); rerender(); break; }
    case 'newcareer': if(confirm('Iniciar uma nova carreira? O save atual será apagado.')){ wipeSave(); S = null; CM = null; UI.selTeam = null; UI.view = 'select'; render(); } break;
    case 'menu': openModal(`<div class="mhead"><h2><b>Menu</b></h2><div class="sp"></div><button class="btn sm" data-act="close">✕</button></div>
      <p class="mut" style="margin-bottom:12px">O progresso é salvo automaticamente no navegador (localStorage) a cada dia de rotina, decisão de Talk e rodada.</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn" data-act="newcareer">Nova carreira</button><button class="btn" data-act="close">Voltar ao jogo</button></div>`, true); break;
  }
});
document.addEventListener('keydown', e => {
  if(e.target.matches('input,textarea,select')) return;
  if(e.key === 'Escape') closeModal();
  if((e.key === 'g' || e.key === 'G') && S && UI.view !== 'select') openGlobal();
  if(UI.view === 'match' && CM && !$('#modal').classList.contains('open') && !UI.frozen){
    if((e.key === ' ' || e.key === 'Enter') && UI.phase === 'prep'){ e.preventDefault(); startRound(); }
    if(UI.phase === 'prep' && /^[1-5]$/.test(e.key)){ UI.plan[sideOfUser(CM)].cad = +e.key; updateMatch(); }
  }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.mk; if(!k || k === 'q' || !S) return; UI.mk[k] = e.target.value; rerender(); });
document.addEventListener('input', e => { if(!S || !e.target.dataset || e.target.dataset.mk !== 'q') return; UI.mk.q = e.target.value; const l = $('#mk-list'); if(l) l.innerHTML = mkListHTML(); });
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

/* ---------- boot ---------- */
render();

</script>
</body>
</html>
