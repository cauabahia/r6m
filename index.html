function startWeek(){
  const c = S.club, t = T(S.userId);
  c.scout = false;
  const inc = sponsorIncome(), sal = salaries(); c.cash += inc - sal; c.fin = {inc, sal};
  t.players.forEach(p => { p.stress = clamp(p.stress - (14 + 5 * c.staff.ps), 0, 100); p.form = Math.round(p.form * 5) / 10; p.sat = clamp(Math.round(p.sat - (p.sat - 65) * .2), 0, 100); });
  trainWeek();                                              // a evolução da semana (plano de treino de cada jogador)
}
const TR_STATS = {aim:'Aim', gs:'Gamesense', ...ATTR_LONG};
const TR_KEYS = Object.keys(TR_STATS);
const TR_ICO = {aim:'🎯', gs:'🧠', clu:'🔥', led:'🎖️', tw:'🤝', roam:'🏃', open:'⚡', util:'💨', men:'🧘', info:'📡', cons:'📈', adp:'🔄'};
/* VOD do rival: revela no veto os mapas fortes e os operadores-assinatura (uma vez por semana) */
function doScout(){
  const c = S.club, t = T(S.userId); if(c.scout) return false;
  c.scout = true; t.players.forEach(p => { p.stress = clamp(p.stress + Math.round(5 * psy()), 0, 100); addXp(p, 'gs', .02); addXp(p, 'tw', .01); });
  save(); return true;
}

/* ---------- Staff ---------- */
function staffCost(k){ const lv = S.club.staff[k]; return lv >= 3 ? null : STAFF[k].cost[lv]; }
function hireStaff(k){ const c = staffCost(k); if(c == null || S.club.cash < c) return false; S.club.cash -= c; S.club.staff[k]++; save(); return true; }

/* =====================================================================
   3b. MERCADO DE TRANSFERÊNCIAS · TEMPORADAS INFINITAS
   Janelas: pré-temporada (antes da 1ª rodada) e meio da temporada. Usuário e CPU negociam
   jogadores com taxa em K$; a CPU tem orçamento próprio (t.bud). Ao fim de cada temporada
   os atletas envelhecem/evoluem, veteranos se aposentam, nascem promessas e o calendário reinicia.
   ===================================================================== */
const squad = t => t.players.concat(t.bench);
const windowOpen = () => !!S && !!S.win && !S.cur && !S.done;          // janelas: pré-temporada e antes do Stage 1
const winLabel = () => S.win === 'pre' ? 'pré-temporada' : 'meio da temporada';
const rnd5 = v => Math.round(v / 5) * 5;
/* valor de mercado: cresce com o rating, cai com a idade e ganha prêmio de potencial nos jovens */
const pval = p => rnd5(Math.max(10, (20 + Math.pow(Math.max(0, p.ovr - 70), 1.5) * 2) * (p.age <= 20 ? 1.35 : p.age <= 23 ? 1.15 : p.age <= 27 ? 1 : p.age <= 30 ? .8 : .55) + (p.age <= 23 ? Math.max(0, p.pot - p.ovr) * 4 : 0)));
const faCost = p => Math.max(5, rnd5(pval(p) * (p.t2 ? 1.1 : .6)));       // sem contrato: 60% · tier 2 sob contrato: valor +10%
const takeFA = p => { S.fa.splice(S.fa.indexOf(p), 1); delete p.org; delete p.t2; };
const buyCost = (t, p) => rnd5(pval(p) * (t.players.includes(p) ? 1.3 : 1.1) * (t.star === p.name ? 1.4 : 1));
const winId = () => S.year + ':' + S.ei;               // identifica a janela atual; quem chega nela não pode ser revendido nela
const flipMsg = 'Contratado nesta janela — só pode ser revendido na próxima.';
const scoreP = p => p.ovr + (p.age <= 21 ? (p.pot - p.ovr) * .25 : 0);      // como a CPU enxerga um jogador
const weakest = t => t.players.reduce((b, p) => scoreP(p) < scoreP(b) ? p : b);
const takenNow = () => { const s = namesOf(S.teams); S.fa.forEach(p => s.add(p.name.toLowerCase())); return s; };
function refreshPower(t){ t.power = Math.round(t.players.reduce((s, p) => s + p.ovr, 0) / t.players.length); }
function addNews(txt, ovr = 0){ S.news.unshift({y:S.year, t:txt, o:ovr}); if(S.news.length > 80) S.news.length = 80; }

/* reposição imediata de um titular que saiu: melhor free agent que o time paga → senão promessa da base */
function backfill(t, ref){
  let p = null;
  if(t.id !== S.userId){
    p = S.fa.filter(x => faCost(x) <= t.bud && x.ovr >= ref.ovr - 12).sort((a, b) => b.ovr - a.ovr)[0];
    if(p){ const c = faCost(p); takeFA(p); t.bud -= c; }
  }
  return p || mkPlayer({name:genName(takenNow()), ovr:clamp(ref.ovr - rint(6, 12), 55, 85), age:rint(17, 20), pot:clamp(ref.ovr + rint(0, 8), 60, 95)});
}
/* remove p do elenco; se era titular, o melhor reserva (ou a reposição) assume a mesma função */
function takeOut(t, p){
  if(t.star === p.name) t.star = null;
  const bi = t.bench.indexOf(p); if(bi >= 0){ t.bench.splice(bi, 1); return null; }
  const si = t.players.indexOf(p); if(si < 0) return null;
  let r;
  if(t.bench.length){ r = t.bench.reduce((b, x) => x.ovr > b.ovr ? x : b); t.bench.splice(t.bench.indexOf(r), 1); } else r = backfill(t, p);
  r.role = p.role; t.players[si] = r;
  refreshPower(t); return r;
}
function keepBench(t, p){
  if(t.bench.length < CPU_BENCH) t.bench.push(p);
  else { const w = t.bench.reduce((b, x) => x.ovr < b.ovr ? x : b); if(p.ovr > w.ovr){ t.bench[t.bench.indexOf(w)] = p; S.fa.push(w); } else S.fa.push(p); }
}
/* p chega a um time da CPU: entra no lugar do titular mais fraco se for upgrade; senão vai ao banco */
function cpuAdd(t, p){
  joined(p);
  const W = weakest(t);
  if(scoreP(p) > scoreP(W)){ p.role = W.role; t.players[t.players.indexOf(W)] = p; keepBench(t, W); refreshPower(t); }
  else keepBench(t, p);
}
const trimFA = () => {                          // o limite vale só para os gerados; jogadores reais do db.js (p.org) ficam até serem contratados
  const gen = S.fa.filter(p => !p.org);
  if(gen.length > FA_CAP){ const keep = new Set(gen.sort((a, b) => pval(b) - pval(a)).slice(0, FA_CAP)); S.fa = S.fa.filter(p => p.org || keep.has(p)); }
};

/* ---------- rivalidades, lealdade e segurança financeira ----------
   · Rival direto: pares definidos no db.js (rivals:[...]) + os 4 maiores poderes de uma mesma liga entre si.
   · Lealdade (0–100): cresce +4 por temporada no mesmo clube, cai com moral baixa e recomeça (~40–54) ao chegar num clube novo.
   · Segurança financeira (0–100): folga de caixa do clube (orçamento da CPU ou caixa do usuário).
   O jogador aceita mudar de clube se a ATRAÇÃO (taxa acima do valor de mercado + estabilidade do destino) vencer a RESISTÊNCIA
   (lealdade + segurança do clube atual + 45 se o destino é rival). Na prática: rival direto quase nunca; clube rico segura o elenco. */
const secure = t => t.id === S.userId ? clamp(Math.round(S.club.cash / 6), 0, 100) : clamp(Math.round(t.bud / 3.5), 0, 100);
const loyOf = (name, age, role) => clamp(Math.round(40 + (age - 20) * 1.8 + (hstr('L' + name) % 31) - 15 + (role === 'IGL' ? 8 : 0)), 20, 95);
const loyal = p => p.loy == null ? 55 : p.loy;
const joined = p => { p.loy = rint(40, 54); };
function rivalFn(){
  const top = {}; LEAGUES.forEach(l => top[l.id] = new Set(Object.values(S.teams).filter(t => t.league === l.id).sort((a, b) => b.power - a.power).slice(0, 4).map(t => t.id)));
  const pairs = new Set(); RIVAL_PAIRS.forEach(([a, b]) => { pairs.add(a + '|' + b); pairs.add(b + '|' + a); });
  return (a, b) => !!a && !!b && a.id !== b.id && (pairs.has(a.id + '|' + b.id) || (a.league === b.league && top[a.league].has(a.id) && top[a.league].has(b.id)));
}
function verdict(p, from, to, fee, isR){
  if(!from || !to) return {ok:true};
  const rival = isR(from, to), pay = fee / Math.max(10, pval(p));
  const resist = .6 * loyal(p) + .25 * secure(from) + (rival ? 45 : 0) - (p.sat < 40 ? 15 : 0), pull = 50 + (pay - 1) * 40 + (secure(to) - 50) * .15;
  return {ok:pull >= resist, rival, resist:Math.round(resist), pull:Math.round(pull),
    msg:rival ? `${p.name} não aceita ir para ${to.short}: é rival direto de ${from.short}` : `${p.name} é leal a ${from.short} (lealdade ${loyal(p)}, clube com segurança financeira ${secure(from)})`};
}

/* ---------- mercado da CPU: cada time tenta melhorar seu titular mais fraco dentro do orçamento ---------- */
function cpuMarket(kind){
  const teams = shuffle(Object.values(S.teams).filter(t => t.id !== S.userId)), sold = {}, isR = rivalFn(), said = new Set();
  let deals = 0, nBlock = 0;
  teams.forEach(t => {
    for(let n = 0; n < (kind === 'pre' ? 2 : 1); n++){
      if(rnd() > (kind === 'pre' ? .5 : .3)) continue;
      const W = weakest(t); let best = null, bs = 0;
      const consider = (p, src, price) => {
        if(price > t.bud * .6 || t.bud - price < 25) return;                       // reserva de segurança: nenhum clube gasta o caixa todo
        const up = scoreP(p) - scoreP(W); if(up < 2) return;
        if(src){ const v = verdict(p, src, t, price, isR);                            // o jogador precisa aceitar (lealdade, segurança, rivalidade)
          if(!v.ok){ if(v.rival && up >= 4 && nBlock < 3 && !said.has(p.id)){ said.add(p.id); nBlock++; addNews(`${p.name} recusa deixar ${src.short} para o rival ${t.short}`, p.ovr); } return; } }
        const s = up - price / 60 + rnd(); if(s > bs){ bs = s; best = {p, src, price}; }
      };
      S.fa.forEach(p => consider(p, null, faCost(p)));
      teams.forEach(o => {
        if(o === t) return;
        o.bench.forEach(p => consider(p, o, pval(p)));
        if(!sold[o.id]) o.players.forEach(p => consider(p, o, buyCost(o, p)));
      });
      if(!best) continue;
      const {p, src, price} = best;
      t.bud -= price;
      if(src){ src.bud += price; takeOut(src, p); sold[src.id] = 1; } else takeFA(p);
      cpuAdd(t, p); deals++;
      addNews(`${t.short} contrata ${p.name} (${p.ovr}) ${src ? 'de ' + src.short : 'como agente livre'} por ${price} K$`, p.ovr);
    }
  });
  trimFA(); return deals;
}
/* propostas de times da CPU por um jogador: só quem ganharia rating e tem orçamento */
function bidsFor(p, n = 4, prem = 0){
  const val = pval(p), out = [], skipped = [], u = T(S.userId), isR = rivalFn();
  Object.values(S.teams).forEach(t => {
    if(t.id === S.userId || scoreP(p) - scoreP(weakest(t)) < 2) return;
    const fee = rnd5(val * (.8 + prem + rnd() * .3)); if(fee > t.bud * .8 || t.bud - fee < 25) return;
    if(isR(u, t) && !verdict(p, u, t, fee, isR).ok){ skipped.push(t.short); return; }        // rival direto do seu clube: o jogador recusa
    out.push({tid:t.id, fee});
  });
  const r = out.sort((a, b) => b.fee - a.fee).slice(0, n); r.skipped = skipped; return r;
}
function genOffers(){
  const out = [];
  shuffle(squad(T(S.userId)).filter(p => p.ovr >= 70)).forEach(p => {
    if(out.length >= 3 || rnd() > .45) return;
    const b = bidsFor(p, 1, .15)[0]; if(b) out.push({pid:p.id, tid:b.tid, fee:b.fee});     // propostas espontâneas pagam prêmio
  });
  return out;
}
/* ---------- ações do usuário ---------- */
const mine = id => { const u = T(S.userId), p = squad(u).find(x => x.id === id); return p ? {u, p} : null; };
function txGuard(){ return windowOpen() ? null : 'A janela de transferências está fechada.'; }
function signFA(id){
  const u = T(S.userId), p = S.fa.find(x => x.id === id), g = txGuard(); if(g) return g; if(!p) return 'Jogador indisponível.';
  if(u.bench.length >= MAX_BENCH) return `Banco cheio (máx. ${MAX_BENCH} reservas). Venda ou dispense alguém antes.`;
  const c = faCost(p); if(S.club.cash < c) return 'Caixa insuficiente.';
  S.club.cash -= c; takeFA(p); joined(p); p.sat = 70; p.tx = winId(); p.plan = autoPlan(p); p.xp = {}; u.bench.push(p); u.chem = clamp(u.chem - 3, 0, 100);
  addNews(`${u.short} assina ${p.name} (${p.ovr}) como agente livre por ${c} K$`, p.ovr); save(); return null;
}
function buyPlayer(tid, id, boost = false){
  const u = T(S.userId), t = T(tid), g = txGuard(); if(g) return g;
  const p = t && t.id !== S.userId ? squad(t).find(x => x.id === id) : null; if(!p) return 'Jogador indisponível.';
  if(u.bench.length >= MAX_BENCH) return `Banco cheio (máx. ${MAX_BENCH} reservas). Venda ou dispense alguém antes.`;
  const c = boost ? rnd5(buyCost(t, p) * 1.5) : buyCost(t, p); if(S.club.cash < c) return 'Caixa insuficiente.';
  const v = verdict(p, t, u, c, rivalFn()); if(!v.ok) return v.msg + (boost ? ' — mesmo com a oferta reforçada (+50%).' : '.');
  S.club.cash -= c; t.bud += c; takeOut(t, p); joined(p); p.sat = 70; p.tx = winId(); p.plan = autoPlan(p); p.xp = {}; u.bench.push(p); u.chem = clamp(u.chem - 3, 0, 100);
  addNews(`${u.short} contrata ${p.name} (${p.ovr}) de ${t.short} por ${c} K$`, p.ovr); save(); return null;
}
function sellTo(id, tid, fee){
  const g = txGuard(); if(g) return g;
  const m = mine(id), t = T(tid); if(!m || !t) return 'Jogador indisponível.';
  const {u, p} = m, starter = u.players.includes(p);
  if(p.tx === winId()) return flipMsg;
  if(starter && !u.bench.length) return 'Você precisa de um reserva para cobrir a vaga antes de vender um titular.';
  if(t.bud < fee) return `${t.short} não tem mais orçamento para essa proposta.`;
  const isR = rivalFn(), vv = verdict(p, u, t, fee, isR); if(isR(u, t) && !vv.ok) return vv.msg + '.';
  const rep = takeOut(u, p);
  S.club.cash += fee; t.bud -= fee; u.chem = clamp(u.chem - 2, 0, 100);
  cpuAdd(t, p); refreshPower(u);
  addNews(`${u.short} vende ${p.name} (${p.ovr}) para ${t.short} por ${fee} K$`, p.ovr); save(); return rep ? {rep} : null;
}
function releasePlayer(id){
  const g = txGuard(); if(g) return g;
  const m = mine(id); if(!m || !m.u.bench.includes(m.p)) return 'Só é possível dispensar reservas.';
  m.u.bench.splice(m.u.bench.indexOf(m.p), 1); S.fa.push(m.p); trimFA(); save(); return null;
}
function swapLineup(benchId, starterId){
  const u = T(S.userId); if(S.cur || (CM && !CM.finished)) return 'Não é possível mexer na escalação durante a rodada.';
  const b = u.bench.find(p => p.id === benchId), s = u.players.find(p => p.id === starterId); if(!b || !s) return 'Jogador não encontrado.';
  [b.role, s.role] = [s.role, b.role]; u.players[u.players.indexOf(s)] = b; u.bench[u.bench.indexOf(b)] = s;
  refreshPower(u); save(); return null;
}
/* muda a função de um titular; quem já joga nela assume a dele. Os dois se adaptam por 2 rodadas (−3 de rating). */
function setRole(pid, role){
  if(S.cur || (CM && !CM.finished)) return 'Não é possível trocar funções durante a rodada.';
  const u = T(S.userId), p = u.players.find(x => x.id === pid); if(!p || !ROLES.includes(role)) return 'Jogador não encontrado.';
  if(p.role === role) return null;
  const o = u.players.find(x => x !== p && x.role === role);
  if(o){ o.role = p.role; o.adapt = 2; }
  p.role = role; p.adapt = 2; save(); return null;
}
function answerOffer(i, yes){
  const o = S.offers[i]; if(!o) return 'Proposta expirada.';
  if(!yes){ S.offers.splice(i, 1); save(); return null; }
  const r = sellTo(o.pid, o.tid, o.fee); if(typeof r !== 'string') S.offers.splice(i, 1); return r;
}

/* ---------- virada de temporada ---------- */
function progress(p){
  const a = p.age, n = rint(-1, 1);
  let d = a <= 20 ? rint(2, 5) : a <= 23 ? rint(0, 4) : a <= 27 ? rint(-1, 2) : a <= 30 ? rint(-2, 1) : rint(-4, -1);
  if(d > 0) d = Math.min(d, Math.max(0, p.pot - p.ovr));
  p.aim = clamp(p.aim + d + n, 45, 99); p.gs = clamp(p.gs + d - n, 45, 99); recalc(p);
  for(const k of Object.keys(ATTRS)){                        // liderança, mental e consistência amadurecem com a idade; o duelo de abertura (reflexo) cai cedo
    const exp = k === 'led' || k === 'men' || k === 'cons';
    p[k] = clamp(attr(p, k) + (exp ? (a >= 25 ? rint(0, 2) : rint(-1, 1)) : d + rint(-2, 2) - (k === 'open' && a >= 28 ? 1 : 0)), 45, 99);
  }
  p.pot = a >= 26 ? p.ovr : Math.max(p.pot, p.ovr);
}
const retires = p => p.age >= 33 && rnd() < Math.min(1, (p.age - 32) * .3);
const seasonBase = t => Math.round(Math.max(0, (t.power - 72) * 4.5) + rnd() * 22);
function nextSeason(){
  const u = T(S.userId), sl = S.season.log.find(x => x.ev === 'si');
  S.hist.push({year:S.year, inn:!!S.qual && S.qual.includes(u.id), si:sl ? sl.lab : null, rank:S.season.rank, pts:S.season.pts, champ:S.siChamp, cash:S.season.cash});
  const before = {}; squad(u).forEach(p => before[p.id] = p.ovr);
  const info = {year:S.year + 1, prize:S.season.cash, place:sl ? sl.lab : 'Não classificado', retired:[], legends:[], ups:[], young:[], deals:0, myRetired:[]};
  S.year++;
  Object.values(S.teams).forEach(t => {
    if(t.mapTr) Object.keys(t.mapTr).forEach(k => t.mapTr[k] = Math.round(t.mapTr[k] * 5) / 10);      // o treino de mapas perde metade do efeito na virada
    squad(t).forEach(p => { p.adapt = 0; p.loy = clamp(loyal(p) + (p.tx && String(p.tx).startsWith((S.year - 1) + ':') ? 0 : 4) - (p.sat < 45 ? 6 : 0), 15, 95); p.age++; if(t.id === S.userId) p.pot = Math.max(p.pot, p.ovr); else progress(p); p.stress = rint(15, 30); p.sat = Math.round(p.sat + (70 - p.sat) * .5); p.form = 0; p.k = p.d = p.r = p.fk = p.cl = 0; });
    refreshPower(t);
    t.bud = Math.min(budCap(t.power), t.bud + 10 + Math.max(0, t.power - 70) * 3.5 + Math.min(30, Math.round(t.si / 40)));      // quem é mais forte e pontuou mais na temporada arrecada mais
    const gone = squad(t).filter(retires).sort((a, b) => t.bench.includes(b) - t.bench.includes(a));
    gone.forEach(p => { takeOut(t, p); if(t.id === S.userId) info.myRetired.push(p); if(p.ovr >= 85) info.legends.push({p, t}); });
  });
  S.fa.forEach(p => { p.age++; progress(p); p.sat = 70; p.k = p.d = p.r = p.fk = p.cl = 0; });
  S.fa = S.fa.filter(p => !retires(p) && !(p.age >= 31 && p.ovr < 68));
  const taken = takenNow(); for(let i = 0, n = rint(22, 30); i < n; i++){ const y = genYoung(taken); S.fa.push(y); if(y.pot >= 90) info.young.push(y); }
  info.deals = cpuMarket('pre');
  info.news = S.news.slice(0, info.deals).filter(n => n.o >= 85);
  Object.values(S.teams).forEach(t => {
    refreshPower(t); const b = seasonBase(t);
    Object.assign(t, {w:0, l:0, rw:0, rl:0, form:[], note:'', conf:60, chem:t.id === S.userId ? Math.round(60 + (t.chem - 60) * .5) : 60, si:b, siBase:b, siPrev:b});
  });
  Object.assign(S, {cal:CAL_FULL.slice(), ei:0, uh:[], season:newSeason(), qual:null, src:{}, lcq:null, siChamp:null, win:'pre'});
  Object.assign(S.club, {week:1, scout:false, fin:null});
  startEvent();                                           // abre a temporada pelo Kickoff
  S.offers = genOffers();
  info.ups = squad(u).map(p => ({p, d:p.ovr - (before[p.id] == null ? p.ovr : before[p.id])}));
  addNews(`Começa a temporada ${S.year}: ${info.deals} transferências na janela da CPU`);
  save(); return info;
}

/* ---------- escolha de operadores por execução (vale para a série; por lado; sem escolha a comissão sorteia) ---------- */
function suggestOps(m, side){                     // sugestão: várias partidas aleatórias + subida de encosta; cada troca (de operador ou entre jogadores) só vale se melhorar composição + encaixe
  const u = m.t[m.userKey], banned = m.bans[other(m.userKey)][side], pool = OPS[side].filter(o => o !== banned), n = u.players.length;
  const score = ops => { const c = compOf(side, ops); return c.mods + (side === 'atk' ? c.first + c.plant * 8 : 0) + ops.reduce((s, o, i) => s + fitOf(u.players[i], o), 0); };
  let best = null;
  for(let start = 0; start < 12; start++){
    let ops = shuffle(pool.slice()).slice(0, n), cur = score(ops), improved = true;
    for(let it = 0; improved && it < 10; it++){
      improved = false;
      for(let i = 0; i < n; i++) for(const o of pool){ if(ops.includes(o)) continue; const t = ops.slice(); t[i] = o; const sc = score(t); if(sc > cur + 1e-9){ ops = t; cur = sc; improved = true; } }
      for(let i = 0; i < n; i++) for(let j = i + 1; j < n; j++){ const t = ops.slice(); [t[i], t[j]] = [t[j], t[i]]; const sc = score(t); if(sc > cur + 1e-9){ ops = t; cur = sc; improved = true; } }
    }
    if(!best || cur > best.sc) best = {sc:cur, ops};
  }
  return best.ops;
}

/* ---------- loop de tempo real ---------- */
function startRound(){
  const m = CM; if(!m || !m.ready || UI.phase !== 'prep' || m.done) return;
  UI.rs = roundInit(m, null, false); UI.clock = 0; UI.plantAt = null; UI.frozen = false; UI.skip = false; UI.phase = 'live';
  UI.ev = roundNext(UI.rs); drain(); updateMatch();
  clearInterval(UI.timer); UI.timer = setInterval(tick, 50);
}
function tick(){
  if(UI.frozen || UI.phase !== 'live') return;
  UI.clock += 12 * (UI.skip ? 200 : UI.speed) * .05;
  drain(); updateClock();
}
function showEvent(ev){
  if(ev.type === 'plant') UI.plantAt = ev.t;
  (ev.L || []).forEach(l => feedAdd(l, untimed(l.c) ? null : ev.t));
}
function drain(){
  const rs = UI.rs;
  while(UI.ev && UI.ev.t <= UI.clock && !UI.frozen){
    const ev = UI.ev; UI.ev = null;
    showEvent(ev);
    if(ev.type === 'end'){ endOfRound(); return; }
    UI.ev = roundNext(rs);
  }
}
function endOfRound(){
  clearInterval(UI.timer); const m = CM;
  UI.clock = ROUND_SEC; UI.skip = false; UI.plantAt = null;
  UI.phase = m.done ? 'done' : 'prep'; updateMatch();
  if(m.done) onMatchEnd();
  else if(UI.auto) setTimeout(() => { if(CM === m && UI.phase === 'prep' && UI.auto) startRound(); }, 900);
}
function simAll(){
  const m = CM; if(!m || m.done || !m.ready || UI.phase === 'live' || UI.phase === 'interv') return;
  UI.auto = false; m.commTo = true;                                  // a comissão conduz também os timeouts do seu time
  while(!m.done){ const {lines} = runRoundAuto(m, null); lines.forEach(l => feedAdd(l, untimed(l.c) ? null : l.t)); }
  UI.phase = 'done'; updateMatch(); onMatchEnd();
  simSeriesRest();
}
/* "Simular tudo" numa série: o que falta é jogado automaticamente, com a comissão decidindo os bans de operador */
function simSeriesRest(){
  while(CS && !CS.over && CM && CM.done){
    loadMap(CS.i + 1); const m = CM; m.commTo = true;
    for(const k of ['a', 'b']) setOpBans(m, k, ...aiOpBans(m, k));
    m.vp = null; m.ready = true;
    while(!m.done){ const {lines} = runRoundAuto(m, null); lines.forEach(l => feedAdd(l, untimed(l.c) ? null : l.t)); }
    UI.phase = 'done'; updateMatch(); onMatchEnd();
  }
}
function onMatchEnd(){
  const m = CM; if(m.mapDone) return;
  m.mapDone = true; UI.auto = false; clearInterval(UI.timer);
  CS.maps.push(m); CS.wins[m.winner]++;
  if(CS.wins.a >= CS.need || CS.wins.b >= CS.need || CS.maps.length >= CS.bo){        // série decidida
    CS.over = true; m.finished = true;
    const rep = finishUserMatch(CS.bo === 1 ? m : seriesResult(CS.maps, CS.bo), m.meta); m.report = rep;
    updateMatch(); renderTop(); renderSide();
    setTimeout(() => { if(CM === m) showReport(rep); }, 700);
  } else updateMatch();
}

    case 'newcareer': if(confirm('Iniciar uma nova carreira? O save atual será apagado.')){ wipeSave(); S = null; CM = null; UI.selTeam = null; UI.view = 'select'; render(); } break;
    case 'menu': openModal(`<div class="mhead"><h2><b>Menu</b></h2><div class="sp"></div><button class="btn sm" data-act="close">✕</button></div>
      <p class="mut" style="margin-bottom:12px">O progresso é salvo automaticamente no navegador (localStorage) a cada rodada, treino e transferência.</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn" data-act="newcareer">Nova carreira</button><button class="btn" data-act="close">Voltar ao jogo</button></div>`, true); break;
  }
});
document.addEventListener('keydown', e => {
  if(e.target.matches('input,textarea,select')) return;
  if(e.key === 'Escape') closeModal();
  if((e.key === 'g' || e.key === 'G') && S && UI.view !== 'select') openGlobal();
  if(UI.view === 'match' && CM && !$('#modal').classList.contains('open') && !UI.frozen){
    if((e.key === ' ' || e.key === 'Enter') && UI.phase === 'prep'){ e.preventDefault(); startRound(); }
    if((e.key === 't' || e.key === 'T') && UI.phase === 'prep') openTimeout();
    if((e.key === 'o' || e.key === 'O') && UI.phase === 'prep') openOps();
  }
});
document.addEventListener('change', e => {
  if(e.target.dataset && e.target.dataset.prep && CM && CM.prep){ const P = CM.prep, k = e.target.dataset.prep;
    if(k === 'cad'){ P.plan.cad = +e.target.value; if(P.side === 'atk' && !P.sent) P.scout = P.scout.slice(0, prepCap(CM, P)); }
    else if(k === 'route') P.plan.route = +e.target.value; else if(k === 'hunt') P.hunt = e.target.checked;
    updateMatch(); return; }
  if(e.target.dataset && e.target.dataset.ops !== undefined){ if(UI.opDraft){ UI.opDraft.sel[+e.target.dataset.ops] = e.target.value; renderOps(); } return; }
  if(S && e.target.dataset && e.target.dataset.mf !== undefined){ setMapFocus(+e.target.dataset.mf, e.target.value); rerender(); return; }
  if(S && e.target.dataset && e.target.dataset.tp){ const [id, sl] = e.target.dataset.tp.split(':'); setPlan(+id, +sl, e.target.value); rerender(); return; }
  if(S && e.target.dataset && e.target.dataset.rl){ const r = setRole(+e.target.dataset.rl, e.target.value); if(r) toast(esc(r), 'warn'); rerender(); return; }
  const k = e.target.dataset && e.target.dataset.mk; if(!k || k === 'q' || !S) return; UI.mk[k] = e.target.value; rerender(); });
document.addEventListener('input', e => { if(!S || !e.target.dataset || e.target.dataset.mk !== 'q') return; UI.mk.q = e.target.value; const l = $('#mk-list'); if(l) l.innerHTML = mkListHTML(); });
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

/* ---------- boot ---------- */
render();

</script>
</body>
</html>
