<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R6 Esports Manager</title>
<style>
:root{
  --bg:#0a0c10; --bg2:#0e1218; --card:#161b22; --card2:#1b222c; --line:#262e3a;
  --txt:#e8eef5; --mut:#8b96a5; --gold:#ffcc00; --cyan:#00d2ff;
  --red:#ff4d5e; --green:#35e08a; --orange:#ff9f1c;
  --font:"Bahnschrift","Rajdhani","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.35}
body{min-height:100vh;
  background:radial-gradient(1100px 480px at 85% -8%,rgba(0,210,255,.09),transparent 60%),
             radial-gradient(900px 480px at -8% 0,rgba(255,204,0,.07),transparent 60%),var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
b{font-weight:700}
.mut{color:var(--mut)} .gold{color:var(--gold)} .cyan{color:var(--cyan)} .red{color:var(--red)} .green{color:var(--green)} .orange{color:var(--orange)}
.right{text-align:right} .center{text-align:center}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:linear-gradient(180deg,#0d1117,rgba(10,12,16,.96));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.brand{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:17px;white-space:nowrap}
.brand b{color:var(--gold)} .brand span{color:var(--cyan)}
.brand small{display:block;font-size:9px;letter-spacing:.34em;color:var(--mut);font-weight:600}
.nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav button{padding:8px 14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--mut);border-bottom:2px solid transparent}
.nav button:hover{color:var(--txt)}
.nav button.on{color:var(--gold);border-bottom-color:var(--gold)}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.chip-g{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);background:var(--card);
  font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px}
.chip-g.ok{border-color:rgba(53,224,138,.5)} .chip-g.warn{border-color:var(--orange);color:var(--orange)}
.chip-g.crit{border-color:var(--red);color:var(--red);animation:pulse 1.2s infinite}
.chip-g:hover{background:var(--card2)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:16px;max-width:1560px;margin:0 auto}
.layout.solo{grid-template-columns:minmax(0,1fr)}
@media(max-width:1050px){.layout{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.top{flex-wrap:wrap;padding:8px 12px}.nav{order:3;flex-basis:100%}.nav button{padding:6px 8px;font-size:11px}.layout{padding:10px}.sb{grid-template-columns:1fr;text-align:center}.sb .side,.sb .side.r{justify-content:center;flex-direction:row}.sb .score{font-size:40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;position:relative}
.card>h3,.h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card>h3::before,.h3::before{content:"";width:3px;height:13px;background:var(--gold);display:inline-block}
.card.cy>h3::before{background:var(--cyan)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media(max-width:820px){.g2,.g3,.g21{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:13px;white-space:nowrap;
  background:var(--card2);border:1px solid var(--line);border-radius:4px;transition:.15s;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}
.btn.gold:hover:not(:disabled){background:#ffd93a;color:#000;box-shadow:0 0 22px rgba(255,204,0,.35)}
.btn.cyan{background:rgba(0,210,255,.12);color:var(--cyan);border-color:var(--cyan)}
.btn.cyan:hover:not(:disabled){background:rgba(0,210,255,.22)}
.btn.sm{padding:6px 12px;font-size:11px}
.btn.danger:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:6px 12px;border:1px solid var(--line);background:var(--bg2);font-size:12px;font-weight:700;letter-spacing:.08em;border-radius:3px;color:var(--mut)}
.tabs button:hover{color:var(--txt)}
.tabs button.on{border-color:var(--gold);color:var(--gold);background:rgba(255,204,0,.07)}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:3px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;border:1px solid currentColor}
.tag.fill{background:var(--gold);color:#111;border-color:var(--gold)}
kbd{border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;border-radius:3px;font-size:11px;color:var(--mut)}

/* ---------- logos / bars ---------- */
.logo{--c:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;
  border:2px solid var(--c);color:var(--c);font-weight:800;font-size:11px;letter-spacing:.02em;background:rgba(0,0,0,.35);box-shadow:0 0 12px -4px var(--c)}
.logo.lg{width:64px;height:64px;font-size:19px;border-width:3px}
.logo.md{width:46px;height:46px;font-size:14px}
.logo.xs{width:22px;height:22px;font-size:8px;border-width:1px}
.bar{height:6px;background:#0c1016;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#5ee7ff)}
.bar.g>i{background:linear-gradient(90deg,#c99a00,var(--gold))}
.bar.r>i{background:linear-gradient(90deg,#c22,var(--red))}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;background:#2a3340}
.dots i.W{background:var(--green)} .dots i.L{background:var(--red)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(38,46,58,.6);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.me td{background:rgba(0,210,255,.08)}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}
.tbl tr.q td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.tbl tr.me.q td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}
.tbl tr.bub td{background:rgba(255,159,28,.05)}
.tbl tr.cut td{padding:0;border:0}
.cutline{display:flex;align-items:center;gap:10px;padding:5px 8px;color:var(--gold);font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  background:repeating-linear-gradient(135deg,rgba(255,204,0,.14) 0 8px,rgba(255,204,0,.04) 8px 16px);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.tn{display:flex;align-items:center;gap:8px;font-weight:700}
.up{color:var(--green)} .dn{color:var(--red)}
.scroll{overflow:auto}

/* ---------- alerts ---------- */
.alert{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:6px;border:1px solid var(--line);background:var(--card);border-left-width:4px}
.alert .ic{font-size:26px;line-height:1}
.alert h4{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.alert p{color:var(--mut);font-size:13px}
.alert.crit{border-color:var(--red);background:linear-gradient(90deg,rgba(255,77,94,.16),var(--card));animation:pulse 1.3s infinite}
.alert.crit h4{color:var(--red)}
.alert.warn{border-color:var(--orange);background:linear-gradient(90deg,rgba(255,159,28,.13),var(--card))}
.alert.warn h4{color:var(--orange)}
.alert.ok{border-color:var(--green);background:linear-gradient(90deg,rgba(53,224,138,.1),var(--card))}
.alert.ok h4{color:var(--green)}
.alert.info{border-color:var(--cyan)}
.alert.info h4{color:var(--cyan)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,.0)}50%{box-shadow:0 0 22px 0 rgba(255,77,94,.35)}}
@keyframes slide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* ---------- selection screen ---------- */
.hero{padding:26px 22px;border:1px solid var(--line);border-radius:6px;
  background:linear-gradient(120deg,rgba(255,204,0,.08),transparent 40%),linear-gradient(300deg,rgba(0,210,255,.1),transparent 50%),var(--card);margin-bottom:16px}
.hero h1{font-size:34px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;line-height:1.05}
.hero h1 b{color:var(--gold)} .hero h1 span{color:var(--cyan)}
.hero p{color:var(--mut);max-width:760px;margin-top:8px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tc{text-align:left;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:8px;transition:.15s;position:relative}
.tc:hover{border-color:var(--cyan);transform:translateY(-1px)}
.tc.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,204,0,.09),var(--card));box-shadow:0 0 0 1px var(--gold)}
.tc .pw{margin-left:auto;text-align:right;font-weight:800;font-size:26px;color:var(--gold);line-height:1}
.tc .pw small{display:block;font-size:9px;color:var(--mut);letter-spacing:.2em}
.tc .nm{font-weight:800;font-size:15px}
.tc .ros{font-size:12px;color:var(--mut)}
.detail{position:sticky;top:72px}
.plr{display:grid;grid-template-columns:1fr 60px 34px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(38,46,58,.6);font-size:13px}

/* ---------- match ---------- */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:16px 18px;
  background:linear-gradient(180deg,#10161e,var(--card));border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:6px}
.sb .side{display:flex;align-items:center;gap:12px}
.sb .side.r{flex-direction:row-reverse;text-align:right}
.sb .nm{font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.sb .role{font-size:11px;letter-spacing:.2em;font-weight:800;padding:2px 8px;border-radius:3px;display:inline-block;margin-top:3px}
.role.atk{background:rgba(255,77,94,.15);color:var(--red);border:1px solid var(--red)}
.role.def{background:rgba(0,210,255,.13);color:var(--cyan);border:1px solid var(--cyan)}
.sb .mid{text-align:center}
.sb .score{font-size:50px;font-weight:800;line-height:1;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.sb .score i{color:var(--mut);font-style:normal;margin:0 6px;font-weight:400}
.sb .inf{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.strip{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:8px 0}
.strip .pip{width:30px;height:24px;border-radius:3px;background:#0f141b;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--mut)}
.strip .pip.w{background:rgba(0,210,255,.18);border-color:var(--cyan);color:var(--cyan)}
.strip .pip.l{background:rgba(255,77,94,.15);border-color:var(--red);color:var(--red)}
.strip .pip.next{border-color:var(--gold);color:var(--gold);animation:pulse 1.2s infinite}
.strip .sep{width:2px;height:24px;background:var(--gold);margin:0 4px}
.strip .ot{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.14em;margin:0 6px}
.mapbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
.mapbar .mp{color:var(--gold);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.st{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--bg2);width:100%;transition:.15s}
.st:hover{border-color:var(--cyan)}
.st.on{border-color:var(--gold);background:rgba(255,204,0,.08);box-shadow:0 0 0 1px var(--gold)}
.st .ic{font-size:22px;grid-row:span 2}
.st .n{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.st .d{font-size:11.5px;color:var(--mut)}
.st .cnt{font-size:10.5px;letter-spacing:.04em;margin-top:2px}
.feed{height:430px;overflow-y:auto;background:#0d1117;border:1px solid var(--line);border-radius:5px;padding:6px 0;scroll-behavior:smooth}
.ln{padding:4px 12px;border-left:2px solid transparent;font-size:13px;animation:slide .22s both}
.ln .loc{color:var(--mut);font-size:11.5px}
.ln .op{color:var(--mut);font-style:normal;font-size:11.5px}
.ln.hdr{margin-top:10px;background:#101720;border-left-color:var(--gold);color:var(--gold);font-weight:800;letter-spacing:.07em;text-transform:uppercase;font-size:11.5px;padding:6px 12px}
.ln.hdr .adv{margin-left:8px;font-weight:700}
.ln.kill.fk{border-left-color:var(--cyan);background:rgba(0,210,255,.05)}
.ln.plant{border-left-color:var(--orange);color:var(--orange)}
.ln.clutch{border-left-color:var(--gold);background:rgba(255,204,0,.07);font-weight:700}
.ln.res{font-weight:800;border-left-color:var(--gold);background:#141b24}
.ln.res.win{border-left-color:var(--cyan);color:var(--cyan)} .ln.res.loss{border-left-color:var(--red);color:var(--red)}
.ln.sys{color:var(--mut);font-size:12px;font-style:italic}
.ln.big{text-align:center;color:var(--gold);font-weight:800;letter-spacing:.16em;background:repeating-linear-gradient(135deg,rgba(255,204,0,.12) 0 8px,transparent 8px 16px);margin:8px 0;padding:7px}
.pl{font-weight:800}
.mini th,.mini td{padding:4px 6px !important;font-size:12px}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;background:rgba(4,6,9,.78);backdrop-filter:blur(4px);padding:4vh 14px;overflow:auto}
#modal.open{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;width:min(980px,100%);animation:pop .18s both;padding:18px 20px}
.mbox.sm{width:min(620px,100%)}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mhead h2{font-size:18px;letter-spacing:.14em;text-transform:uppercase}
.mhead h2 b{color:var(--gold)}
#toasts{position:fixed;right:14px;bottom:14px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:440px}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cyan);padding:12px 14px;border-radius:5px;animation:slide .25s both;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.crit{border-left-color:var(--red);animation:slide .25s both,pulse 1.2s 3} .toast.warn{border-left-color:var(--orange)} .toast.ok{border-left-color:var(--green)}

/* ---------- global sidebar ---------- */
.side .card{padding:12px 14px}
.gr{display:flex;flex-direction:column;max-height:calc(100vh - 150px);overflow:auto;margin:0 -4px;padding:0 4px}
.gi{padding:8px 0;border-bottom:1px solid rgba(38,46,58,.7);font-size:13px;animation:slide .3s both;animation-delay:calc(var(--i,0)*35ms)}
.gi .lg{font-size:10px;font-weight:800;letter-spacing:.1em;padding:1px 5px;border-radius:2px;margin-right:6px;border:1px solid currentColor}
.gi .w{font-weight:800;color:var(--txt)} .gi .l{color:var(--mut)}
.gi.me{background:rgba(0,210,255,.07);margin:0 -6px;padding:8px 6px;border-radius:3px}
.gh{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;padding:10px 0 4px}
.live{font-size:9px;letter-spacing:.16em;color:var(--red);font-weight:800;margin-left:auto;display:flex;gap:5px;align-items:center}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(38,46,58,.5);font-size:13px}
.kv span:first-child{color:var(--mut)}
.big{font-size:32px;font-weight:800;line-height:1}
.phase{display:flex;gap:6px;flex-wrap:wrap}
.ph{padding:6px 9px;border:1px solid var(--line);border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);background:var(--bg2)}
.ph.done.W{border-color:rgba(53,224,138,.5);color:var(--green)} .ph.done.L{border-color:rgba(255,77,94,.5);color:var(--red)} .ph.done{color:var(--txt)}
.ph.cur{border-color:var(--gold);color:var(--gold);background:rgba(255,204,0,.08)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.vs .t{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.vs .t .nm{font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.vs .x{font-size:22px;color:var(--mut);font-weight:800}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#2a3340;border-radius:4px} ::-webkit-scrollbar-track{background:transparent}

/* ---------- v2: tempo real, atletas ---------- */
.ts{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums;margin-right:6px}
.clk{font-size:32px;font-weight:800;letter-spacing:.08em;color:var(--gold);line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.clk.low{color:var(--red);animation:pulse 1s infinite} .clk.bomb{color:var(--orange)}
.cads{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cad{padding:10px 0;border:1px solid var(--line);background:var(--bg2);border-radius:5px;font-size:16px;transition:.15s}
.cad:hover:not(:disabled){border-color:var(--cyan)}
.cad.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,210,255,.1);box-shadow:0 0 0 1px var(--cyan)}
.rt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg2);text-align:left;font-size:13px;font-weight:700;width:100%;transition:.15s}
.rt small{font-weight:600;font-size:10.5px}
.rt:hover:not(:disabled){border-color:var(--cyan)}
.rt.on{border-color:var(--gold);background:rgba(255,204,0,.08);box-shadow:0 0 0 1px var(--gold)}
.cad:disabled,.rt:disabled{opacity:.6;cursor:default}
#iv{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(4,6,9,.72);backdrop-filter:blur(3px)}
#iv.open{display:flex}
.ivbox{width:min(520px,92vw);background:var(--card);border:1px solid var(--red);border-top:4px solid var(--red);border-radius:8px;padding:18px 20px;animation:pop .15s both;box-shadow:0 0 50px rgba(255,77,94,.3)}
.ivt{font-size:19px;font-weight:800;letter-spacing:.1em;color:var(--red);margin-bottom:4px}
.ivb{height:5px;background:#0c1016;border-radius:3px;overflow:hidden;margin-top:10px}
.ivb i{display:block;height:100%;width:100%;background:var(--red)}
.ivbox .st{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.ops-row{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(38,46,58,.5)}
.ops-row select{width:100%}
.pcard{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.mrow{display:grid;grid-template-columns:78px 1fr 30px;gap:8px;align-items:center;font-size:12px;margin-top:6px}
.mrow>span{color:var(--mut)} .mrow>b{text-align:right}
.bar.o>i{background:linear-gradient(90deg,#c97a00,var(--orange))}
.bar.gr>i{background:linear-gradient(90deg,#1fa365,var(--green))}
.st:disabled{opacity:.45;cursor:not-allowed}
.sb .clk{margin-top:6px}

/* =====================================================================

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function hstr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^h>>>16)>>>0}
function mulb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function wpick(items, wf, r = rnd){let tot=0;const ws=items.map(i=>{const w=Math.max(.01,wf(i));tot+=w;return w});let x=r()*tot;
  for(let i=0;i<items.length;i++){x-=ws[i];if(x<=0)return items[i]}return items[items.length-1]}


/* =====================================================================
   1. BANCO DE DADOS — BLAST R6 STAGE 2 · 2026
   Elencos conferidos em fontes públicas (SiegeGG / Liquipedia via busca) em set/2026.
   Formato: [id, nome, sigla, liga, PODER, 'titulares|reserva', opções]
   opções: tag, color, ewc, star, igl, coach, ex, src (1 = poder informado por você;
   sem src = estimativa do jogo). Edite livremente.
   ===================================================================== */
const LG = Object.fromEntries(LEAGUES.map(l => [l.id, l]));

const RIVAL_PAIRS = [];      // preenchido logo após TEAM_DB (pares de rivais diretos do db.js)
/* Elenco no db.js: 'Nick' · 'Nick*' (IGL) · 'Nick:Entry' (função: Entry, Flex, Sup1, Sup2 ou IGL) · 'Nick=95' (rating) · 'Nick:Sup1=95{aim:97;gs:93;clu:80;age:24;pot:90}' (tudo) */
const ROLE_KEY = {entry:'Entry', flex:'Flex', sup1:'Sup1', sup2:'Sup2', igl:'IGL', support:'Sup1', anchor:'Sup2', roamer:'Entry'};      // as 3 últimas chaves só existem para ler db.js antigos
const parseSlot = s => {
  const m = s.trim().match(/^(.+?)(\*)?(?::([A-Za-z0-9]+))?(?:=(\d+))?(?:\{([^}]*)\})?$/), attrs = {};
  (m[5] || '').split(';').forEach(kv => { const [k, v] = kv.split(':').map(x => x.trim()); if(k && v !== undefined && v !== '' && Number.isFinite(+v)) attrs[k] = +v; });
  return {name:m[1], role:m[2] ? 'IGL' : ROLE_KEY[(m[3] || '').toLowerCase()] || null, ovr:m[4] ? +m[4] : null, attrs};
};
const TEAM_DB = TEAM_ROWS.map(([id, name, short, league, power, ros, o]) => {
  const [main, bench] = ros.split('|'), slots = main.split(',').map(parseSlot);
  return Object.assign({id, name, short, league, power, slots, roster:slots.map(s => s.name), benchSlots:bench ? bench.split(',').map(parseSlot) : [], bench:bench ? bench.split(',').map(s => parseSlot(s).name) : []}, o);
});

/* Posições reais do R6: Entry, Flex, Sup1, Sup2 e IGL (o IGL é uma das cinco posições do time) */
const ROLES = ['Entry','Flex','Sup1','Sup2','IGL'], ROLES_GEN = ROLES.slice(0, 4);
const isIgl = p => p.role === 'IGL';
const HB = new Set(['Thermite','Hibana','Ace','Maverick']);          // hard breachers: abrem parede reforçada (os demais "Breach" só abrem parede comum)

/* Mapas (pool de 7) · atk = viés de lado · routes = rotas de entrada/foco · calls = callouts do feed */
const MAPS = [
  {id:'bank',      name:'Banco',            loc:'no Banco',            atk:0,   routes:['Cofre / Túnel','Recepção / Lobby','Escritórios (verticalidade)'],       calls:['Cofre','Recepção','Escritório do Gerente','Sala de Arquivos','Túnel','Lobby']},
  {id:'chalet',    name:'Chalé',            loc:'no Chalé',            atk:-.6, routes:['Adega / Biblioteca','Garagem / Terraço','Salão Principal'],             calls:['Sala de Jantar','Biblioteca','Adega','Garagem','Sala de Troféus','Terraço']},
  {id:'clubhouse', name:'Clubhouse',        loc:'no Clubhouse',        atk:.4,  routes:['Subsolo (Cash Room)','Cofre / CCTV','Bar / Palco'],                    calls:['Cash Room','Bar','Arsenal','Sala de Estar','Igreja','Quarto Principal']},
  {id:'consulate', name:'Consulado',        loc:'no Consulado',        atk:.2,  routes:['Arquivo / Garagem','Escritório do Cônsul','Saguão / Imprensa'],         calls:['Escritório do Cônsul','Arquivo','Saguão','Sala de Imprensa','Garagem','Área de Vistos']},
  {id:'kafe',      name:'Kafe Dostoyevsky', loc:'no Kafe Dostoyevsky', atk:-.3, routes:['Cozinha / Bar','Mezanino','Sala de Leitura'],                          calls:['Cozinha','Bar do Kafe','Sala de Leitura','Mezanino','Lounge','Depósito']},
  {id:'skyscraper',name:'Arranha-Céu',      loc:'no Arranha-Céu',      atk:.5,  routes:['Casa de Chá','Karaokê / Exposição','Cozinha / Bar'],                   calls:['Casa de Chá','Karaokê','Exposição','Cozinha','Bar','Sala Zen']},
  {id:'nighthaven',name:'Nighthaven Labs',  loc:'em Nighthaven Labs',  atk:-.4, routes:['Laboratório','Sala de Servidores','Doca de Carga'],                    calls:['Laboratório','Sala de Servidores','Doca de Carga','Câmara de Testes','Corredor Sul','Depósito']}
];
/* Operadores e funções conforme a Liquipedia (categoria "Operator": campos function e function2 do infobox; conferido em 09/2026, sem os Recruits).
   Ataque: Breach · Front Line · Intel · Support · Map Control · Anti-Gadget  —  Defesa: Anti-Entry · Anti-Gadget · Crowd Control · Intel · Support · Trapper. */
const OP_DB = {
  atk:[['Ash','Breach','Front Line'], ['Zofia','Anti-Gadget','Breach'], ['Sledge','Breach','Anti-Gadget'], ['Thatcher','Anti-Gadget','Support'], ['Thermite','Breach','Support'],
    ['Twitch','Anti-Gadget','Intel'], ['Montagne','Intel','Support'], ['Glaz','Intel','Support'], ['Fuze','Anti-Gadget'], ['Blitz','Front Line','Map Control'],
    ['IQ','Intel','Support'], ['Buck','Breach','Support'], ['Blackbeard','Breach','Front Line'], ['Capitão','Front Line','Map Control'], ['Hibana','Breach','Front Line'],
    ['Jackal','Intel','Map Control'], ['Ying','Front Line','Map Control'], ['Dokkaebi','Intel','Map Control'], ['Lion','Intel','Map Control'], ['Finka','Front Line','Support'],
    ['Maverick','Breach','Front Line'], ['Nomad','Front Line','Map Control'], ['Gridlock','Support','Map Control'], ['Nøkk','Front Line','Map Control'], ['Amaru','Front Line','Map Control'],
    ['Kali','Anti-Gadget','Support'], ['Iana','Front Line','Intel'], ['Ace','Breach','Anti-Gadget'], ['Zero','Anti-Gadget','Intel'], ['Flores','Anti-Gadget','Intel'],
    ['Osa','Intel','Support'], ['Sens','Support','Map Control'], ['Grim','Front Line','Map Control'], ['Brava','Intel','Anti-Gadget'], ['Ram','Breach','Anti-Gadget'],
    ['Deimos','Intel','Map Control'], ['Striker','Support'], ['Rauora','Support','Map Control'], ['Solid Snake','Intel','Front Line']],
  def:[['Mute','Anti-Gadget','Crowd Control'], ['Smoke','Anti-Entry','Trapper'], ['Castle','Anti-Entry','Support'], ['Pulse','Intel','Support'], ['Doc','Support'], ['Rook','Support'],
    ['Kapkan','Anti-Entry','Trapper'], ['Tachanka','Anti-Entry','Crowd Control'], ['Jäger','Anti-Gadget','Support'], ['Bandit','Anti-Entry','Anti-Gadget'], ['Frost','Anti-Entry','Trapper'],
    ['Valkyrie','Intel','Support'], ['Caveira','Intel','Crowd Control'], ['Echo','Intel','Crowd Control'], ['Mira','Intel','Support'], ['Lesion','Anti-Entry','Trapper'],
    ['Ela','Trapper','Crowd Control'], ['Vigil','Anti-Gadget','Crowd Control'], ['Alibi','Intel','Trapper'], ['Maestro','Anti-Gadget','Intel'], ['Clash','Intel','Crowd Control'],
    ['Kaid','Anti-Entry','Anti-Gadget'], ['Mozzie','Anti-Gadget','Intel'], ['Warden','Anti-Gadget','Intel'], ['Goyo','Anti-Entry','Trapper'], ['Wamai','Anti-Gadget','Trapper'],
    ['Oryx','Support'], ['Melusi','Crowd Control','Intel'], ['Aruni','Anti-Entry','Anti-Gadget'], ['Thunderbird','Support'], ['Thorn','Anti-Entry','Trapper'],
    ['Azami','Anti-Entry','Support'], ['Solis','Intel','Support'], ['Fenrir','Trapper','Crowd Control'], ['Tubarao','Anti-Entry','Anti-Gadget'], ['Sentry','Support'],
    ['Skopós','Intel','Support'], ['Denari','Anti-Entry','Crowd Control']]
};
const OPS = {atk:OP_DB.atk.map(o => o[0]), def:OP_DB.def.map(o => o[0])};
const OP_F = {};                                                 // operador → suas funções (1 ou 2)
[...OP_DB.atk, ...OP_DB.def].forEach(([n, ...f]) => OP_F[n] = f);
const OP_TAG = {'Breach':'Breach', 'Front Line':'Linha de frente', 'Intel':'Intel', 'Support':'Suporte', 'Map Control':'Controle de mapa', 'Anti-Gadget':'Anti-gadget',
  'Anti-Entry':'Anti-entrada', 'Crowd Control':'Controle de multidão', 'Trapper':'Armadilhas'};
const opTags = o => OP_F[o].map(t => OP_TAG[t]).join(' / ');
/* cada função pesa num atributo do jogador: quanto ele passa do próprio rating naquele atributo é o encaixe (Linha de frente também usa o Aim) */
const TAG_FIT = {'Breach':'util', 'Front Line':'open', 'Intel':'info', 'Support':'tw', 'Map Control':'roam', 'Anti-Gadget':'gs', 'Anti-Entry':'cons', 'Crowd Control':'roam', 'Trapper':'util'};
const fitOf = (p, op) => { const f = OP_F[op]; return clamp(f.reduce((s, t) => s + (attr(p, TAG_FIT[t]) - p.ovr) + (t === 'Front Line' ? p.aim - p.ovr : 0), 0) / f.length * .15, -2, 2); };
/* composição dos cinco operadores (cada operador conta as suas duas funções) → {mods: bônus nos duelos do round, plant: chance de plant (só ataque),
   first: 1º duelo (só ataque), notes}. Centrada no sorteio da CPU (média ≈ 0). */
const COMP_MEAN = {atk:{mods:1.48, plant:-.017, first:.82}, def:{mods:3.07, plant:0, first:0}};      // médias medidas em 6000 rounds sorteados      // médias medidas em 6000 rounds sorteados
function compOf(side, ops){
  const c = {}; ops.forEach(o => OP_F[o].forEach(t => c[t] = (c[t] || 0) + 1));
  const g = t => c[t] || 0; let mods = 0, plant = 0, first = 0; const notes = [];
  const intel = Math.min(g('Intel'), 3), sup = Math.min(g('Support'), 2), ag = Math.min(g('Anti-Gadget'), 2);
  if(side === 'atk'){
    const hb = ops.filter(o => HB.has(o)).length, fl = g('Front Line');
    if(!hb){ plant -= .2; mods -= 1; notes.push('sem Hard Breacher: plant muito mais difícil'); } else if(hb > 2){ mods -= .8; notes.push('breachers demais'); }
    if(!g('Breach')){ mods -= .6; notes.push('sem Breach: ninguém abre o site'); }
    if(!fl){ first -= 1; notes.push('sem Linha de frente: abertura fraca'); } else first += Math.min(fl, 3) * .5;
    if(fl >= 5){ mods -= .8; notes.push('só entradas: falta suporte e info'); }
    if(!intel){ mods -= .8; notes.push('sem Intel: ataque às cegas'); } else mods += intel * .3;
    mods += sup * .35 + Math.min(g('Map Control'), 2) * .25 + ag * .3;
  } else {
    const ae = g('Anti-Entry'), cc = g('Crowd Control');
    if(!ae){ mods -= 1.6; notes.push('sem Anti-entrada: o site fica exposto'); } else mods += [0, .4, 1, 1.4, 1.2, 1][Math.min(ae, 5)];
    mods += [0, .6, .9, .6, .2, 0][Math.min(cc, 5)];
    if(cc >= 4){ notes.push('controle demais: faltam âncoras'); }
    mods += Math.min(g('Trapper'), 2) * .3 + [0, .5, .8, .9][intel] + sup * .3 + ag * .3;
  }
  const M = COMP_MEAN[side];
  return {mods:+(mods - M.mods).toFixed(2), plant:+(plant - M.plant).toFixed(3), first:+(first - M.first).toFixed(2), notes,
    txt:Object.entries(c).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${n}× ${OP_TAG[t]}`).join(' · ')};
}
/* Cadência: ataque 1 = lento/guardar drones … 5 = rush · defesa 1 = ancoragem … 5 = roam total */
const CAD = {
  atk:['1 · Lento — guardar drones','2 · Cadenciado','3 · Padrão','4 · Rápido','5 · Rush'],
  def:['1 · Ancoragem total','2 · Setup reforçado','3 · Equilibrado','4 · Roam moderado','5 · Roam total']
};
const STYLE = {agg:{name:'Agressivo', c:[.05,.12,.25,.3,.28]}, meth:{name:'Metódico', c:[.28,.3,.25,.12,.05]}, bal:{name:'Equilibrado', c:[.1,.25,.3,.25,.1]}};

/* ---------- parâmetros de balanceamento ---------- */

const DS = 18, ATK_BIAS = 0, ROUND_SEC = 180, PLANT_SEC = 45;
const SAVE_KEY = 'r6mgr.stage2.2026.v2';             // mesma chave: saves antigos (v2) são migrados para v3
const START_YEAR = 2026, MAX_BENCH = 3, CPU_BENCH = 2, FA_CAP = 70;
const STAFF = {
  an:{name:'Analista de Dados',   ico:'📊', cost:[90,180,320], txt:'Revela no veto a afinidade de mapas e os operadores-assinatura do rival.'},
  ps:{name:'Psicólogo',           ico:'🧠', cost:[80,160,280], txt:'Reduz o acúmulo de estresse e acelera a recuperação semanal.'},
  md:{name:'Diretor de Mídia',    ico:'🎥', cost:[70,150,260], txt:'Aumenta patrocínios e bônus de vitória.'},
  co:{name:'Treinador',           ico:'🎓', cost:[100,200,350], txt:'Acelera a evolução dos atletas e reduz o desgaste (estrelas do treinador). Ver aba Treino.'}
};

/* ---------- jogadores: identidade, idade e potencial ---------- */
let PID = 1;
const mkId = () => PID++;
/* margem de crescimento por idade, achatada conforme o rating sobe (quem já é craque tem pouco teto sobrando) */
const potFor = (ovr, age, r) => Math.min(99, ovr + Math.round((age <= 20 ? 6 + Math.floor(r() * 12) : age <= 23 ? 2 + Math.floor(r() * 7) : age <= 26 ? Math.floor(r() * 3) : 0) * clamp((96 - ovr) / 22, .15, 1)));
const seedMeta = (r, ovr) => { const age = 19 + Math.floor(r() * 13); return {age, pot:potFor(ovr, age, r)}; };
/* Atributos de especialidade (além de Aim e Gamesense). Ficam em torno do rating geral; o que pesa no jogo é o desvio em relação a ele.
   clu clutch (1vN e momentos decisivos) · led liderança (moral e coordenação) · tw trabalho em equipe (sinergia) · roam roaming (defesa agressiva)
   open duelo de abertura (1º duelo do round) · util utilidades (plant, defuse, Hard Breacher) · men mental (resistência a estresse e moral baixa)
   info informação/drones (leitura do rival) · cons consistência (menos variação de rendimento) · adp adaptabilidade (troca de função) */
const ATTRS = {clu:'Clutch', led:'Liderança', tw:'Equipe', roam:'Roaming', open:'Abertura', util:'Utilidade', men:'Mental', info:'Info', cons:'Consist.', adp:'Adaptação'};
const ATTR_LONG = {clu:'Clutch', led:'Liderança', tw:'Trabalho em equipe', roam:'Roaming', open:'Duelo de abertura', util:'Utilitários', men:'Mental', info:'Informação (drones)', cons:'Consistência', adp:'Adaptabilidade'};
const attr = (p, k) => p[k] == null ? p.ovr : p[k];                     // saves antigos sem o atributo valem o próprio rating
const topAttrs = (p, n = 2) => Object.keys(ATTRS).map(k => ({k, d:attr(p, k) - p.ovr})).sort((a, b) => b.d - a.d).slice(0, n);
function mkAttrs(ovr, role, r, igl, age = 25){
  const n = () => Math.round((r() - .5) * 14), exp = clamp(Math.round((age - 24) * .6), -2, 4);       // experiência: mental e consistência crescem com a idade

   2) quem não tem dado vai para a posição que sobrou e melhor encaixa no perfil (Aim alto → Entry, Gamesense alto → Sup).

function assignRoles(players, fixed, hints = []){
  const out = fixed.slice(), used = {};
  fixed.forEach(r => { if(r) used[r] = 1; });
  players.forEach((p, i) => {
    const hn = hints[i] && hints[i].primary; if(out[i] || !hn) return;
    out[i] = hn === 'entry' ? 'Entry' : hn === 'flex' ? 'Flex' : !used.Sup1 ? 'Sup1' : 'Sup2'; used[out[i]] = 1;
  });
  const free = players.map((p, i) => i).filter(i => !out[i]), base = ['Entry', 'Flex', 'Sup1', 'Sup2'].filter(t => !used[t]);
  if(!free.length) return out;
  const score = (i, t) => { const ag = (players[i].aim - players[i].gs) / 4; return t === 'Entry' ? ag : t === 'Flex' ? 0 : -ag; };
  let lists = [base];
  if(free.length > base.length){ lists = [base]; for(let k = base.length; k < free.length; k++) lists = lists.flatMap(l => ['Entry', 'Flex', 'Sup2'].map(e => l.concat(e))); }
  let best = null;
  for(const list of lists){
    const walk = (k, usedIdx, acc, sc) => {
      if(k === free.length){ if(!best || sc > best.sc) best = {sc, acc:acc.slice()}; return; }
      for(let j = 0; j < list.length; j++) if(!usedIdx[j]){ usedIdx[j] = 1; acc.push(list[j]); walk(k + 1, usedIdx, acc, sc + score(free[k], list[j])); acc.pop(); usedIdx[j] = 0; }
    };

}

/* aplica a escolha do usuário sobre o sorteio: operadores válidos (não banidos, do lado certo, sem repetir) vão para o jogador de mesmo índice; os demais ficam com o sorteio, sem duplicar */
function applyLoadout(units, side, sel, banned){
  const ok = o => o && o !== banned && OPS[side].includes(o), used = new Set();
  units.forEach(u => { if(ok(sel[u.i]) && !used.has(sel[u.i])){ u.op = sel[u.i]; used.add(u.op); u.fixed = true; } });
  units.forEach(u => { if(!u.fixed && used.has(u.op)){ const free = OPS[side].filter(o => o !== banned && !used.has(o) && !units.some(x => x.op === o)); if(free.length) u.op = pick(free); } });
}
function roundInit(m, userPlan, interactive){
  const ak = atkKey(m), dk = other(ak), AT = m.t[ak], DT = m.t[dk], V = !m.quiet, pre = [];
  const fix = p => ({cad:clamp(Math.round(p.cad), 1, 5), route:clamp(Math.round(p.route), 0, 2)});
  const P = m.userKey && m.prep && m.prep.id === m.hist.length ? m.prep : null;      // fase de preparação do usuário neste round (se houver)
  const pD = fix(dk === m.userKey ? (userPlan || (P ? P.plan : aiPlan(m, dk, 'def'))) : (P && P.aiPlan ? P.aiPlan : aiPlan(m, dk, 'def')));
  const manualAtk = !!(P && ak === m.userKey && !m.commTo && !userPlan), pA0 = fix(ak === m.userKey ? (userPlan || (P ? P.plan : aiPlan(m, ak, 'atk'))) : aiPlan(m, ak, 'atk'));
  for(const k of ['a','b']) if((k !== m.userKey || m.commTo) && m.tos[k] > 0 && (m.streak[other(k)] >= 3 || m.conf[k] < 35) && rnd() < .6){      // o usuário só é "auto" quando a comissão conduz (Assistir/Simular tudo)
    const po = k === m.userKey ? (m.streak[other(k)] >= 3 && m.conf[k] >= 40 ? 'adjust' : 'motiv') : pick(['ear','motiv','adjust']), r = doTimeout(m, k, po);
    if(V) pre.push({c:'sys', h:`⏱ <b>TIMEOUT TÉCNICO</b> — <b style="color:${m.t[k].color}">${esc(m.t[k].name)}</b> ${TO_DESC[po](r)}.`});
  }
  const tacv = k => m.tac[k].n > 0 ? m.tac[k].v : 0, tA = teamMods(AT), tD = teamMods(DT);
  const mk = (T, k) => T.players.map((p, i) => ({p, i, k, alive:true, kills:0, op:null, hb:false, eff:effP(p) + jitter(p)}));
  const A = mk(AT, ak), D = mk(DT, dk);
  const assign = (units, side, banned, sig) => {
    const pool = shuffle(OPS[side].filter(o => o !== banned && o !== sig)); units.forEach((u, i) => u.op = pool[i]);
    if(sig && sig !== banned && rnd() < .6) pick(units).op = sig;
  };
  assign(A, 'atk', m.bans[dk].atk, AT.sigA); assign(D, 'def', m.bans[ak].def, DT.sigD);
  const uSide = ak === m.userKey ? 'atk' : 'def', sel = m.userKey && m.loadout ? m.loadout[uSide] : null;      // operadores escolhidos pelo usuário para este lado (senão: sorteio da comissão)
  if(sel) applyLoadout(uSide === 'atk' ? A : D, uSide, sel, uSide === 'atk' ? m.bans[dk].atk : m.bans[ak].def);
  if(!(sel && uSide === 'atk') && !A.some(u => HB.has(u.op)) && rnd() < .85){ const c = [...HB].filter(o => o !== m.bans[dk].atk); if(c.length) pick(A).op = pick(c); }
  A.forEach(u => u.hb = HB.has(u.op));
  [A, D].forEach(us => us.forEach(u => { u.eff += fitOf(u.p, u.op); }));
  const cA = compOf('atk', A.map(u => u.op)), cD = compOf('def', D.map(u => u.op));
  /* preparação: o ataque descobre (ou não) onde está a bomb. Usuário: drones que ele mandou. Comissão/CPU: drones automáticos com as operadoras da rodada. */
  const hunt = !!(P && dk === m.userKey && P.hunt);
  let pA = pA0, know = 0, cands = [0, 1, 2], scouted = [], pr = null;
  if(manualAtk){ know = P.know; cands = P.cands; scouted = P.scout; pr = P.p; }
  else {
    const intelA = tagN(A.map(u => u.op), 'Intel'), counterD = tagN(D.map(u => u.op), 'Anti-Gadget');
    pr = reconP(tA, tD, pA0.cad, pD.cad, intelA, counterD, hunt); scouted = shuffle([0, 1, 2]).slice(0, reconCap(intelA, pA0.cad));
    const r = reconResult(pD.route, scouted, pr); know = r.know; cands = r.cands; pA = {...pA0, route:r.cands.length === 1 ? r.cands[0] : pick(r.cands)};      // sem certeza: chuta entre os candidatos
  }
  const hit = pA.route === pD.route, siteT = SITE_C + (hit ? 1 + [0, 1.2, 3.5][know] : -2);                    // acertar o site com informação vale muito; o site errado custa tempo
  const base = 2 * (pA.cad - 3) * (pD.cad - 3) + siteT + (tA.led - tD.led) / 30 + (tA.tw - tD.tw) * .12 + (tA.info - tD.info) * .08
    + raff(AT, m.map.id, pA.route) - raff(DT, m.map.id, pD.route)
    + (m.conf[ak] - m.conf[dk]) / 10 + (m.chem[ak] - m.chem[dk]) / 12 + tacv(ak) - tacv(dk)
    + aff(AT, m.map.id) - aff(DT, m.map.id) - m.pen[ak].atk + m.pen[dk].def + m.map.atk + ATK_BIAS;
  m.tac.a.n = Math.max(0, m.tac.a.n - 1); m.tac.b.n = Math.max(0, m.tac.b.n - 1);
  return {m, ak, dk, AT, DT, pA, pD, base, A, D, t:0, planted:false, plantT:0, duels:0, kills:0, over:false, winner:null, type:null, started:false,
    firstT:clamp(Math.round(105 - pA.cad * 17 + rint(-8, 8)) + (hit ? 0 : 10), 12, 150), firstB:(3 - pA.cad) * .6 + cA.first, queue:[], pre, comp:{atk:cA, def:cD, user:uSide},
    prep:{bomb:pD.route, hit, know, cands, scouted, p:pr, hunt, siteT, manual:manualAtk, byUser:!!P && !m.commTo},
    mods:{[ak]:cA.mods, [dk]:cD.mods - (hunt ? .4 : 0)}, plantAdj:cA.plant - (hit ? 0 : .08), defuseAdj:0, flags:{A:false,B:false}, cand:{a:null,b:null}, interactive:!!interactive, rec:null, tm:{[ak]:tA, [dk]:tD}};
}
const alive = arr => arr.filter(u => u.alive);
const pnU = (m, u) => `<b class="pl" style="color:${m.t[u.k].color}">${esc(u.p.name)}</b>`;
const opU = u => `<i class="op">(${esc(u.op)})</i>`;
const VERBS = ['elimina','derruba','abate','finaliza','pega','troca'];

function roundNext(rs){
  const m = rs.m, V = !m.quiet;
  if(rs.queue.length) return rs.queue.shift();
  if(rs.over) return null;
  if(!rs.started){
    rs.started = true;
    const rl = m.inOT ? `OT ${m.otPlayed + 1}` : `Round ${m.played + 1}`, mine = rs.ak === m.userKey ? rs.pA : rs.pD, sd = rs.ak === m.userKey ? 'atk' : 'def';
    const L = rs.pre.slice();
    if(V){
      L.push({c:'hdr', h:`${rl} · <span style="color:${rs.AT.color}">${esc(rs.AT.short)}</span> ATACA × <span style="color:${rs.DT.color}">${esc(rs.DT.short)}</span> DEFENDE${m.userKey ? ` · ${rs.prep.byUser ? 'seu plano' : 'plano da comissão'}: ${sd === 'atk' ? 'ataca' : 'bomb em'} ${esc(m.map.routes[mine.route])} · ${sd === 'atk' ? 'cadência' : 'setup'} ${mine.cad}` : ''}`});
      if(m.userKey){ const pp = rs.prep, R = i => `<b>${esc(m.map.routes[i])}</b>`, us = sd === 'atk';
        const info = pp.know === 2 ? `bomb localizada em ${R(pp.cands[0])}` : pp.know === 1 ? `sem certeza: a bomb está em ${pp.cands.map(R).join(' ou ')}` : 'sem informação sobre a bomb';
        L.push({c:'sys', h:us ? `🛰 <b>Preparação</b>: ${pp.scouted.length ? `${pp.scouted.length} drone(s) — ${info}` : 'nenhum drone enviado — ataque às cegas'} → ${pp.hit ? '✔ você ataca o site da bomb' : `✖ você ataca o site errado (a bomb estava em ${R(pp.bomb)}): gira e perde tempo`}.`
          : `🛰 <b>Preparação</b>: sua bomb está em ${R(pp.bomb)}${pp.hunt ? ' · caçando drones' : ''}. O ataque ${pp.know === 2 ? `<b class="red">achou a bomb</b> e vai direto` : pp.know === 1 ? 'tem dúvida entre dois sites' : 'não achou a bomb'} → ${pp.hit ? 'ataca o site certo' : `<b class="green">errou o site</b> (atacou ${R(rs.pA.route)})`}.`}); }
      if(m.userKey){ const uc = rs.comp[rs.comp.user], fx = uc.mods + (rs.comp.user === 'atk' ? uc.first : 0);
        L.push({c:'sys', h:`🎭 <b>Composição ${rs.comp.user === 'atk' ? 'de ataque' : 'de defesa'}</b>: ${uc.txt} <b class="${fx > .05 ? 'green' : fx < -.05 ? 'red' : 'mut'}">(${fx > 0 ? '+' : ''}${fx.toFixed(1)})</b>${uc.notes.length ? ` <span class="orange">— ${uc.notes.join('; ')}</span>` : ''}`}); }
      L.push({c:'sys', h: rs.pA.cad <= 2 ? `🔍 Fase de drones: o ataque testa ${esc(m.map.routes[rs.pA.route])} sem gastar utilidade.` : rs.pA.cad >= 4 ? `⚡ O ataque sai rápido e pressiona ${esc(m.map.routes[rs.pA.route])}.` : `Ataque monta o controle de mapa de forma padrão.`});
    }
    return {t:0, type:'start', L};
  }
  const aa = alive(rs.A), dd = alive(rs.D);
  if(!dd.length) return endRound(rs, 'elim', rs.ak);
  if(!aa.length) return endRound(rs, rs.planted ? 'defuse' : 'elim', rs.dk);
  if(!rs.planted){
    const dt = rs.duels === 0 ? rs.firstT : rint(6, 20);
    if(rs.t + dt >= ROUND_SEC){ rs.t = ROUND_SEC; return endRound(rs, 'clock', rs.dk); }
    rs.t += dt;
  } else {
    const dt = rint(6, 14), endT = rs.plantT + PLANT_SEC;
    if(rs.t + dt >= endT){
      rs.t = endT;
      const pd = clamp(.5 + .14 * (dd.length - aa.length) - (rs.base + rs.mods[rs.ak] - rs.mods[rs.dk]) * .01 + (rs.dk === m.userKey ? rs.defuseAdj : 0) + rs.tm[rs.dk].util * .006, .1, .9);
      return rnd() < pd ? endRound(rs, 'defuse', rs.dk) : endRound(rs, 'boom', rs.ak);

  return duelEvent(rs, aa, dd);
}

function duelEvent(rs, aa, dd){
  const m = rs.m, V = !m.quiet, first = rs.duels === 0, ak = rs.ak, dk = rs.dk;
  const rw = (u, side) => !first ? 1 : side === 'atk' ? (u.p.role === 'Entry' ? 1.7 : u.p.role === 'Flex' ? 1.2 : 1)
    : (rs.pD.cad >= 4 ? (u.p.role === 'Entry' ? 1.8 : u.p.role === 'Flex' ? 1.1 : .8) : (u.p.role === 'Sup1' || u.p.role === 'Sup2' ? 1.5 : 1));
  const au = wpick(aa, u => (u.eff - 40) * rw(u, 'atk')), du = wpick(dd, u => (u.eff - 40) * rw(u, 'def'));
  const bonus = rs.base + rs.mods[ak] - rs.mods[dk] + (first ? rs.firstB : 0);
  /* situações: clutch pesa quando o jogador é o último vivo contra 2+ (100%) ou sob pressão — pós-plant, match point (40%);
     roaming pesa na defesa com agressividade 4–5 */
  const sit = (u, mine, theirs, side) => {
    const dv = k => attr(u.p, k) - u.p.ovr, press = mine.length === 1 && theirs.length >= 2 ? 1 : (rs.planted || m.score.a >= 6 || m.score.b >= 6) ? .4 : 0;
    return (press ? clamp(dv('clu') * .3 * press, -3, 3) : 0) + (side === 'def' && rs.pD.cad >= 4 ? dv('roam') * (rs.pD.cad - 3) * .12 : 0)
      + (first ? dv('open') * .2 : 0) + (side === 'atk' && u.hb && !rs.planted ? dv('util') * .12 : 0);       // abertura no 1º duelo · Hard Breacher depende de utilidade
  };
  const diff = (au.eff + sit(au, aa, dd, 'atk')) - (du.eff + sit(du, dd, aa, 'def'));
  const aWins = rnd() < sig((diff + bonus) / DS);
  const kr = aWins ? au : du, vc = aWins ? du : au;
  kr.kills++; vc.alive = false; rs.duels++; rs.kills++;
  if(first) m.ps[kr.k][kr.i].fk++;
  const L = [];
  if(V) L.push({c:'kill' + (first ? ' fk' : ''), h:`${first ? '<span class="tag cyan">Abre o round</span> ' : ''}${pnU(m, kr)} ${opU(kr)} ${pick(VERBS)} ${pnU(m, vc)} ${opU(vc)} <span class="loc">— ${pick(m.map.calls)}</span>`});
  const na = alive(rs.A), nd = alive(rs.D);
  if(na.length === 1 && nd.length >= 2 && (!rs.cand[ak] || rs.cand[ak].vs < nd.length)) rs.cand[ak] = {u:na[0], vs:nd.length};
  if(nd.length === 1 && na.length >= 2 && (!rs.cand[dk] || rs.cand[dk].vs < na.length)) rs.cand[dk] = {u:nd[0], vs:na.length};
  const ev = {t:rs.t, type:'kill', L, killer:kr, victim:vc};
  // gatilhos de decisão de emergência (apenas com o usuário em quadra)
  const uk = m.userKey, fire = (kind, reason, u) => {
    rs.flags[kind] = true;
    if(rs.interactive) rs.queue.push({t:rs.t, type:'interv', kind, reason, unit:u});
    else if(uk){ const opt = autoInterv(rs, kind), txt = applyInterv(rs, kind, opt); if(V) rs.queue.push({t:rs.t, type:'log', L:[{c:'sys', h:txt}]}); }
  };
  if(uk && !rs.flags.A && vc.k === uk){
    const hbLoss = ak === uk && vc.hb && rs.kills <= 2 && !rs.planted && rnd() < .6;
    if(hbLoss) fire('A', 'hb', vc);                                   // perdeu o Hard Breacher cedo
    else if(rs.kills === 1 && rnd() < .35) fire('A', 'fb', vc);       // sofreu o First Blood (nem todo FB congela o round)
  }
  if(!rs.planted && na.length && nd.length){
    const pp = .30 + (rs.pA.cad - 1) * .07 + .07 * (rs.duels - 1) + rs.plantAdj + rs.tm[ak].util * .005;
    if(rnd() < pp){
      const planter = wpick(na, u => u.eff - 40); rs.planted = true; rs.plantT = Math.min(rs.t + rint(3, 9), 170); rs.t = rs.plantT;
      rs.queue.push({t:rs.plantT, type:'plant', L:V ? [{c:'plant', h:`💣 ${pnU(m, planter)} planta o defuser em <b>${pick(m.map.calls)}</b> — ${na.length}v${nd.length} · ${PLANT_SEC}s no relógio`}] : []});
      if(uk && dk === uk && !rs.flags.B && rnd() < .4) fire('B', 'plant', planter);
    }
  }
  return ev;
}

/* Decisões de emergência */
function autoInterv(rs, kind){ const gs = avgGS(rs); return kind === 'A' ? (gs >= 84 ? 'vertical' : 'retreat') : (gs >= 86 ? 'axes' : 'utility'); }
function avgGS(rs){ const T = rs.m.t[rs.m.userKey]; return T.players.reduce((s, p) => s + p.gs - (p.stress > 80 ? 8 : 0), 0) / T.players.length; }
function applyInterv(rs, kind, opt){
  const m = rs.m, uk = m.userKey, gs = avgGS(rs);
  if(kind === 'A'){
    if(opt === 'retreat'){
      rs.mods[uk] += 3; rs.plantAdj += uk === rs.ak ? -.15 : .2;
      return `↩ <b>Recuar para o retake tardio</b> — o time abre mão de espaço e reorganiza o trade (+3 nos duelos${uk === rs.ak ? ', plant mais lento' : ', mas o plant fica mais fácil para o rival'}).`;
    }
    if(opt === 'vertical'){
      const ok = rnd() < clamp(.45 + (gs - 80) / 70 + .03 * m.an, .25, .8);
      rs.mods[uk] += ok ? 7 : -4;
      return ok ? `🕳 <b>Verticalidade funciona!</b> A mudança de rota pega o rival desprevenido (+7).` : `🕳 <b>Verticalidade falha</b> — o rival cobre o buraco e pune a troca de rota (−4).`;
    }
    rs.mods[uk] -= 2; return `⏳ Sem decisão a tempo — o time hesita no momento crítico (−2).`;
  }
  if(opt === 'axes'){
    const ok = rnd() < clamp(.55 + (gs - 80) / 80, .3, .85);
    if(ok){ rs.mods[uk] += 6; rs.defuseAdj += .12; } else rs.mods[uk] -= 3;
    return ok ? `🔀 <b>Avanço simultâneo de eixos</b> sincronizado — o rival é pressionado por três lados (+6, defuse mais fácil).` : `🔀 <b>Avanço simultâneo</b> desalinhado — os eixos chegam em tempos diferentes (−3).`;
  }
  if(opt === 'utility'){ rs.mods[uk] += 3; rs.defuseAdj += .08; return `💨 <b>Utilitários gastos</b> — fumaça e flash abrem o caminho até o defuser (+3, defuse mais fácil).`; }
  rs.mods[uk] -= 2; return `⏳ Sem decisão a tempo — o retake sai sem coordenação (−2).`;
}

function endRound(rs, type, winner){
  const m = rs.m, V = !m.quiet, ak = rs.ak, dk = rs.dk, L = [];
  rs.over = true; rs.winner = winner; rs.type = type;
  if(V){
    if(type === 'defuse'){ const dfs = alive(rs.D), u = dfs.length ? pick(dfs) : null; L.push({c:'plant', h:u ? `🛡 ${pnU(m, u)} ${opU(u)} desarma o defuser com <b>${rint(1, 6)}s</b> restantes!` : `🛡 A defesa desarma o defuser no último instante!`}); }
    else if(type === 'boom') L.push({c:'plant', h:`💥 O defuser detona — o ataque garante o round.`});
    else if(type === 'clock') L.push({c:'sys', h:`⏱ Tempo esgotado sem plant — a defesa segura o round.`});
    const cw = rs.cand[winner]; if(cw && cw.u.alive) L.push({c:'clutch', h:`🎯 <b>CLUTCH 1v${cw.vs}</b> de ${pnU(m, cw.u)} ${opU(cw.u)}!`});
  }
  for(const u of rs.A.concat(rs.D)){
    const s = m.ps[u.k][u.i]; s.k += u.kills; if(!u.alive) s.d++; s.r++; if(u.kills >= 3) s.mk++;
    const cw = rs.cand[u.k]; if(cw && cw.u === u && u.alive && u.k === winner) s.cl++;
    if(V && u.kills >= 3) L.push({c:'clutch', h:`🔥 ${pnU(m, u)} faz <b>${u.kills === 5 ? 'ACE' : u.kills + 'K'}</b> no round!`});
  }
  m.hist.push({w:winner, ak, type, ot:m.inOT, cad:rs.pA.cad, route:rs.pA.route, dcad:rs.pD.cad, stack:rs.pD.route});
  m.last[ak] = {cad:rs.pA.cad, route:rs.pA.route, side:'atk'}; m.last[dk] = {cad:rs.pD.cad, route:rs.pD.route, side:'def'};
  m.streak[winner]++; m.streak[other(winner)] = 0;
  const lo = other(winner), drop = clamp(6 - teamMods(m.t[lo]).led / 4, 3, 8) * (m.calm[lo] > 0 ? .5 : 1);           // um bom líder (e o foco mental do timeout) seguram a confiança após perder o round
  m.conf[winner] = clamp(m.conf[winner] + 6, 15, 95); m.conf[lo] = clamp(m.conf[lo] - drop, 15, 95);
  m.calm.a = Math.max(0, m.calm.a - 1); m.calm.b = Math.max(0, m.calm.b - 1);
  if(m.inOT){ m.ot[winner]++; m.otPlayed++; m.score[winner]++; if(m.ot[winner] >= 2){ m.done = true; m.winner = winner; } }   // OT soma no placar: 8–6 ou 8–7
  else { m.score[winner]++; m.played++; if(m.score[winner] >= 7){ m.done = true; m.winner = winner; } else if(m.played >= 12){ m.inOT = true; m.wasOT = true; m.tos.a++; m.tos.b++; } }      // prorrogação: cada time ganha mais um timeout
  if(V){
    const rl = 'round';
    const why = {elim:winner === ak ? 'eliminando a defesa' : 'eliminando o ataque', defuse:'com o defuse', boom:'com a detonação', clock:'pelo relógio'}[type];
    const opp = rs.ak === m.userKey ? `a bomb do rival estava em <b>${esc(m.map.routes[rs.pD.route])}</b> (setup ${rs.pD.cad} · ${rs.prep.hit ? 'você acertou o site' : 'você atacou o site errado'})` : `o rival atacou <b>${esc(m.map.routes[rs.pA.route])}</b> (cadência ${rs.pA.cad}) e ${rs.prep.hit ? 'acertou' : 'errou'} o site da sua bomb`;
    L.push({c:'res ' + (m.userKey ? (winner === m.userKey ? 'win' : 'loss') : ''), h:`✔ <b>${esc(m.t[winner].short)}</b> vence o ${rl} ${why} · placar <b>${m.score.a}–${m.score.b}</b>${m.ot.a + m.ot.b ? ` <span class="mut">(OT ${m.ot.a}–${m.ot.b})</span>` : ''}`});
    if(m.userKey) L.push({c:'sys', h:`Leitura pós-round: ${opp}.`});
    if(!m.done && !m.inOT && m.played === 6) L.push({c:'big', h:`🔄 TROCA DE LADOS — ${esc(m.t[m.first].short)} vai para a defesa`});
    if(!m.done && m.inOT && m.otPlayed === 0) L.push({c:'big', h:`⚔ 6–6 · PRORROGAÇÃO — vence quem ganhar 2 rounds (o placar vai até 8), lados alternados`});
    if(m.done) L.push({c:'big', h:`🏁 FIM DE PARTIDA — ${esc(m.t[m.winner].name)} vence por ${Math.max(m.score.a, m.score.b)}–${Math.min(m.score.a, m.score.b)}${m.wasOT ? ' (OT)' : ''}`});
  }
  rs.rec = {winner, type, ak};
  return {t:rs.t, type:'end', L, winner, rec:rs.rec};
}

/* Partidas rápidas (IA × IA e simulação instantânea) */
function runRoundAuto(m, userPlan){ const rs = roundInit(m, userPlan, false), out = []; let ev; while((ev = roundNext(rs))){ if(ev.L) out.push(...ev.L.map(l => ({...l, t:ev.t}))); } return {rs, lines:out}; }
function quickMatch(A, B){ const m = newMatch(A, B, null, true); doVeto(m); while(!m.done) runRoundAuto(m); return m; }
function winProb(A, B, n = 240){ let w = 0; for(let i = 0; i < n; i++) if(quickMatch(A, B).winner === 'a') w++; return w / n; }

  const outs = [2, 1, 0].map(w => p.out.filter(t => p.rec[t].w === w).sort((a, b) => swSeed(p, a) - swSeed(p, b)));

/* ---------- pontos corridos ---------- */
function roundRobinIds(ids){                                      // método do círculo; número ímpar ganha uma vaga vazia (folga)

  for(let r = 0; r < n - 1; r++){
    const pairs = []; for(let i = 0; i < n / 2; i++){ const a = arr[i], b = arr[n - 1 - i]; if(a && b) pairs.push(r % 2 ? [b, a] : [a, b]); }

function rrNew(teams, bo, name){ return {k:'rr', name:name || 'Fase de grupos', teams:teams.slice(), sched:roundRobinIds(shuffle(teams.slice())), r:0, res:{}, bo}; }
const rrFix = p => p.r < p.sched.length ? p.sched[p.r].map(([a, b], i) => ({id:p.r + ':' + i, a, b, bo:p.bo, lab:`Rodada ${p.r + 1}`})) : [];

/* tabela: pts (Bo1 = 1 por vitória · Bo3 = 4/3/1/0) → saldo de mapas → saldo de rounds → rounds ganhos → semente */
function rrTable(p){

  Object.values(p.res).forEach(x => {
    const A = st[x.a], B = st[x.b], aw = x.w === x.a, ma = x.sa, mb = x.sb;
    A.n++; B.n++; (aw ? A : B).w++; (aw ? B : A).l++;

    A.md += ma - mb; B.md += mb - ma; A.rd += x.ra - x.rb; B.rd += x.rb - x.ra; A.rw += x.ra; B.rw += x.rb; A.rl += x.rb; B.rl += x.ra;
  });
  return Object.values(st).sort((x, y) => y.pts - x.pts || y.md - x.md || y.rd - x.rd || y.rw - x.rw || x.seed - y.seed);
}

/* ---------- transição entre fases e fechamento ---------- */

  return {tb, me, rank:me.rank, pts:me.pts, in:inn, cutPts:cut.pts, cutTeam:cut.t, nextTeam:nxt.t, nextPts:nxt.pts, margin:Math.max(0, inn ? me.pts - nxt.pts : cut.pts - me.pts)};
}

function computeAlerts(){

    else if(S.done) out.push(uc.order[0] === u.id ? {lv:'ok', ic:'🎟️', t:`Classificado ao Six Invitational ${siTag()} pelo LCQ!`, x:`${u.name} vence o ${uc.name} e garante a vaga.`} : {lv:'crit', ic:'💀', t:'Fora do Six Invitational', x:`${u.name} termina o ${uc.name} em ${placeLab(uc, u.id)}. A temporada acabou para a sua organização.`});

                  : {lv:'crit', ic:'💀', t:'Sem caminho ao Six Invitational', x:`${u.name} encerra em #${g.rank}, fora das vagas diretas e fora dos 8 do LCQ da região.`}); }
    return burn();
  }
  if(g.in && g.margin <= 25) out.push({lv:'crit', ic:'🚨', t:'ALERTA MÁXIMO — a linha de corte está no seu pescoço', x:`Só ${g.margin} pts separam você do ${g.nextTeam.short} (#${G14 + 1}). Um tropeço e a vaga direta escapa.`});

  else if(g.margin <= 300) out.push({lv:'warn', ic:'🔥', t:'A linha de corte está ao alcance', x:`Você precisa de +${g.margin} pts. Subir na tabela vale até ${PTS.stage[0]} pts no Stage e ${PTS.major[0]} no Major.`});

  else if(!uc) out.push({lv:'info', ic:'📺', t:`Sua organização não disputa ${EVENTS[S.ev].name}`, x:`Só ${S.comps.reduce((n, c) => n + c.teams.length, 0)} times entram, por vagas regionais e SI Points. Simule o evento ou acompanhe pelo Painel.`});
  else if(st === 'out') out.push({lv:'info', ic:'📡', t:`Eliminado de ${EVENTS[S.ev].name}`, x:'Sua campanha terminou. Simule o restante ou acompanhe pelo Painel.'});
  return burn();
}

/* ---------- dias de jogo ---------- */
/* histórico do jogador para a página de perfil: totais de carreira (p.c), últimas séries (p.mh) e resultado por evento (p.eh) */
const MH_MAX = 6, EH_MAX = 8, PL_SHORT = ['1º','2º','3º–4º','5º–8º','9º–16º'];
function logStats(p, t, opp, s, won, m, k){
  const c = p.c || (p.c = {sr:0, mp:0, k:p.k - s.k, d:p.d - s.d, r:p.r - s.r, fk:p.fk - s.fk, cl:p.cl - s.cl, mk:0}), nm = m.maps ? m.maps.length : 1;      // saves antigos: a carreira parte do que já estava somado
  c.sr++; c.mp += nm; c.k += s.k; c.d += s.d; c.r += s.r; c.fk += s.fk; c.cl += s.cl; c.mk += s.mk || 0;
  (p.mh || (p.mh = [])).unshift({y:S.year, ev:S.ev, o:opp.id, a:m.score[k], b:m.score[other(k)], w:won ? 1 : 0, k:s.k, d:s.d, fk:s.fk, cl:s.cl, r:s.r});
  if(p.mh.length > MH_MAX) p.mh.length = MH_MAX;
  let e = p.eh && p.eh[0];
  if(!e || e.y !== S.year || e.ev !== S.ev){ e = {y:S.year, ev:S.ev, t:t.id, sr:0, mp:0, k:0, d:0, fk:0, cl:0, r:0, lab:null}; (p.eh || (p.eh = [])).unshift(e); if(p.eh.length > EH_MAX) p.eh.length = EH_MAX; }
  e.t = t.id; e.sr++; e.mp += nm; e.k += s.k; e.d += s.d; e.fk += s.fk; e.cl += s.cl; e.r += s.r;
}
function tagPlaces(lab){                          // ao fechar o evento: grava a colocação de cada time no histórico dos seus jogadores
  Object.values(S.teams).forEach(t => { const l = lab(t); if(l) squad(t).forEach(p => { const e = p.eh && p.eh[0]; if(e && e.y === S.year && e.ev === S.ev) e.lab = l; }); });
}
const roundsOf = m => { if(!m.maps) return {a:m.score.a, b:m.score.b}; let a = 0, b = 0; m.maps.forEach(x => { a += x.score.a; b += x.score.b; }); return {a, b}; };
const metaOf = (f, user) => ({cid:f.cid, pi:f.pi, id:f.id, fa:f.fa != null ? f.fa : f.a, fb:f.fb != null ? f.fb : f.b, bo:f.bo, lab:f.lab, idx:S.md, user:!!user});      // fa/fb = lados originais da chave (o usuário é reordenado para 'a')
function commit(m, meta){
  const w = m.winner, l = other(w), W = m.t[w], Lz = m.t[l];                  // SI Points só pela colocação final de cada evento
  W.form.push('W'); Lz.form.push('L'); if(W.form.length > 5) W.form.shift(); if(Lz.form.length > 5) Lz.form.shift();
  for(const k of ['a','b']){
    const t = m.t[k];
    t.players.forEach((p, i) => {
      const s = m.ps[k][i]; p.k += s.k; p.d += s.d; p.r += s.r; p.fk += s.fk; p.cl += s.cl; if(p.adapt) p.adapt--;
      logStats(p, t, m.t[other(k)], s, k === w, m, k);
      p.form = clamp(Math.round((p.form * .6 + (s.k - s.d) / Math.max(1, s.r) * 4) * 10) / 10, -4, 4);
    });
    if(t.id !== S.userId) t.conf = clamp(Math.round(60 + (t.conf - 60) * .5 + (k === w ? 3 : -3)), 30, 85);
  }
  const c = compById(meta.cid), swp = m.t.a.id !== meta.fa, rr_ = roundsOf(m);         // a série pode ter sido jogada com os lados trocados em relação à chave
  partRep(c.stages[c.si].parts[meta.pi], meta.id, W.id, swp ? m.score.b : m.score.a, swp ? m.score.a : m.score.b, swp ? rr_.b : rr_.a, swp ? rr_.a : rr_.b);
  S.results.push({i:meta.idx, ph:meta.lab, cid:meta.cid, lg:c.lg || 'TN', a:m.t.a.id, b:m.t.b.id, sa:m.score.a, sb:m.score.b, w:W.id, ot:m.wasOT, map:m.map.loc, up:W.power <= Lz.power - 5, user:!!meta.user});
  if(S.results.length > 400) S.results.splice(0, S.results.length - 400);
}
/* Simula um dia de jogo inteiro sem o usuário (todas as competições do evento): usado para fechar o que resta depois que a campanha dele acaba */
function simDay(){
  const fx = []; let n = 0;
  S.comps.forEach(c => compFix(c).forEach(f => { fx.push({cid:f.cid, pi:f.pi}); commit(quickSeries(T(f.a), T(f.b), f.bo), metaOf(f)); n++; }));
  if(fx.length) S.mdl[S.md] = compFix(S.comps.find(c => !c.done) || S.comps[0])[0] ? compFix(S.comps.find(c => !c.done) || S.comps[0])[0].lab : 'Rodada ' + (S.md + 1);
  compsAdvance(fx); S.md++; return n;
}
/* fecha o evento: SI Points por colocação, prêmio do usuário e o que cada evento libera (classificação regional, vaga da EWC, campeões dos LCQs) */
function closeEvent(){
  const u = T(S.userId), e = EVENTS[S.ev], uc = userComp(); let lab = 'Não participou', cash = 0;
  S.comps.forEach(c => c.order.forEach((id, i) => { const p = pointsFor(S.ev, i); if(p) T(id).si += p; }));
  if(uc){ const pos = uc.order.indexOf(u.id); lab = placeLab(uc, u.id); cash = cashFor(S.ev, pos); }
  if(e.kind === 'league'){ S.src = S.src || {}; S.src[S.ev] = {}; S.comps.forEach(c => S.src[S.ev][c.id] = c.order); }
  if(S.ev === 'ewc'){ Object.values(S.teams).forEach(t => t.ewc = false); T(S.comps[0].order[0]).ewc = true; }        // campeão da EWC: vaga direta no Six Invitational
  if(S.ev === 'lcq') S.lcq = S.comps.map(c => c.order[0]).filter(Boolean);
  if(S.ev === 'si') S.siChamp = S.comps[0].order[0];
  tagPlaces(t => { const c = S.comps.find(x => x.teams.includes(t.id)); return c ? placeShort(c, t.id) : null; });
  S.club.cash += cash; S.season.cash += cash; S.season.log.push({ev:S.ev, lab, cash});
  if(S.ev === 'major2'){ const g = g16Status(); S.season.rank = g.rank; S.season.pts = g.pts; }
  S.evres = {ev:S.ev, lab, cash, si:u.si - (S.si0 || 0)};
}

/* ---------- avanço do calendário ---------- */
function startEvent(){
  const id = S.cal[S.ei];
  Object.assign(S, {ev:id, md:0, cur:null, report:null, snap:null, done:false, results:[], mdl:[], evres:null, si0:T(S.userId).si});
  S.comps = buildComps(id); S.lgName = evName(id);
  globalTable('proj').forEach(r => r.t.rkPrev = r.rank);
}
function advanceEvent(){
  S.offers = []; S.win = null;
  if(S.ei + 1 >= S.cal.length) return null;
  S.ei++; S.club.week++; startWeek(); startEvent();
  if(S.ev === 'stage1'){ const n = cpuMarket('mid'); S.win = 'mid'; S.offers = genOffers(); addNews(`Janela de meio de temporada: ${n} transferências entre times da CPU`); }
  save(); return S.ev;
}
function startMatchday(){
  const idx = S.md, t0 = performance.now(), pre = g16Status(), uc = userComp(), ufx = uc ? compFix(uc) : [];
  S.offers = []; S.win = null;                               // ao iniciar a rodada a janela fecha
  S.snap = {rank:pre.rank, si:T(S.userId).si, inn:pre.in, pts:pre.pts, cash:S.club.cash};
  pre.tb.forEach(r => { r.t.siPrev = r.t.si; r.t.rkPrev = r.rank; });
  let user = null, n = 0; const fx = [];
  S.comps.forEach(c => compFix(c).forEach(f => { fx.push({cid:f.cid, pi:f.pi});
    if(f.a === S.userId || f.b === S.userId){ user = {...f, a:S.userId, b:f.a === S.userId ? f.b : f.a, fa:f.a, fb:f.b}; return; }
    commit(quickSeries(T(f.a), T(f.b), f.bo), metaOf(f)); n++; }));
  const uf = ufx.find(f => f.a === S.userId || f.b === S.userId) || ufx[0]; S.mdl[idx] = uf ? uf.lab : 'Rodada ' + (idx + 1);
  S.cur = {idx, user, sim:n, ms:Math.max(.1, +(performance.now() - t0).toFixed(1)), fx};
  save(); return S.cur;
}
function finishMatchday(userRes){
  const idx = S.cur.idx, u = T(S.userId);
  compsAdvance(S.cur.fx);
  S.md = idx + 1;
  const uc = userComp();
  if(S.comps.every(c => c.done) || (uc && uc.done)){          // a campanha do usuário acabou: o resto do evento é simulado até o fim
    for(let i = 0; i < 100 && S.comps.some(c => !c.done); i++) simDay();
    S.done = true;
  }
  if(S.done) closeEvent();                                // antes do relatório: os pontos de colocação entram no ganho de SI
  const after = g16Status(), sn = S.snap, place = S.done ? S.evres.lab : null;
  S.report = {idx, label:mdLabel(idx), res:userRes || null, dSI:u.si - sn.si, rankBefore:sn.rank, rankAfter:after.rank, inn:after.in,
    dropped:sn.inn && !after.in, gained:!sn.inn && after.in, place, sim:S.cur.sim, ms:S.cur.ms, dCash:0};
  S.cur = null;
  if(!S.done){ S.club.week++; startWeek(); S.report.dCash = S.club.cash - sn.cash; }
  save(); return S.report;
}
const evProgress = () => { const c = userComp() || S.comps.find(x => !x.done) || S.comps[0], r = estRemain(c); return S.done ? 1 : S.md / Math.max(1, S.md + r); };
const mvpScore = s => s.k - s.d + s.fk * .5 + s.cl * 1.5;
function mvpOf(m){
  let best = null;
  for(const k of ['a','b']) m.t[k].players.forEach((p, i) => { const s = m.ps[k][i], sc = mvpScore(s) + (k === m.winner ? 1.5 : 0); if(!best || sc > best.sc) best = {name:p.name, team:m.t[k].id, k:s.k, d:s.d, sc}; });
  return best;
}
const rating = p => p.r ? clamp(1 + (p.k - p.d) / p.r * .8 + p.fk / p.r * .6, .3, 2.5) : 1;
function finishUserMatch(m, meta){
  commit(m, meta);
  const won = m.winner === 'a', t = T(S.userId), c = S.club, nm = m.maps ? m.maps.length : 1;       // série longa cansa mais: estresse por mapa jogado
  t.players.forEach(p => { p.stress = clamp(p.stress + Math.round((5 + (won ? 0 : 4)) * psy() * nm), 0, 100); p.sat = clamp(p.sat + (won ? 3 : -3), 0, 100); });
  t.conf = clamp(t.conf + (won ? 2 : -3), 15, 80); t.chem = clamp(t.chem + (won ? 1 : -1), 0, 90);
  if(won) c.cash += Math.round(12 * (1 + .3 * c.staff.md));
  S.uh.push({ev:S.ev, idx:meta.idx, lab:meta.lab, opp:m.t.b.id, won, sa:m.score.a, sb:m.score.b, ot:m.wasOT, map:m.map.name});
  return finishMatchday({won, sa:m.score.a, sb:m.score.b, opp:m.t.b.id, ot:m.wasOT, map:m.map.name, mvp:mvpOf(m), bo:m.bo || 1, maps:m.maps ? m.maps.map(x => ({n:x.map.name, sa:x.score.a, sb:x.score.b})) : null});
}

/* ---------- semana: patrocínio, recuperação e evolução ---------- */
const psy = () => 1 - .2 * S.club.staff.ps;
const sponsorIncome = () => Math.round((30 + (T(S.userId).power - 70) * 1.5) * (1 + .3 * S.club.staff.md));
const salaries = () => 15 * (S.club.staff.an + S.club.staff.ps + S.club.staff.md + (S.club.staff.co || 0));
/* =====================================================================
   EVOLUÇÃO DOS JOGADORES (modelo do Esports Manager 2026)
   · cada jogador treina até 3 atributos por vez (plano semanal); ganho lento: ≈ +2 por atributo ao ano
   · o POTENCIAL (estrelas) limita o crescimento; jovens evoluem mais rápido, veteranos perdem atributos (desgaste)
   · o TREINADOR (estrelas) multiplica o ganho e reduz o desgaste: o ganho precisa vencer o desgaste
   · estresse alto e moral baixa travam a evolução (burnout = nenhum ganho)
   Cada semana (rodada) o ganho vira XP; a cada 1,0 de XP o atributo sobe +1 (ou desce −1 se o desgaste vencer).
   ===================================================================== */
const TRAIN_MAX = 3, TR_WEEK = .05;                                        // XP base por semana e por atributo treinado (~42 semanas por temporada completa)
const COACH_F = [.7, .95, 1.2, 1.45], COACH_DEC = [1.2, 1, .85, .7], COACH_STARS = [1, 3, 4, 5];
const AGE_F = a => a <= 21 ? 1.4 : a <= 24 ? 1.1 : a <= 27 ? .8 : a <= 30 ? .5 : .25;                 // velocidade de aprendizado por idade
const DECAY_W = a => a <= 24 ? 0 : a <= 27 ? .006 : a <= 30 ? .015 : .03;                             // desgaste semanal por atributo
const potStars = p => p.pot >= 93 ? 5 : p.pot >= 86 ? 4 : p.pot >= 78 ? 3 : p.pot >= 70 ? 2 : 1;
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
const coachLv = () => S.club.staff.co || 0;
const roomOf = (p, k) => k === 'aim' || k === 'gs' ? p.pot + 2 - p.ovr : p.pot + 8 - attr(p, k);      // quanto ainda cabe até o teto do potencial
const ROLE_KEYS = {Entry:['aim', 'open', 'roam', 'clu'], Sup1:['tw', 'util', 'gs', 'info'], Sup2:['men', 'clu', 'gs', 'tw'], IGL:['led', 'info', 'gs', 'men'], Flex:['adp', 'info', 'gs', 'aim']};
/* treino automático: os 3 atributos MAIS BAIXOS entre os que importam para a posição (e ainda têm espaço até o potencial) */
function autoPlan(p){
  const rel = (ROLE_KEYS[p.role] || ROLE_KEYS.Flex).concat(['aim', 'gs']).filter((k, i, a) => a.indexOf(k) === i);
  return rel.filter(k => roomOf(p, k) > 0).sort((a, b) => attr(p, a) - attr(p, b)).slice(0, TRAIN_MAX);
}
function addXp(p, k, base){
  const cond = p.stress > 80 ? 0 : p.stress > 65 ? .6 : p.sat < 40 ? .8 : 1, room = roomOf(p, k);
  p.xp = p.xp || {}; p.xp[k] = (p.xp[k] || 0) + (room > 0 ? base * AGE_F(p.age) * COACH_F[coachLv()] * clamp(room / 6, 0, 1) * cond : 0);
}
function bump(p, k, d){ p[k] = clamp(attr(p, k) + d, 45, 99); if(k === 'aim' || k === 'gs') recalc(p); }
const mapsOf = c => Array.isArray(c.mapFocus) ? c.mapFocus : c.mapFocus ? [c.mapFocus] : [];       // aceita saves antigos (um mapa só)
function setMapFocus(i, v){                                  // define o espaço i (0–2) do foco de mapa, sem repetir mapa
  const c = S.club, arr = [0, 1, 2].map(k => mapsOf(c)[k] || ''); arr[i] = v;
  arr.forEach((x, k) => { if(v && x === v && k !== i) arr[k] = ''; });
  c.mapFocus = arr.filter(Boolean); save();
}
function trainWeek(){
  const u = T(S.userId), c = S.club, lv = coachLv(), out = [];
  squad(u).forEach(p => {
    const bench = u.bench.includes(p); p.xp = p.xp || {}; if(!p.plan) p.plan = autoPlan(p);
    p.plan.forEach(k => addXp(p, k, TR_WEEK * (bench ? .6 : 1)));
    const dec = DECAY_W(p.age) * COACH_DEC[lv];
    TR_KEYS.forEach(k => {
      p.xp[k] = (p.xp[k] || 0) - dec;
      if(p.xp[k] >= 1){ p.xp[k] -= 1; bump(p, k, 1); out.push({n:p.name, k, d:1}); }
      else if(p.xp[k] <= -1){ p.xp[k] += 1; bump(p, k, -1); out.push({n:p.name, k, d:-1}); }
    });
  });
  const mf = mapsOf(c).filter(id => MAPS.some(m => m.id === id)).slice(0, MAP_SLOTS);
  mf.forEach(id => { u.mapTr = u.mapTr || {}; u.mapTr[id] = Math.min(MAP_TR_MAX, Math.round(((u.mapTr[id] || 0) + MAP_WEEK * MAP_SPLIT[mf.length - 1]) * 10000) / 10000); });      // vários mapas ao mesmo tempo dividem o esforço
  c.evo = out; c.evoLog = out.map(x => ({...x, y:S.year, w:c.week})).concat(c.evoLog || []).slice(0, 40);
  return out;
}
function setPlan(pid, slot, key){
  const p = squad(T(S.userId)).find(x => x.id === pid); if(!p || (key && !TR_STATS[key])) return;
  const arr = [0, 1, 2].map(i => (p.plan || [])[i] || ''); arr[slot] = key;
  arr.forEach((k, i) => { if(k && k === key && i !== slot) arr[i] = ''; });                       // o mesmo atributo não ocupa dois espaços
  p.plan = arr.filter(Boolean); save();
}
