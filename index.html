  const ctrl = prep ? `<button class="btn gold" style="width:100%" data-act="start-round" ${m.ready ? '' : 'disabled'}>▶ Próximo round <kbd>Espaço</kbd></button>
      <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn sm cyan sp" data-act="auto" ${m.ready ? '' : 'disabled'}>${UI.auto ? '⏸ Parar auto' : '⏩ Assistir tudo'}</button><button class="btn sm sp" data-act="simall" ${m.ready ? '' : 'disabled'}>⚡ Simular tudo</button></div>`
    : live ? `<div class="row"><span class="mut" style="font-size:12px">Velocidade</span>${[1, 2, 4].map(s => `<button class="btn sm ${UI.speed === s ? 'gold' : ''}" data-act="speed" data-v="${s}">×${s}</button>`).join('')}<button class="btn sm sp" data-act="skip-round">⏭ Pular round</button></div>` : '';
  return `<h3>${live ? 'Round em andamento' : 'Pré-round'} · você ${my === 'atk' ? 'ATACA' : 'DEFENDE'}</h3>
    <p class="mut" style="font-size:12.5px;margin-bottom:10px">A comissão técnica conduz os rounds (estilo <b>${styleName(u)}</b>). A sua decisão foi o veto: mapa e operadores banidos.</p>
    <div class="kv"><span>Mapa</span><b class="gold">${esc(m.map.name)}</b></div>
    <div class="kv"><span>Seus bans</span><b>${esc(m.bans.a.atk)} / ${esc(m.bans.a.def)}</b></div><div class="kv"><span>Bans do rival</span><b>${esc(m.bans.b.atk)} / ${esc(m.bans.b.def)}</b></div>
    <div class="mrow" style="margin:10px 0"><span>Confiança</span>${meter(m.conf.a, 'g')}<b>${Math.round(m.conf.a)}</b></div>${ctrl}`;
}

/* ---------- loop de tempo real ---------- */
function startRound(){
  const m = CM; if(!m || !m.ready || UI.phase !== 'prep' || m.done) return;
  UI.rs = roundInit(m, null, false); UI.clock = 0; UI.plantAt = null; UI.frozen = false; UI.skip = false; UI.phase = 'live';
  UI.ev = roundNext(UI.rs); drain(); updateMatch();
  clearInterval(UI.timer); UI.timer = setInterval(tick, 50);
}
function tick(){
  if(UI.frozen || UI.phase !== 'live') return;
  UI.clock += 12 * (UI.skip ? 200 : UI.speed) * .05;
  drain(); updateClock();
}
function showEvent(ev){
  if(ev.type === 'plant') UI.plantAt = ev.t;
  (ev.L || []).forEach(l => feedAdd(l, untimed(l.c) ? null : ev.t));
}
function drain(){
  const rs = UI.rs;
  while(UI.ev && UI.ev.t <= UI.clock && !UI.frozen){
    const ev = UI.ev; UI.ev = null;
    showEvent(ev);
    if(ev.type === 'end'){ endOfRound(); return; }
    UI.ev = roundNext(rs);
  }
}
function endOfRound(){
  clearInterval(UI.timer); const m = CM;
  UI.clock = ROUND_SEC; UI.skip = false; UI.plantAt = null;
  UI.phase = m.done ? 'done' : 'prep'; updateMatch();
  if(m.done) onMatchEnd();
  else if(UI.auto) setTimeout(() => { if(CM === m && UI.phase === 'prep' && UI.auto) startRound(); }, 900);
}
function simAll(){
  const m = CM; if(!m || m.done || !m.ready || UI.phase === 'live' || UI.phase === 'interv') return;
  UI.auto = false;
  while(!m.done){ const {lines} = runRoundAuto(m, null); lines.forEach(l => feedAdd(l, untimed(l.c) ? null : l.t)); }
  UI.phase = 'done'; updateMatch(); onMatchEnd();
  simSeriesRest();
}
/* "Simular tudo" numa série: o que falta é jogado automaticamente, com a comissão decidindo os bans de operador */
function simSeriesRest(){
  while(CS && !CS.over && CM && CM.done){
    loadMap(CS.i + 1); const m = CM;
    for(const k of ['a', 'b']) setOpBans(m, k, ...aiOpBans(m, k));
    m.vp = null; m.ready = true;
    while(!m.done){ const {lines} = runRoundAuto(m, null); lines.forEach(l => feedAdd(l, untimed(l.c) ? null : l.t)); }
    UI.phase = 'done'; updateMatch(); onMatchEnd();
  }
}
function onMatchEnd(){
  const m = CM; if(m.mapDone) return;
  m.mapDone = true; UI.auto = false; clearInterval(UI.timer);
  CS.maps.push(m); CS.wins[m.winner]++;
  if(CS.wins.a >= CS.need || CS.wins.b >= CS.need || CS.maps.length >= CS.bo){        // série decidida
    CS.over = true; m.finished = true;
    const rep = finishUserMatch(CS.bo === 1 ? m : seriesResult(CS.maps, CS.bo), m.meta); m.report = rep;
    updateMatch(); renderTop(); renderSide();
    setTimeout(() => { if(CM === m) showReport(rep); }, 700);
  } else updateMatch();
}

/* ---------- simular evento inteiro ---------- */
function simEvent(){
  if(S.done || (CM && !CM.finished)) return;
  openModal(`<div class="mhead"><h2><b>Simulando</b> · ${esc(evName(S.ev))}</h2></div><p class="mut" id="simprog">Preparando…</p><div class="bar" style="margin-top:10px"><i id="simbar" style="width:0%"></i></div>`, true);
  const step = () => {
    if(S.done){ closeModal(); UI.view = 'dash'; render(); showEventEnd(); return; }
    const c = S.cur || startMatchday();
    if(c.user) finishUserMatch(quickSeries(T(c.user.a), T(c.user.b), boFor(c.user.ph, c.idx)), {idx:c.idx, lg:c.user.lg, slot:c.user.slot, ph:c.user.ph, user:true});
    else finishMatchday(null);
    const p = $('#simprog'), b = $('#simbar');
    if(p) p.textContent = S.done ? 'Concluído' : mdLabel(Math.min(S.md, totalMD() - 1)) + '…';
    if(b) b.style.width = Math.min(100, Math.round(S.md / totalMD() * 100)) + '%';
    setTimeout(step, 0);                                  // uma rodada por vez: a tela não trava
  };
  setTimeout(step, 30);
}
function showEventEnd(){
  const u = T(S.userId), er = S.evres, g = g16Status(), mine = S.uh.filter(h => h.ev === S.ev), w = mine.filter(h => h.won).length;
  const champ = S.tn ? S.tn.champ : S.final[u.league][0];
  openModal(`<div class="mhead"><h2><b>${esc(evName(S.ev))}</b> · resumo</h2></div>
    <div class="kv"><span>Sua colocação</span><b class="gold">${esc(er.lab)}</b></div>
    <div class="kv"><span>Partidas jogadas</span><b>${mine.length} · ${w}V ${mine.length - w}D</b></div>
    <div class="kv"><span>${S.tn ? 'Campeão' : 'Campeão da liga'}</span><b>${esc(T(champ).name)}</b></div>
    <div class="kv"><span>SI Points no evento</span><b class="gold">+${er.si}</b></div><div class="kv"><span>Prêmio</span><b class="gold">+${er.cash} K$</b></div>
    <div class="kv"><span>Ranking mundial</span><b>#${g.rank} · ${g.pts} pts ${g.in ? '<span class="tag fill">G16</span>' : ''}</b></div>
    ${computeAlerts().map(a => `<div class="alert ${a.lv}" style="margin-top:8px"><div class="ic">${a.ic}</div><div><h4>${esc(a.t)}</h4><p>${esc(a.x)}</p></div></div>`).join('')}
    <div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn gold" data-act="close">Continuar</button><button class="btn" data-act="global">Global Standings</button></div>`, true);
}

/* ---------- relatório pós-rodada ---------- */
function showReport(rep){
  const u = T(S.userId), al = computeAlerts(), r = rep.res, opp = r ? T(r.opp) : null;
  let head;
  if(r) head = `<div class="row" style="justify-content:center;gap:22px;margin:6px 0 14px"><div class="center">${logo(u, 'lg')}<div style="margin-top:6px;font-weight:800">${esc(u.short)}</div></div>
      <div class="center"><div class="big" style="font-size:52px;color:${r.won ? 'var(--cyan)' : 'var(--red)'}">${r.sa} : ${r.sb}</div><div class="tag ${r.won ? 'cyan' : 'red'}">${r.won ? 'VITÓRIA' : 'DERROTA'}${r.ot ? ' · OT' : ''}</div></div>
      <div class="center">${logo(opp, 'lg')}<div style="margin-top:6px;font-weight:800">${esc(opp.short)}</div></div></div>
      ${r.maps ? `<div class="kv"><span>Série ${boLabel(r.bo)}</span><b>${r.maps.map(x => `${esc(x.n)} ${x.sa}–${x.sb}`).join(' · ')}</b></div>` : `<div class="kv"><span>Mapa</span><b>${esc(r.map)}</b></div>`}<div class="kv"><span>MVP da partida</span><b class="gold">${esc(r.mvp.name)} <span class="mut">(${r.mvp.k}K/${r.mvp.d}D)</span></b></div>`;
  else head = `<p class="mut" style="margin-bottom:10px">${rep.label} foi simulada sem a sua participação.</p>`;
  const alerts = al.map(a => `<div class="alert ${a.lv}" style="margin-top:8px"><div class="ic">${a.ic}</div><div><h4>${esc(a.t)}</h4><p>${esc(a.x)}</p></div></div>`).join('');
  const drama = rep.dropped ? `<div class="alert crit" style="margin-top:8px"><div class="ic">📉</div><div><h4>VOCÊ CAIU DA LINHA DE CORTE DO G16!</h4><p>O ranking mundial mudou: você despencou para #${rep.rankAfter}. A pressão é máxima.</p></div></div>`
    : rep.gained ? `<div class="alert ok" style="margin-top:8px"><div class="ic">📈</div><div><h4>Você entrou no G16!</h4><p>Subiu para #${rep.rankAfter} no ranking mundial projetado.</p></div></div>` : '';
  const dr = rep.rankBefore - rep.rankAfter;
  const fin = S.done ? `<div class="alert info" style="margin-top:8px"><div class="ic">🏁</div><div><h4>${esc(evName(S.ev))} encerrado — ${esc(rep.place)}</h4><p>Prêmio de +${S.evres.cash} K$ e ${S.evres.si} SI Points no evento. Volte ao Painel para avançar no calendário.</p></div></div>` : '';
  const burn = u.players.filter(isBurnout);
  openModal(`<div class="mhead"><h2><b>${esc(rep.label)}</b> · relatório</h2></div>${head}
    <div class="kv"><span>SI Points ganhos</span><b class="gold">+${rep.dSI}</b></div>
    <div class="kv"><span>Ranking mundial (projeção)</span><b>#${rep.rankBefore} → #${rep.rankAfter} <span class="${dr > 0 ? 'up' : dr < 0 ? 'dn' : 'mut'}">${dr > 0 ? '▲' + dr : dr < 0 ? '▼' + -dr : ''}</span></b></div>
    ${S.done ? '' : evoRow()}
    ${S.done ? '' : `<div class="kv"><span>Caixa (semana nova)</span><b>${rep.dCash >= 0 ? '+' : ''}${rep.dCash} K$ · ${S.club.cash} K$</b></div>`}
    <div class="kv"><span>Rodada global</span><b>${rep.sim} partidas simuladas em ${rep.ms} ms</b></div>${fin}${drama}${alerts}
    ${!S.done ? `<div class="alert info" style="margin-top:8px"><div class="ic">📋</div><div><h4>Nova semana</h4><p>O elenco recuperou parte do estresse e o treino da semana rendeu (aba Treino).${burn.length ? ' Atenção ao burnout: ' + burn.map(p => p.name).join(', ') + '.' : ''}</p></div></div>` : ''}
    <div class="row" style="margin-top:16px"><button class="btn gold" data-act="report-ok">Continuar</button><button class="btn" data-act="global">Global Standings</button></div>`, true);
  if(rep.dropped) toast(`<b class="red">💥 QUEDA DO G16</b><br>Você agora está em #${rep.rankAfter}.`, 'crit');
  else if(al[0] && al[0].lv === 'crit' && !S.done) toast(`<b>${al[0].ic} ${esc(al[0].t)}</b><br><span class="mut">${esc(al[0].x)}</span>`, 'crit');
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset;
  switch(a){
    case 'pick-league': UI.pickLeague = d.l; UI.selTeam = null; render(); break;
    case 'pick-team': UI.selTeam = d.id; render(); break;
    case 'start': if(UI.selTeam){ newCareer(UI.selTeam); UI.lgTab = null; UI.view = 'dash'; render(); toast(`Carreira iniciada com <b>${esc(T(S.userId).name)}</b>. Monte o treino na aba <b>Treino</b> e ajuste o elenco no <b>Mercado</b>.`, 'ok'); } break;
    case 'continue': S = loadSave(); if(S){ UI.lgTab = null; UI.view = 'dash'; render(); } break;
    case 'wipe': if(confirm('Apagar o save atual?')){ wipeSave(); render(); } break;
    case 'nav': UI.view = d.v; UI.lgTab = null; render(); break;
    case 'global': openGlobal(); break;
    case 'close': closeModal(); break;
    case 'gtab': UI.gTab = d.l; openGlobal(); break;
    case 'gmode': UI.gMode = d.m; openGlobal(); break;
    case 'sfilter': UI.sFilter = d.l; renderSide(); break;
    case 'lgtab': UI.lgTab = d.l; render(); break;
    case 'scout': if(doScout()){ toast('📼 <b>VOD do rival revisado</b>: mapas fortes e operadores-assinatura liberados no veto.', 'ok'); rerender(); } break;
    case 'train-auto': { const u = T(S.userId); (d.p === 'all' ? squad(u) : squad(u).filter(x => x.id === +d.p)).forEach(p => { p.plan = autoPlan(p); }); save(); rerender(); break; }
    case 'hire': if(hireStaff(d.k)){ toast(`${STAFF[d.k].ico} <b>${STAFF[d.k].name}</b> agora é nível ${S.club.staff[d.k]}.`, 'ok'); render(); } break;
    case 'md-start': startUserMatch(); break;
    case 'start-round': startRound(); break;
    case 'veto-map': { const m = CM, v = m && m.vp; if(v && v.stage === 'map' && v.turn === 'a' && v.step < v.seq.length){ const mp = v.pool.find(x => x.id === d.m); if(mp){ if(v.seq[v.step] === 'ban') banMap(m, mp, 'a'); else pickMap(m, mp, 'a'); vetoStep(); } } break; }
    case 'veto-side': sideChosen(d.s); break;
    case 'next-map': nextMap(); break;
    case 'veto-ops': confirmOps(); break;
    case 'speed': UI.speed = +d.v; updateMatch(); break;
    case 'skip-round': UI.skip = true; break;
    case 'auto': UI.auto = !UI.auto; updateMatch(); if(UI.auto && UI.phase === 'prep') startRound(); break;
    case 'simall': simAll(); break;
    case 'result': if(CM && CM.report) showReport(CM.report); break;
    case 'report-ok': closeModal(); CM = null; CS = null; UI.phase = 'idle'; UI.view = 'dash'; render(); break;
    case 'sim-event': simEvent(); break;
    case 'next-event': if(S.done && S.ei + 1 < S.cal.length){ const id = advanceEvent(); UI.lgTab = null; UI.view = 'dash'; render();
      toast(`<b>${esc(evName(id))}</b> começou.${S.win ? ' A <b>janela de transferências</b> está aberta.' : ''}`, 'ok'); } break;
    case 'next-season': if(S.done && S.ei + 1 >= S.cal.length){ const info = nextSeason(); CM = null; UI.lgTab = null; UI.gTab = 'ALL'; UI.mk.tab = S.offers.length ? 'offers' : 'fa'; UI.view = 'dash'; render(); showSeason(info); } break;
    case 'season-ok': closeModal(); UI.view = d.v; render(); break;
    case 'mk-tab': UI.mk.tab = d.tab; rerender(); break;
    case 'mk-afford': UI.mk.afford = !UI.mk.afford; rerender(); break;
    case 'sign': case 'buy': {
      const p = a === 'sign' ? S.fa.find(x => x.id === +d.id) : (T(d.t) ? squad(T(d.t)).find(x => x.id === +d.id) : null), r = a === 'sign' ? signFA(+d.id) : buyPlayer(d.t, +d.id);
      if(r) toast(esc(r), 'warn'); else toast(`<b>${esc(p.name)}</b> (${p.ovr}) chegou ao banco de reservas. Promova-o no <b>Elenco</b> se quiser escalá-lo.`, 'ok');
      rerender(); break; }
    case 'sell': openSell(+d.id); break;
    case 'sell-ok': {
      const b = UI.sell && UI.sell.bids[+d.i]; if(!b) break;
      const p = mine(UI.sell.id).p, r = sellTo(UI.sell.id, b.tid, b.fee); closeModal();
      if(typeof r === 'string') toast(esc(r), 'warn');
      else toast(`<b>${esc(p.name)}</b> foi para ${esc(T(b.tid).short)}: <b class="gold">+${b.fee} K$</b>.${r ? ` <b>${esc(r.rep.name)}</b> assume a vaga de titular.` : ''}`, 'ok');
      UI.sell = null; rerender(); break; }
    case 'release': { const m = mine(+d.id), r = releasePlayer(+d.id); toast(r ? esc(r) : `<b>${esc(m.p.name)}</b> foi dispensado e voltou ao mercado.`, r ? 'warn' : 'ok'); rerender(); break; }
    case 'swap': { const r = swapLineup(+d.b, +d.s); if(r) toast(esc(r), 'warn'); rerender(); break; }
    case 'offer': { const o = S.offers[+d.i], r = answerOffer(+d.i, d.y === '1'); if(typeof r === 'string') toast(esc(r), 'warn'); else if(d.y === '1') toast(`Proposta aceita: <b class="gold">+${o.fee} K$</b>.${r ? ` <b>${esc(r.rep.name)}</b> assume a vaga de titular.` : ''}`, 'ok'); rerender(); break; }
    case 'newcareer': if(confirm('Iniciar uma nova carreira? O save atual será apagado.')){ wipeSave(); S = null; CM = null; UI.selTeam = null; UI.view = 'select'; render(); } break;
    case 'menu': openModal(`<div class="mhead"><h2><b>Menu</b></h2><div class="sp"></div><button class="btn sm" data-act="close">✕</button></div>
      <p class="mut" style="margin-bottom:12px">O progresso é salvo automaticamente no navegador (localStorage) a cada rodada, treino e transferência.</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn" data-act="newcareer">Nova carreira</button><button class="btn" data-act="close">Voltar ao jogo</button></div>`, true); break;
  }
});
document.addEventListener('keydown', e => {
  if(e.target.matches('input,textarea,select')) return;
  if(e.key === 'Escape') closeModal();
  if((e.key === 'g' || e.key === 'G') && S && UI.view !== 'select') openGlobal();
  if(UI.view === 'match' && CM && !$('#modal').classList.contains('open') && !UI.frozen){
    if((e.key === ' ' || e.key === 'Enter') && UI.phase === 'prep'){ e.preventDefault(); startRound(); }
  }
});
document.addEventListener('change', e => {
  if(S && e.target.dataset && e.target.dataset.mf){ S.club.mapFocus = e.target.value || null; save(); rerender(); return; }
  if(S && e.target.dataset && e.target.dataset.tp){ const [id, sl] = e.target.dataset.tp.split(':'); setPlan(+id, +sl, e.target.value); rerender(); return; }
  if(S && e.target.dataset && e.target.dataset.rl){ const r = setRole(+e.target.dataset.rl, e.target.value); if(r) toast(esc(r), 'warn'); rerender(); return; }
  const k = e.target.dataset && e.target.dataset.mk; if(!k || k === 'q' || !S) return; UI.mk[k] = e.target.value; rerender(); });
document.addEventListener('input', e => { if(!S || !e.target.dataset || e.target.dataset.mk !== 'q') return; UI.mk.q = e.target.value; const l = $('#mk-list'); if(l) l.innerHTML = mkListHTML(); });
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

/* ---------- boot ---------- */
render();

</script>
</body>
